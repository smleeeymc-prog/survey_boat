<!doctype html>
<html lang="ko" data-glass="lens">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>머무름의 지도 — 그래도, 여기 살고 있습니다</title>
<meta name="description" content="참여자들이 남긴 문장이 배가 되어 한 바다에 모이는 전시용 화면" />
<!-- 전시장 송출 화면이라 검색 노출은 불필요하고, 온보딩 페이지와 내용이 겹친다 -->
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="./shared/tokens.css" />
<link rel="stylesheet" href="./css/panel.css" />
<!-- 통계 표시 모듈 전용. panel.css(껍데기)와 갈라 둔 이유는 그 파일 머리말 참고 -->
<link rel="stylesheet" href="./css/stats.css" />
</head>
<body>

<!--
  ===========================================================================
  머무름의 지도 — 공동 아카이브 화면

  · 온보딩 씬(../index.html)이 "참여자 1명이 자기 배 1척을 보는 화면"이라면,
    이 화면은 "모든 참여자의 배가 한 바다에 모여 떠다니는 전시용 화면"이다.
  · 파도 셰이더와 배 모델(../assets/Scene.glb의 Ship 노드)은 온보딩 것을 그대로
    쓰고, 스케일·데이터 구조·실시간성만 다르다.
  · file:// 로 직접 열면 GLB fetch가 CORS로 막힌다. 로컬 서버가 필요하다:
        python3 -m http.server 8000   →  http://localhost:8000/statistics/
  · 쿼리 파라미터
        ?time=day|afternoon|evening|night   시간대 팔레트 (기본 night)
        ?debug=1                            프레임/인스턴스 정보 오버레이
        ?interactive=1                      드래그로 시점 조작 (리허설용)
        ?seed=46&interval=14                목업 데이터 초기 개수·유입 간격(초)
        ?depths=1                           등장 깊이 보정 — 주요 깊이마다 배 한 척 + 숫자
  ===========================================================================
-->

<canvas id="scene"></canvas>
<!-- 비네트 층 — 캔버스와 패널 사이. 값은 shared/tokens.css --scene-vignette (설문과 같다) -->
<div class="sceneVignette" aria-hidden="true"></div>

<!--
  리퀴드 글래스 2단계 — 실제 굴절.
  feTurbulence로 만든 노이즈를 변위 맵으로 써서 패널 뒤 배경 픽셀을 렌즈처럼 민다.
  color-interpolation-filters="sRGB"가 없으면 노이즈가 선형 색공간에서 생성돼
  중간값이 0.5에서 밀리고, 그 결과 굴절이 아니라 한쪽으로 쏠린 평행이동이 된다.
  Chromium 계열 외에서는 CSS의 @supports가 이 필터를 아예 참조하지 않는다(panel.css).
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="liquid-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="7" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<!--
  화면은 두 시간을 번갈아 간다 (js/panel.js 머리말).
    풍경  수평선까지 트인 바다. 왼쪽 위 하늘에 제목 카드 하나만.
    통계  바다가 한 톤 가라앉고(#stageDim) 가운데 카드(#report)에 통계가 한 장씩.
  새 배가 들어오면 어느 쪽이든 멈추고 그 배가 먼저다.
-->
<div class="stageDim" id="stageDim" aria-hidden="true"></div>

<header class="masthead" id="panel">
  <p class="m-title">그래도, 여기 살고 있습니다</p>
  <p class="m-count"><span id="countNum">0</span><span class="p-plus" id="countPlus" aria-hidden="true">+1</span></p>
  <p class="m-sub">개의 문장이 이곳에 머물러 있습니다</p>
  <!-- 풍경 시간에만 — 다음 통계 장을 예고하고, 선이 차면 통계가 시작된다 -->
  <div class="m-next" id="mNext"><div class="m-next-in">
    <i class="m-bar" aria-hidden="true"><i class="m-bar-fill" id="mBarFill"></i></i>
    <p class="m-next-text"><i>Data Analysis</i> 다음 장 <b id="mNextIdx"></b></p>
    <p class="m-next-label" id="mNextLabel"></p>
  </div></div>
</header>

<!--
  통계 보고서 한 장. 레퍼런스(dh-learning.kr)의 "Data Analysis" 카드 구성을 옮겼다.
  채우는 건 js/panel.js, 무엇을 넣을지는 js/stats/index.js 가 정한다.
-->
<article class="report" id="report" aria-live="polite">
  <div class="r-top">
    <p class="r-tag" id="rTag"></p>
    <p class="r-idx" id="rIdx"></p>
  </div>
  <div class="r-rule" aria-hidden="true"><i class="r-progress"></i></div>
  <p class="r-lead"><span class="r-label" id="rLabel"></span><span class="r-dots" aria-hidden="true"></span><span class="r-value" id="rValue"></span></p>
  <p class="r-headline" id="rHeadline"></p>
  <div class="r-chart" id="statRows"></div>
  <div class="r-foot">
    <p class="r-extra" id="rExtra"></p>
    <p class="r-period"><span id="rPeriod"></span><span class="r-legend" id="rLegend"></span></p>
  </div>
</article>

<!--
  방금 도착한 문장 — 항해일지 카드. 레퍼런스의 "Drug Facts" 라벨(항목 ······ 값, 한/영 병기,
  초 단위 기록 시각)을 배가 싣고 온 문장의 기록으로 옮겼다.
-->
<aside class="arrival" id="arrival">
  <div class="log-top">
    <p class="log-tag"><i>Ship&#8217;s Log</i> 방금 도착한 문장</p>
    <p class="log-no" id="logNo"></p>
  </div>
  <div class="log-rule" aria-hidden="true"></div>
  <p class="arrival-text" id="arrivalText"></p>
  <p class="arrival-sign" id="arrivalSign"></p>
  <dl class="log-rows">
    <div class="log-row"><dt><i>From</i> 출발한 곳</dt><dd id="logFrom"></dd></div>
    <div class="log-row"><dt><i>Status</i> 지금의 자리</dt><dd id="logStatus"></dd></div>
    <div class="log-row"><dt><i>Cargo</i> 싣고 온 것</dt><dd id="logCargo"></dd></div>
    <div class="log-row"><dt><i>Logged</i> 기록 시각</dt><dd id="logLogged"></dd></div>
  </dl>
</aside>

<div id="hud"></div>

<!--
  설문 분류값(지역·상태·키워드). 온보딩 씬의 설문 UI와 같은 파일을 읽는다.
  클래식 스크립트인 이유와 전역을 쓰는 이유는 그 파일 머리말 참고.
  모듈은 defer라 여기 먼저 놓으면 항상 먼저 실행된다.
-->
<script src="./shared/survey-taxonomy.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
