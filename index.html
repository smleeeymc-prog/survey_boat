      const wy = this._waveHeightAt(P.waveX, 0, P.t, 0);
      const slope = this._waveHeightAt(P.waveX + 0.12, 0, P.t, 0) - this._waveHeightAt(P.waveX - 0.12, 0, P.t, 0);
      const rotZ = this.mode === "between" ? Math.sin(P.t * 0.7) * 0.015 : 0;
      b.position.y = wy * bob;
      b.rotation.z = rotZ + slope * 0.9 * bob;
      b.rotation.y = (this.headingY ?? b.rotation.y) + Math.sin(P.t * 0.5) * 0.08;
      b.updateMatrixWorld(true);
      this._camFollowX = b.position.x;
      // 연기 — 치우고 정해 둔 난수로 처음부터 다시 피운다
      let seed = P.seed >>> 0;
      Math.random = () => { seed = (seed + 0x6D2B79F5) >>> 0; let x = seed; x = Math.imul(x ^ (x >>> 15), x | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
      for (const p of this.smokePool) { p.active = false; p.mesh.visible = false; }
      this.smokeSpawnTimer = 0;
      if (this.mode !== "stay" && this.mode !== "unsure") {
        const dt = 1 / 30, n = Math.round(P.smokeSec / dt);
        const v = this.mode === "between" ? CRUISE_SPEED : 0;   // 배가 나아간 만큼 연기가 뒤로 끌린다
        const baseX = b.position.x;
        for (let i = 0; i < n; i++) {
          b.position.x = baseX + v * (n - i) * dt;
          b.updateMatrixWorld(true);
          this._spawnSmoke(dt);
          this._updateSmoke(dt);
        }
        b.position.x = baseX;
        b.updateMatrixWorld(true);
      }
      Math.random = keep.random;
      // 등대·램프·물결 — 정해 둔 각도·시각으로 다시 계산
      this._lhAngle = P.lhAngle;
      this._updateLighthouse(0, THREE.MathUtils.smoothstep(this.bottleT, BOTTLE_SEA_FROM, 1.0));
      this._updateLamps(P.t);
      this._updateRipples(0);
      return fn();
    } finally {
      Math.random = keep.random;
      wu.uTime.value = keep.uTime; wu.uFlowPhase.value = keep.flow; wu.uChop.value = keep.chop; wu.uAmpScale.value = keep.amp;
      wu.uBoatX.value = keep.boatU; wu.uWaveShift.value = keep.shift; wu.uClipT.value = keep.clipT;
      this.waterMesh.position.x = keep.waterX; this.windT = keep.windT; this.fx.uFxTime.value = keep.fxTime;
      this._lhAngle = keep.lh; this._camFollowX = keep.camX; this.bottleT = keep.bottleT; this._bottleCamBlend = keep.camBlend;
      [this.bottleMat.opacity, this.bottleRimMat.opacity, this.bottleCorkMat.opacity, this.bottleWaterMat.opacity] = keep.bottleOp;
      b.position.x = keep.bx; b.position.y = keep.by; b.rotation.z = keep.brz; b.rotation.y = keep.bry;
      this.bottleGroup.position.x = keep.bottleX; wu.uClipCenter.value.x = keep.clipCx;
      b.updateMatrixWorld(true);
      this.smokePool.forEach((p, i) => {
        const k = keep.smoke[i];
        p.active = k.active; p.age = k.age; p.mesh.visible = k.vis; p.mesh.position.copy(k.pos); p.mesh.rotation.copy(k.rot);
        p.mesh.scale.setScalar(k.sc); p.mat.opacity = k.op; p.mat.color.setHex(k.col);
        p.spin = k.spin; p.drift = k.drift; p.wobble = k.wobble;
      });
      this.smokeSpawnTimer = keep.spawnTimer;
      this._updateLighthouse(0, THREE.MathUtils.smoothstep(this.bottleT, BOTTLE_SEA_FROM, 1.0));
      this._updateRipples(0);
    }
  }

  capture() {
    const saved = {
      yaw: this.orbitYaw, pitch: this.orbitPitch,
      bg: this.scene.background,
      shadow: this.shadowCatcher ? this.shadowCatcher.visible : false,
      clearAlpha: this.renderer.getClearAlpha(),
      fogNear: this.scene.fog.near, fogFar: this.scene.fog.far,
    };

    this.orbitYaw = 0; this.orbitPitch = 0;
    this.scene.background = null;
    if (this.shadowCatcher) this.shadowCatcher.visible = false;
    this.renderer.setClearAlpha(0);
    // 안개는 색을 섞을 뿐 알파를 비우지 않는다. 배경을 없앤 채로 두면 병 밖 바다가
    // 안개색으로 칠해진 채 남으므로, 찍는 동안만 안개를 멀리 밀어 둔다.
    this.scene.fog.near = 1e6; this.scene.fog.far = 1e7;

    // 정해 둔 순간(SNAP_POSE)으로 놓고 찍는다 — 같은 답이면 같은 그림
    const url = this._withSnapPose(() => {
      this._updateSpecAnchor();   // 둘러보던 각도를 0으로 돌렸으니 반짝임 자리도 기본 구도로
      this._placeCamera();
      this.renderer.render(this.scene, this.camera);
      // 알파가 남아 있는 영역(=병과 그 안)만 잘라 낸다. 정사각형으로 두면 위아래가
      // 빈 하늘로 채워져 카드마다 높이를 크게 잡아먹는다.
      return this._cropToContent(this.canvas);
    });

    this.orbitYaw = saved.yaw; this.orbitPitch = saved.pitch;
    this._updateSpecAnchor();
    this.scene.background = saved.bg;
    if (this.shadowCatcher) this.shadowCatcher.visible = saved.shadow;
    this.renderer.setClearAlpha(saved.clearAlpha);
    this.scene.fog.near = saved.fogNear; this.scene.fog.far = saved.fogFar;
    this._placeCamera();
    return url;
  }

  /**
   * '오가는 중' 출발 후 et초일 때의 속도와 뱃머리 들림.
   * 0 → 서서히 박차고(smoothstep) 순항×(1+SURGE)까지 → 순항으로 가라앉는다.
   * 뱃머리는 가속도에 비례해 들고(가속 구간 가운데서 최대), 가라앉을 때 살짝 숙인다.
   */
  _cruiseSpeedAt(et) {
    const sm = (x) => x * x * (3 - 2 * x);
    const peak = CRUISE_SPEED * (1 + CRUISE_SURGE);
    if (et < CRUISE_ACCEL_SEC) {
      const a = Math.max(0, et / CRUISE_ACCEL_SEC);
      return { v: peak * sm(a), lift: CRUISE_BOW_LIFT * 4 * a * (1 - a) };
    }
    const s = Math.min(1, (et - CRUISE_ACCEL_SEC) / CRUISE_SETTLE_SEC);
    return {
      v: CRUISE_SPEED * (1 + CRUISE_SURGE * (1 - sm(s))),
      lift: -CRUISE_BOW_LIFT * 0.25 * 4 * s * (1 - s),
    };
  }

  _wrapWave(x) { return wrapWave(x); }   // statistics/shared/ocean-core.js

  // 네 번째 인자는 "흐름 세기"가 아니라 이미 누적된 "흐름 위상"이다 (셰이더 uFlowPhase와 동일).
  // 셰이더의 gerstnerSum과 식이 한 글자라도 어긋나면 배가 수면에서 뜨거나 잠긴다.
  _waveHeightAt(x, z, t, flowPhase) {
    // 수식은 statistics/shared/ocean-core.js 하나에만 있다 — 셰이더의 gerstnerSum도
    // 같은 표에서 생성되므로 둘이 어긋날 수가 없다.
    return waveHeightAt(x, z, t, flowPhase, 0.5 + 0.9 * this.windT);
  }

  _spawnSmoke(dt) {
    if (!this.smokeAnchor) return;
    this.smokeSpawnTimer -= dt;
    if (this.smokeSpawnTimer > 0) return;
    // 간격이 짧아야 덩어리끼리 겹쳐서 하나의 기둥으로 보인다.
    // '오가는 중'에서 속도를 올리는 동안은 더 자주 뿜는다 — 힘을 쓰는 게 굴뚝에서도 보이게.
    // 순항을 넘치는 몫(0~1)만 본다 — 순항 중 연기는 예전 그대로.
    const surge = this.mode === "between"
      ? Math.max(0, (this._cruiseV ?? 0) / CRUISE_SPEED - 1) / CRUISE_SURGE : 0;
    this.smokeSpawnTimer = SMOKE_INTERVAL / (1 + 0.8 * surge);
    const free = this.smokePool.find((s) => !s.active);
    if (!free) return;

    free.active = true; free.age = 0;
    free.mesh.visible = true;
    free.mat.opacity = 1;
    free.mat.color.setHex(0xf2f2f0);
    free.mesh.scale.setScalar(SMOKE_START * SHIP_SCALE);
    free.mesh.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    free.spin = (Math.random() - 0.5) * 0.9;      // 알갱이마다 다른 회전 — 모양이 변하는 느낌
    free.drift = (Math.random() - 0.5) * 0.12;    // 옆으로 흩어지는 정도
    free.wobble = Math.random() * 6.28;           // 흔들림 위상
    const wp = new THREE.Vector3();
    this.smokeAnchor.getWorldPosition(wp);
    free.mesh.position.copy(wp);
  }

  _updateSmoke(dt) {
    for (const s of this.smokePool) {
      if (!s.active) continue;
      s.age += dt;
      const life = s.age / SMOKE_LIFE;            // 0 → 1

      s.mesh.position.y += dt * SMOKE_RISE * SHIP_SCALE;
      // 올라갈수록 옆으로 퍼지고 살짝 흔들린다
      s.mesh.position.x += dt * (SMOKE_LEAN + s.drift) * SHIP_SCALE;
      s.mesh.position.z += dt * Math.sin(s.wobble + s.age * 1.6) * 0.06 * SHIP_SCALE;
      s.mesh.rotation.y += dt * s.spin;
      s.mesh.rotation.x += dt * s.spin * 0.6;

      // 처음엔 빠르게, 나중엔 천천히 커진다
      const grow = SMOKE_START + (SMOKE_END - SMOKE_START) * Math.pow(life, 0.65);
      s.mesh.scale.setScalar(grow * SHIP_SCALE);
      // 대부분의 수명 동안 불투명하게 둔다(겹쳐도 지저분해지지 않는 이유).
      // 마지막 구간에서만 투명해지는데, 그때는 덩어리가 크고 흩어져 있어 겹침이 적다.
      // 색도 안개색 쪽으로 밀어서 알파가 빠지기 전에 이미 하늘에 녹아든 것처럼 보이게 한다.
      if (life > SMOKE_SOLID_UNTIL) {
        const tail = (life - SMOKE_SOLID_UNTIL) / (1 - SMOKE_SOLID_UNTIL);
        s.mat.opacity = 1 - tail * tail;
        s.mat.color.setHex(0xf2f2f0).lerp(this.scene.fog.color, tail * 0.85);
      } else {
        s.mat.opacity = 1;
      }

      // [버그] 병이 풍경을 감싼 뒤에도 굴뚝 연기는 유리를 뚫고 밖으로 흘러나갔다.
      // 물처럼 셰이더로 자르지 않고, 덩어리가 병 벽에 다가갈수록 흐려지다 벽에 닿으면 지운다.
      if (this.bottleT > 0.01) {
        const cx = this.boat.position.x + this._bottleRelX;
        const u = -(s.mesh.position.x - cx) / BOTTLE_SCALE_X;
        const rad = bottleRadiusAtU(u) * BOTTLE_SCALE_R;
        const dist = Math.hypot(s.mesh.position.y - BOTTLE_Y, s.mesh.position.z - this._bottleZ) + s.mesh.scale.x;
        const slack = rad - dist;
        if (slack <= 0) { s.active = false; s.mesh.visible = false; continue; }
        // 벽에 닿기 직전 구간에서만 흐려진다 — 갑자기 사라지지 않게
        const near = Math.min(1, slack / (0.30 * BOTTLE_SCALE_R));
        s.mat.opacity *= (1 - this.bottleT) + this.bottleT * near;
      }

      if (s.age >= SMOKE_LIFE) { s.active = false; s.mesh.visible = false; }
    }
  }

  /** 손가락·휠 줌의 한계. 병 화면은 더 넓다. */
  _clampZoom(z) {
    const res = this._zoomStep === "result";
    return Math.max(res ? ZOOM_MIN_RESULT : ZOOM_MIN, Math.min(res ? ZOOM_MAX_RESULT : ZOOM_MAX, z));
  }

  /** 둘러보던 각도를 카메라 전환과 같은 곡선으로 목적지까지 옮긴다. */
  _easeOrbitTo(yaw, pitch) {
    if (Math.abs(yaw - this.orbitYaw) < 1e-4 && Math.abs(pitch - this.orbitPitch) < 1e-4) {
      this._orbitT = 1;
      return;
    }
    this._orbitFrom = { yaw: this.orbitYaw, pitch: this.orbitPitch };
    this._orbitTo = { yaw, pitch };
    this._orbitT = 0;
  }

  /** 카메라를 지금 상태(단계 프리셋·둘러보기 각도·병·인트로 높이)에 맞춰 놓는다. */
  _placeCamera() {
    const cam = this._camCur;
    // 두 손가락 줌: 거리에 배수를 곱하고, 가까워질수록(zIn → 1) 바라보는 지점을 선체 가운데로 옮긴다.
    const zoom = this._zoom ?? 1;
    const zIn = Math.max(0, Math.min(1, (1 - zoom) / (1 - ZOOM_MIN)));
    const radius = radiusForAspect(cam.radius, this.camera.aspect, cam.widen) * zoom * (this._frame ? this._frame.zoom : 1) * (this._fit ?? 1);
    // 카메라가 도는 중심 = 바라보는 지점. 둘을 일치시켜야 yaw/pitch가 실제 시선각과 같아진다.
    let tX = (this._camFollowX ?? this.boat.position.x) + cam.tx, tY = cam.ty, tZ = cam.tz;
    if (zIn > 0) {
      // 선체 가운데 (배 로컬 → 월드: 헤딩만큼 돌린다). _hullMid는 모델 로드 뒤에 생긴다.
      const mid = this._hullMid || { x: 0, z: 0 };
      const a = (this.headingY ?? Math.PI) + SHIP_FORWARD_OFFSET;
      const fx = this.boat.position.x + (mid.x * Math.cos(a) + mid.z * Math.sin(a)) * SHIP_SCALE;
      const fz = (-mid.x * Math.sin(a) + mid.z * Math.cos(a)) * SHIP_SCALE;
      const k = zIn * zIn * (3 - 2 * zIn);   // smoothstep — 조금 당겼을 때는 구도가 거의 그대로
      tX += (fx - tX) * k; tY += (BOAT_FOCUS_Y - tY) * k; tZ += (fz - tZ) * k;
    }
    // 카메라가 뒤로 빠진 만큼 안개도 같이 밀어줘야 배가 안개에 묻히지 않는다.
    const fogRange = fogRangeFor(radius);
    this.scene.fog.near = fogRange.near;
    this.scene.fog.far = fogRange.far;
    // 안개가 거의 다 낀 지점부터 지우기 시작해서, 안개가 완전히 낀 지점에서 사라진다.
    const wuFade = this.waterMesh.material.uniforms;
    wuFade.uFadeNear.value = fogRange.far * 0.80;
    wuFade.uFadeFar.value = fogRange.far;
    // 기본 시점: 좌측 상단에서 내려다보는 아이소메트릭. yaw가 음수면 카메라가 배 왼쪽으로,
    // pitch 0.60rad(≈34°)은 정아이소메트릭(35.26°)에 가까운 내려다보기 각도.
    // 바라보는 지점(lookAt)은 그대로 배 — 카메라 위치만 옮긴 것.
    // ?debug=1 로 접속해 드래그로 각도를 잡은 뒤, HUD에 찍히는 값을 여기 붙여넣으면 된다.
    const yaw = BASE_YAW + this.orbitYaw;
    this._updateSpecAnchor();
    const pitch = BASE_PITCH + this.orbitPitch;
    // 병이 뜬 뒤에는 병 중심을 축으로 돈다. 그래야 아크가 병 주위를 정확히 감싼다.
    // 예전엔 bottleT가 0.01을 넘는 순간 회전 중심이 배에서 병으로 한 프레임에 갈아탔다.
    // 결과 화면을 빠져나올 때 그 지점에서 시점이 툭 튀는 원인이었다. bottleT로 이어준다.
    // 카메라 프레이밍은 유리가 차오르는 속도(bottleT)가 아니라 전용 혼합값을 쓴다.
    // 예전엔 카메라가 1.1초에 멎은 뒤에도 bottleT(지수감쇠, 1.5초 남짓)가 계속 올라와
    // 시점이 한 번 더 밀렸다 — "멈칫하고 다시 빠지는" 것처럼 보이던 원인이다.
    const bt = easeInOutCubic(Math.min(1, Math.max(0, this._bottleCamBlend ?? this.bottleT)));
    const bX = this.boat.position.x + (this._bottleRelX ?? BOTTLE_SHIFT_X) + BOTTLE_MID_X;
    const oX = tX + (bX - tX) * bt;
    const oY = tY + (BOTTLE_Y - tY) * bt;
    const oZ = tZ + ((this._bottleZ ?? BOTTLE_SHIFT_Z) - tZ) * bt;
    this.camera.position.set(
      oX + radius * Math.sin(yaw) * Math.cos(pitch),
      oY + radius * Math.sin(pitch),
      oZ + radius * Math.cos(yaw) * Math.cos(pitch)
    );
    // 병을 둘러볼 때는 수면 아래로도 내려갈 수 있어야 아래에서 올려다보는 각이 나온다.
    // 수면 아래로 내려가는 건 병을 둘러볼 때만 허용한다. 바닥을 bt로 풀어줘야
    // 병에서 빠져나오는 동안 카메라가 갑자기 위로 튀지 않는다.
    // [버그 10-06] 예전 바닥은 0.16·(1−bt)라 병이 다 떠도 0에서 멈췄다 — 아래로 돌리면 카메라가 수면에 눌려
    // 높이만 깎이고 앞뒤 거리는 줄어, 돌릴 때 저절로 줌인되는 것처럼 보였다. 병 화면에선 바닥을 아예 치운다.
    const floorY = 0.16 * (1 - bt) - 1e3 * bt;
    this.camera.position.y = Math.max(this.camera.position.y, floorY);
    // 카메라 위쪽 = 시선각(pitch)을 따라 도는 방향. 늘 시선과 직각이라 꼭대기·바닥을 넘어가도 화면이
    // 한 번에 뒤집히지 않고 이어서 돈다. 평소 각도(±90도 안)에서는 거의 (0,1,0)이라 다른 단계는 그대로다.
    if (bt > 0) {
      this.camera.up.set(-Math.sin(yaw) * Math.sin(pitch), Math.cos(pitch), -Math.cos(yaw) * Math.sin(pitch)).normalize();
    } else this.camera.up.set(0, 1, 0);
    // 인트로: 시점을 통째로 수직 이동시킨다. 카메라와 바라보는 지점을 같은 양만큼 올리므로
    // 각도는 그대로고 프레임만 위로 미끄러진다. 충분히 올라가면 바다가 안개 너머로 밀려나
    // 하늘만 남는다(수면 제한보다 뒤에 더해야 올라간 높이가 깎이지 않는다).
    this.camera.position.y += this._lift;

    // 병이 떠 있으면 병 중심을 바라본다. 드래그로 바뀐 yaw/pitch가 그대로 아크가 된다.
    // oX/oY/oZ가 이미 bottleT로 이어져 있어서, 병이 없으면 그대로 배를 본다.
    this.camera.lookAt(oX, oY + this._lift, oZ);
    this._applyViewShift();

    return { yaw, pitch, radius };
  }

  /**
   * 선체를 지난 프레임 카메라로 화면에 투영해 좌우 폭을 재고, 폭이 화면의 KEYWORD_FIT배가 되는
   * 거리 배수를 돌려준다. 투영 폭은 거리에 거의 반비례하므로 (지금 배수 × 잰 폭 / 목표 폭)으로
   * 한 번에 가깝게 가고, 매 프레임 다시 재며 수렴한다. 손가락 줌만큼은 빼고 잰다(기본 구도 기준).
   */
  _measureKeywordFit() {
    if (!this.shipNode) return null;
    if (!this._fitPts) {
      let hull = null;
      this.shipNode.traverse((o) => { if (!hull && o.isMesh && GLB_NODES.hull.test(o.name)) hull = o; });
      if (!hull) return null;
      const pos = hull.geometry.attributes.position, pts = [];
      for (let i = 0; i < pos.count; i += 9) pts.push(new THREE.Vector3().fromBufferAttribute(pos, i));
      this._fitPts = pts; this._fitHull = hull; this._fitV = new THREE.Vector3();
    }
    let lo = Infinity, hi = -Infinity;
    for (const p of this._fitPts) {
      const v = this._fitV.copy(p).applyMatrix4(this._fitHull.matrixWorld).project(this.camera);
      if (v.z > 1) continue;   // 카메라 뒤
      lo = Math.min(lo, v.x); hi = Math.max(hi, v.x);
    }
    if (!(hi > lo)) return null;
    const width = (hi - lo) * (this._zoom ?? 1);   // NDC 폭 2 = 화면 폭
    return Math.max(0.5, Math.min(1.5, (this._fit ?? 1) * width / (2 * KEYWORD_FIT)));
  }

  /** 화면 구도의 세로 이동을 투영에 건다. 값이 거의 안 바뀌면 투영 행렬을 다시 만들지 않는다. */
  _applyViewShift() {
    const shift = this._frame ? this._frame.shift : 0;
    if (this._viewShiftApplied !== null && this._viewShiftApplied !== undefined &&
        Math.abs(shift - this._viewShiftApplied) < 1e-4) return;
    this._viewShiftApplied = shift;
    // 틸트시프트 띠도 같은 만큼 옮긴다 — 화면이 위로 민 만큼 흐림 경계도 위로(index.html .tiltBlur)
    this.stage.style.setProperty("--view-shift", shift.toFixed(4));
    const w = this._viewW || window.innerWidth, h = this._viewH || window.innerHeight;
    if (shift < 1e-4) this.camera.clearViewOffset();
    else this.camera.setViewOffset(w, h, 0, h * shift, w, h);
  }

  _animate() {
    requestAnimationFrame(() => this._animate());
    const dt = Math.min(0.05, this.clock.getDelta());
    this.elapsed += dt;
    const t = this.elapsed;

    if (!this._perfDecided) {
      this._perfSamples.push(dt);
      if (this.elapsed > 2.0) {
        this._perfDecided = true;
        const avgDt = this._perfSamples.reduce((a, b) => a + b, 0) / this._perfSamples.length;
        if (avgDt > 0.03) {
          this.waterMesh.material.uniforms.uSpecOn.value = 0.0;
          // 물결도 같은 스위치에 물린다 — 픽셀마다 도는 계산이라 저사양에서 같이 꺼야 한다.
          this.waterMesh.material.uniforms.uRippleOn.value = 0.0;
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1));
        }
        this._perfSamples = null;
      }
    }

    this.windT += (this.windTarget - this.windT) * Math.min(1, dt * 1.5);

    // [버그1] 무한 바다의 전부: 타일을 매 프레임 배 위치로 재중심.
    // 배는 언제나 타일 한가운데에 있고, 파도 위상은 셰이더가 월드좌표로 계산하므로 이음매가 없다.
    // 단, 칸(WATER_CELL) 단위로만 옮긴다 — 로우폴리 면이 월드에 붙어 있어야 배가 나아가는 게 보인다.
    this.waterMesh.position.x = Math.round(this.boat.position.x / WATER_CELL) * WATER_CELL;
    if (this.shadowCatcher) this.shadowCatcher.position.x = this.boat.position.x;
    // 해와 그림자 절두체를 배에 붙여 둔다 (배가 어디로 가든 그림자가 유지되도록)
    this.sunLight.position.set(
      this.boat.position.x + this._sunOffset.x, this._sunOffset.y, this._sunOffset.z
    );
    this.sunLight.target.position.set(this.boat.position.x, 0, 0);
    this.sunLight.target.updateMatrixWorld();

    // 나아가는 느낌이 강한 상태일수록 파도의 시간축을 빠르게 (전환 시 뚝 끊기지 않게 보간)
    // '오가는 중'은 예전엔 2.0으로 파도를 크게 흘려 나아가는 척을 했다. 이제 물 면이 월드에 붙어
    // 실제로 뒤로 지나가므로(WATER_CELL) 파도는 거들기만 한다. 배가 출발하기 전부터 파도가
    // 먼저 내달리지 않게 지금 속도에 비례시킨다.
    const cruiseK = this.mode === "between" ? (this._cruiseV ?? 0) / CRUISE_SPEED : 0;
    const flowBoostTarget = this.mode === "between" ? 0.8 * cruiseK : (this.mode === "leaving" || this.mode === "returned" ? 0.5 : 0);
    if (this._flowBoost === undefined) this._flowBoost = flowBoostTarget;
    this._flowBoost += (flowBoostTarget - this._flowBoost) * Math.min(1, dt * 1.5);

    // [버그6] 선택지를 바꾼 직후 파도가 미친듯이 흐르고 배가 튀던 문제.
    // 예전 위상은 (speed + flowBoost) * t 였다. flowBoost가 0→2로 바뀌면 위상차가
    // Δflow * t 라서 "얼마나 오래 켜뒀는지"에 비례해 폭발한다 — 60초쯤 지난 뒤 '오가는 중'을
    // 고르면 120라디안(≈19바퀴)이 0.7초 안에 밀려들어왔다.
    // 흐름은 "속도"이므로 위상으로 적분해서 누적한다. 그러면 세기를 바꿔도 위상 자체는
    // 이어지고 흐르는 "속도"만 달라진다 — 파도가 제자리에서 변형된다.
    if (this._flowPhase === undefined) this._flowPhase = 0;
    this._flowPhase += this._flowBoost * dt;
    // 위상은 sin/cos 안에만 들어가므로 2π로 접어도 결과가 완전히 동일하다(정밀도 보호).
    this._flowPhase %= 2 * Math.PI;

    const wu = this.waterMesh.material.uniforms;
    wu.uTime.value = t;
    wu.uBoatX.value = this.waterMesh.position.x;   // 이름은 옛것 — 지금은 '칸에 맞춘 타일 위치'
    wu.uChop.value = 0.32 * (0.4 + 0.6 * this.windT);
    wu.uAmpScale.value = 0.5 + 0.9 * this.windT;
    wu.uFlowPhase.value = this._flowPhase;

    {
      // 2.2 → 3.2: 섬이 화면 밖(x≈3.05)에서 출발하는데 지수 감쇠라 초반에만 빨리 움직이고
      // 정작 프레임에 들어오는 구간에서 느려져서 "늦게 나타난다"는 인상을 줬다. 등장 거리
      // 자체를 줄이면 가로 화면(FOV가 훨씬 넓음)에서 '무한한 바다'에 섬이 새어 보이므로,
      // 거리는 그대로 두고 속도만 올린다.
      // 시간 기반 이징. 지수 감쇠는 ease-out만 되어 출발이 툭 튀었다.
      if (this._shoreT < 1) {
        const depart = this._shoreDepart;
        this._shoreT = Math.min(1, this._shoreT + dt / (depart ? SHORE_DEPART_SEC : SHORE_MOVE_SEC));
        this.shoreBlend = this._shoreFrom
          + (this.shoreTarget - this._shoreFrom) * (depart ? SHORE_DEPART_EASE : SHORE_EASE)(this._shoreT);
      } else {
        this.shoreBlend = this.shoreTarget;
      }
      // 섬은 선착장에 딸려 있다. 배가 멀리 나가 있어도 선착장을 다시 잡으면 그쪽으로 온다.
      this.islandGroup.position.x = this.dockX
        + THREE.MathUtils.lerp(this.islandGoneX, this.islandRestX, this.shoreBlend);
      // [버그4] 섬이 "짠" 하고 나타나던 문제 — 예전 임계값이 0.5라 슬라이드가 절반이나 진행된
      // 뒤에야 visible이 켜졌다(= 화면 중앙 근처에서 갑자기 팝인). visible은 완전히 사라졌을 때
      // 렌더를 건너뛰려는 용도일 뿐이므로 0에 가깝게 두면 화면 밖에서부터 미끄러져 들어온다.
      this.islandGroup.visible = this.shoreBlend > 0.002;
      // 여정의 뒤쪽 절반에서만 투명해진다. 앞쪽은 또렷한 채로 멀어지고,
      // 멀어질수록 안개가 옅게 덮은 위에 알파가 빠지면서 자연스럽게 지워진다.
      if (this.islandMats) {
        const fade = THREE.MathUtils.smoothstep(this.shoreBlend, 0.0, SHORE_FADE_UNTIL);
        for (const m of this.islandMats) m.opacity = fade;
        this._islandFade = fade;   // 먼 풍경은 병 구간에서 여기에 한 번 더 곱한다
      }

      let rotZ = 0;
      let targetX = 0;

      const TRAVEL_DURATION = 6.5; // '돌아온 사람'이 먼 바다에서 해안까지 오는 데 걸리는 시간(초)

      // 목적지는 전부 선착장(dockX) 기준이다. 절대 좌표 0을 쓰지 않으므로 배가 어디에
      // 있든 순간이동 없이 이어진다 (setMode의 선착장 재설정 참고).
      if (this.mode === "returned") {
        const et = t - this.modeChangedAt;
        const p = Math.min(1, et / TRAVEL_DURATION);
        targetX = THREE.MathUtils.lerp(this.dockX - RETURN_DISTANCE, this.dockX, easeOutCubic(p));
        rotZ += -0.06 * (1 - p);
      } else if (this.mode === "leaving") {
        targetX = this.dockX;
      } else if (this.mode === "between") {
        // 멈추지 않고 계속 나아감. 카메라가 배를 따라가므로 배는 화면상 제자리처럼 보이고,
        // 월드에 고정된 파도만 옆으로 흘러간다.
        // 속도 곡선(출발 → 넘침 → 순항)을 적분해 간 거리를 쌓는다. 닫힌 식(속도×시간)이면
        // 출발 가속을 넣을 수 없다.
        const et = t - this.modeChangedAt;
        const { v, lift } = this._cruiseSpeedAt(et);
        this._cruiseV = v;
        this._cruiseDist = (this._cruiseDist ?? 0) + v * dt;
        targetX = (this.cruiseFromX ?? this.dockX) - this._cruiseDist;
        // 가속하는 동안 뱃머리가 든다 — 선미가 물을 박차는 느낌. 뱃머리가 로컬 +X라 +회전이 든다.
        rotZ += Math.sin(t * 0.7) * 0.015 + lift;
      } else if (this.mode === "unsure") {
        // 표류 — 섬이 없으니 돌아갈 기준점도 없다. 있던 자리에 그대로 선다.
        targetX = this._boatEaseX ?? this.dockX;
      } else {
        targetX = this.dockX + Math.sin(t * 0.4) * 0.03;
      }

      if (this.mode !== "stay" && this.mode !== "unsure") {
        this._spawnSmoke(dt);
      }

      if (this._boatEaseX === undefined) this._boatEaseX = targetX;
      this._boatEaseX += (targetX - this._boatEaseX) * Math.min(1, dt * 3.0);
      const boatX = this._wrapWave(this._boatEaseX);

      const waveY = this._waveHeightAt(boatX, 0, t, this._flowPhase);
      const waveSlope = this._waveHeightAt(boatX + 0.12, 0, t, this._flowPhase) - this._waveHeightAt(boatX - 0.12, 0, t, this._flowPhase);

      // '아직 모르겠음'은 '돌아온 사람'과 같은 방향을 본다.
      // 땅과 바위(islandGroup)는 shoreTarget이 0이라 미끄러져 나가므로 화면에 남지 않는다.
      const headingTarget = (this.mode === "returned" || this.mode === "unsure") ? 0 : Math.PI;
      if (this.headingY === undefined) this.headingY = headingTarget;
      let headingDiff = headingTarget - this.headingY;
      headingDiff = ((headingDiff + Math.PI) % (2 * Math.PI)) - Math.PI;
      this.headingY += headingDiff * Math.min(1, dt * 1.5);

      // '오가는 중'은 파도를 잔잔하게 두면서도(windTarget 0.1) 배는 더 흔들려야
      // 나아가는 느낌이 산다. 바다가 아니라 배에만 곱한다.
      const bob = BOAT_BOB_BY_MODE[this.mode] ?? 1;
      this.boat.position.x = boatX;
      this.boat.position.y = 0.0 + waveY * bob + this._dropOffset;
      this.boat.rotation.z = rotZ + waveSlope * 0.9 * bob;
      this.boat.rotation.y = this.headingY + Math.sin(t * 0.5) * 0.08;
    }

    this._updateBottleLayout();
    this._updateSideProps();
    this._updateSmoke(dt);

    // 카메라가 배를 따라가는 지점 — 순간이동은 상한 속도로 흡수한다 (CAM_FOLLOW_MAX_SPEED 참고)
    if (this._camFollowX === undefined) this._camFollowX = this.boat.position.x;
    {
      const d = this.boat.position.x - this._camFollowX;
      const step = CAM_FOLLOW_MAX_SPEED * dt;
      this._camFollowX += Math.abs(d) <= step ? d : Math.sign(d) * step;
    }

    if (this._liftT < 1) {
      this._liftT = Math.min(1, this._liftT + dt / this._liftDur);
      this._lift = this._liftFrom + (this._liftTarget - this._liftFrom) * this._liftEase(this._liftT);
      // 카메라가 멈추기 BOAT_DROP_LEAD초 전에 배가 나타나 떨어지기 시작한다.
      if (this._liftTarget === 0 && this._dropT >= 1 && !this.boat.visible
          && (1 - this._liftT) * this._liftDur <= BOAT_DROP_LEAD) {
        this._startBoatDrop();
      }
      if (this._liftT >= 1) {
        const cb = this._onLiftDone; this._onLiftDone = null; cb && cb();
        // 떨어지는 배가 없으면(되돌아온 경우 등) 카메라가 멎는 즉시 끝난 것으로 본다.
        if (this._dropT >= 1) this._fireIntroSettled();
      }
    }
    this._updateBoatDrop(dt);
    this._updatePaint(dt);
    this._updateClouds();
    this._updateRipples(dt);

    this.bottleT += (this.bottleTarget - this.bottleT) * Math.min(1, dt * 2.2);
    // 카메라 프레이밍용 혼합값 — 카메라 전환과 같은 시간에 걸쳐 곧장 간다(중간에 멎지 않는다).
    if (this._bottleCamBlend === undefined) this._bottleCamBlend = this.bottleTarget;
    if (this._bottleCamBlend !== this.bottleTarget) {
      const step = dt / this._camDur;
      const dir = Math.sign(this.bottleTarget - this._bottleCamBlend);
      this._bottleCamBlend = Math.max(0, Math.min(1, this._bottleCamBlend + dir * step));
    }
    // 병이 오르내리는 동안 배경 하늘도 같이 건너간다. 매 프레임 다시 칠하면 낭비라
    // 눈에 보일 만큼 바뀐 프레임에만 칠한다.
    if (Math.abs(this.bottleT - this._skyBlend) > 0.004) this._refreshSky();
    // 표면 효과: 시간, 물빛 색(해 색 × 세기, 밤에는 거의 끈다)
    this.fx.uFxTime.value = t;
    this.fx.uSunCol.value.copy(this.sunLight.color).multiplyScalar(this.sunLight.intensity * (1 - 0.85 * (this._night ?? 0)));

    // 두 손가락 줌 — 손가락이 정한 목표로 부드럽게 따라간다
    if (this._zoomTarget === undefined) this._zoomTarget = 1;
    if (this._zoom === undefined) this._zoom = 1;
    this._zoom += (this._zoomTarget - this._zoom) * Math.min(1, dt * 8);
    // 화면 구도(FRAMING) — 단계가 바뀌면 카메라 전환(CAM_MOVE_SEC)과 비슷한 속도로 옮겨 간다
    const ft = this._frameTarget || FRAMING.intro;
    if (!this._frame) this._frame = { ...ft };
    const fk = Math.min(1, dt * 3);
    this._frame.shift += (ft.shift - this._frame.shift) * fk;
    this._frame.zoom += (ft.zoom - this._frame.zoom) * fk;
    // 키워드 단계 맞춤 거리 (KEYWORD_FIT). 다른 단계에서는 1로 돌아간다.
    if (this._fit === undefined) this._fit = 1;
    if (this._zoomStep !== "keywords" && this._zoomStep !== "color") this._fitTarget = 1;
    else if (!this._userDragging) this._fitTarget = this._measureKeywordFit() ?? this._fitTarget ?? 1;
    this._fit += ((this._fitTarget ?? 1) - this._fit) * fk;

    // 시간대 전환
    if (this._timeT < 1) {
      this._timeT = Math.min(1, this._timeT + dt / TIME_MOVE_SEC);
      this._applyTime(easeInOutQuint(this._timeT));
      this._night = this._nightFrom + (this._nightTo - this._nightFrom) * easeInOutQuint(this._timeT);
    }

    // 단계 전환: 각도는 그대로 두고 목적지(target)와 거리(radius)만 ease-in-out으로 이동한다.
    // 결과에서 빠져나올 때 둘러보던 각도를 카메라 전환과 같은 곡선으로 되돌린다.
    if (this._orbitT < 1) {
      this._orbitT = Math.min(1, this._orbitT + dt / CAM_MOVE_SEC);
      const k = easeInOutCubic(this._orbitT);
      this.orbitYaw = this._orbitFrom.yaw + (this._orbitTo.yaw - this._orbitFrom.yaw) * k;
      this.orbitPitch = this._orbitFrom.pitch + (this._orbitTo.pitch - this._orbitFrom.pitch) * k;
    }
    if (this._camT < 1) {
      this._camT = Math.min(1, this._camT + dt / this._camDur);
      const k = easeInOutCubic(this._camT);
      const a = this._camFrom, b = this._camTo;
      this._camCur = {
        tx: a.tx + (b.tx - a.tx) * k,
        ty: a.ty + (b.ty - a.ty) * k,
        tz: a.tz + (b.tz - a.tz) * k,
        radius: a.radius + (b.radius - a.radius) * k,
        // widen도 같이 이어줘야 한다. 빼먹으면 전환이 끝난 뒤 _camCur에 widen이 없어
        // 결과 화면이 기본 상한으로 되돌아가 병이 다시 잘린다.
        widen: a.widen + (b.widen - a.widen) * k,
      };
    }
    // 병이 나타나는 곡선과 바다가 빠지는 곡선을 떼어 놓는다.
    //
    // 예전에는 둘 다 bottleT에 그대로 비례했다. 수치로는 교차 페이드인데 눈에는 아니었다 —
    // 배경이 바다일 때는 반쯤 켜진 코르크와 안쪽 물이 묻혀 안 보이다가, 배경이 크림색으로
    // 밝아지고 나서야 같은 불투명도가 갑자기 드러난다. "페이드가 끝났을 때 병 아래쪽이랑
    // 물이 갑자기 나타난다"는 게 이것이다.
    //
    // 그래서 병은 앞쪽에 몰아서 먼저 자리를 잡고, 바다는 조금 늦게 빠지기 시작한다.
    // 바다가 사라질 무렵 병은 이미 거기 있다.
    const bIn = THREE.MathUtils.smoothstep(this.bottleT, 0.0, BOTTLE_IN_UNTIL);
    const seaOut = THREE.MathUtils.smoothstep(this.bottleT, BOTTLE_SEA_FROM, 1.0);
    this.bottleMat.opacity = 0.28 * bIn;
    this.bottleRimMat.opacity = 0.62 * bIn;
    this.bottleCorkMat.opacity = 0.9 * bIn;
    this.bottleWaterMat.opacity = 0.9 * bIn;
    if (this.bottleT < 0.01) this.bottleGroup.visible = false;
    // 병을 넘는 섬 부분(뒷산)은 셰이더가 병 모양에 맞춰 눌러 담는다(_fitToBottle) — 물 클리핑
    // 유니폼을 같이 쓰므로 여기서 따로 할 일이 없다. (얼마나 넘는지는 로드할 때 [병] 로그로 찍힌다)
    this._updateLighthouse(dt, seaOut);
    this._updateLamps(t);
    // 병은 scene에 직접 붙어 있어 배를 따라가지 않았다. '오가는 중'처럼 배가 이동하는
    // 상태로 결과 화면에 오면 병만 원점에 남아 화면 밖으로 사라진다.
    this.bottleGroup.position.x = this.boat.position.x + this._bottleRelX;
    this.bottleGroup.position.z = this._bottleZ;

    // 바다를 병 안으로 가둔다. bottleT가 0→1로 가는 동안 반지름과 길이를 넓은 값에서
    // 병 크기까지 좁혀와서, 바다가 병 속으로 빨려드는 것처럼 보이게 한다.
    const wc = this.waterMesh.material.uniforms;
    if (this.bottleT > 0.01) {
      const bx = this.boat.position.x + this._bottleRelX;
      wc.uClipOn.value = 1.0;
      wc.uClipCenter.value.set(bx, BOTTLE_Y, this._bottleZ);
      wc.uClipT.value = seaOut;
    } else {
      wc.uClipOn.value = 0.0;
    }

    const { yaw, pitch, radius } = this._placeCamera();

    if (this.debugCam && this.camDebugEl) {
      this.camDebugEl.textContent =
        `yaw: ${yaw.toFixed(3)}\npitch: ${pitch.toFixed(3)}\nradius: ${radius.toFixed(2)}\n(드래그로 각도 잡고 이 값을 baseYaw/basePitch/radius에 붙여넣기)`;
    }

    if (this._pixelWarm) { const warm = this._pixelWarm; this._pixelWarm = null; warm(); }   // _prewarm 참고
    if (this.visible) this.renderer.render(this.scene, this.camera);
  }
}

try {
  window.BottleScene = new BottleScene();
  selfCheck(window.BottleScene);
  // 그림 톤 테스트 메뉴(임시, 오른쪽 위 "룩") — 지울 때는 이 줄과 dev/look-lab.js 만 지우면 된다
  import("./dev/look-lab.js").then((m) => m.installLookLab(window.BottleScene)).catch((e) => console.warn("[look-lab]", e));
} catch (err) {
  console.error("BottleScene 초기화 실패:", err);
}

// 자기검증(콘솔) — 조용히 깨지면 한참 뒤에나 눈치채는 것들만 딱 두 개.
// 실패해도 씬은 그대로 돌아가고, 콘솔에 빨간 assert만 남는다.
function selfCheck(s) {
  // 0) importmap이 선언한 three 버전과 실제로 로드된 리비전이 같은가.
  //    importmap은 HTML 인라인이라 두 화면에 각각 적힌다 — 한쪽만 올리면 두 화면이
  //    다른 three로 돌면서 셰이더나 로더 동작이 조용히 갈라진다.
  console.assert(
    THREE.REVISION === THREE_REVISION,
    `[selfCheck] three 리비전 불일치 — shared/deps.js는 ${THREE_VERSION}인데 로드된 건 r${THREE.REVISION} ` +
    `(importmap을 고쳤으면 shared/deps.js도 같이 올릴 것)`
  );

  // 0-1) 설문의 키워드 10개가 전부 배의 요소와 이어져 있는가. 키워드를 새로 넣거나 이름을
  //      바꾸면서 glb-nodes.js KEYWORD_NODES 를 빠뜨리면 그 키워드만 골라도 아무것도 안 나온다.
  const kwTaxonomy = window.SURVEY_TAXONOMY.KEYWORDS;
  const kwMissing = kwTaxonomy.filter((k) => !(KEYWORD_NODES[k] && KEYWORD_NODES[k].length));
  const kwExtra = Object.keys(KEYWORD_NODES).filter((k) => kwTaxonomy.indexOf(k) === -1);
  console.assert(!kwMissing.length && !kwExtra.length,
    `[selfCheck] 키워드 ↔ 요소 매핑 불일치 — 요소 없음: ${kwMissing.join(",") || "-"} / 설문에 없는 키워드: ${kwExtra.join(",") || "-"}`);

  // 1) 파도 랩어라운드가 정말 "위상 불변"인가.
  //    깨지면 '오가는 중'으로 오래 항해할 때 바다가 순간적으로 튄다.
  const a = s._waveHeightAt(3.7, 0.9, 12.5, 0);
  const b = s._waveHeightAt(3.7 + s.WAVE_WRAP_DOMAIN, 0.9, 12.5, 0);
  console.assert(
    Math.abs(a - b) < 1e-6,
    "[selfCheck] WAVE_WRAP_DOMAIN이 유효파장(wavelength/dirX)의 공배수가 아님 — 랩 순간 바다가 튄다", a, b
  );

  // 2) 배 들썩임(JS)과 물 표면(GLSL)이 같은 파도를 쓰고 있는가.
  //    둘 중 하나만 고치면 배가 수면에서 붕 뜨거나 잠긴다.
  const glsl = s.waterMesh.material.vertexShader;
  s.gerstnerWaves.forEach((w) => {
    console.assert(
      glsl.includes(`/ ${w.wavelength};`),
      `[selfCheck] 파장 ${w.wavelength}가 셰이더에 없음 — JS와 GLSL 파도 정의가 어긋났다`
    );
  });

  // 3) 바다 끝을 가리는 안개가 실제로 물에 걸려 있는가.
  //    scene.fog는 "쓰겠다"고 선언한 재질에만 적용돼서, 셰이더를 손대다 청크나 fog:true를
  //    떨어뜨리면 바다만 안개를 안 먹고 수평선이 다시 직선으로 잘린다(조용히 깨지는 쪽).
  const mat = s.waterMesh.material;
  console.assert(
    mat.fog === true && !!mat.uniforms.fogColor && mat.fragmentShader.includes("fog_fragment"),
    "[selfCheck] 물 재질에 안개 배선이 빠졌다 — 수평선에 하드 경계가 다시 생긴다"
  );

  // 3-1) 흐름 세기를 바꿔도 파도가 "제자리에서" 변형되는가 — 오래 켜둔 뒤일수록 잘 터진다.
  //      위상이 다시 시간에 비례하는 식(flow * t)으로 돌아가면, t가 큰 시점에서 흐름값이
  //      조금만 달라져도 파도가 통째로 밀려 배가 튄다. 늦은 시각 t에서 검사해야 잡힌다.
  const tLate = 1000;
  const drift = Math.abs(s._waveHeightAt(0.3, 0, tLate, 0.10) - s._waveHeightAt(0.3, 0, tLate, 0.11));
  console.assert(
    drift < 0.01,
    `[selfCheck] 흐름값을 0.01 바꿨을 뿐인데 파도 높이가 ${drift.toFixed(4)} 튐 — 위상이 시간에 비례하고 있다(선택지 전환 시 파도 폭주)`
  );

  // 4) 가장 많이 줌아웃한 상태(결과 화면)에서도 안개가 바다 타일 끝보다 먼저 짙어지는가.
  //    여기가 뒤집히면 안개가 다 끼기 전에 타일이 끝나서 경계선이 그대로 보인다.
  //    타일 크기·카메라 거리·안개 범위 중 아무거나 건드리면 조용히 깨지는 조합.
  const tileRadius = s.waterMesh.geometry.parameters.width / 2;
  const worstFar = fogRangeFor(CAM_RADIUS.far).far;
  console.assert(
    worstFar < tileRadius + CAM_RADIUS.far,
    `[selfCheck] 최대 줌아웃에서 fog.far(${worstFar})가 타일 끝(${tileRadius + CAM_RADIUS.far})보다 멀다 — 바다 경계가 드러난다`
  );
}
</script>
