    // 카메라 각도 튜닝용: ?debug=1로 접속하면 현재 yaw/pitch/radius를 화면에 실시간 표시
    this.debugCam = new URLSearchParams(location.search).has("debug");
    this.camDebugEl = document.getElementById("camDebug");
    if (this.debugCam && this.camDebugEl) this.camDebugEl.classList.add("show");

    this.clock = new THREE.Clock();
    this._resize();
    window.addEventListener("resize", () => this._resize());
    this._animate();
  }

  _resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  _bindDrag() {
    let dragging = false, lastX = 0, lastY = 0;
    const c = this.canvas;
    c.style.touchAction = "none";
    c.style.cursor = "grab";
    c.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      c.style.cursor = "grabbing";
      this._orbitT = 1;   // 손으로 잡으면 자동 복귀는 멈춘다
      try { c.setPointerCapture(e.pointerId); } catch (_e) {}
    });
    c.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (this.bottleT > 0.5) {
        // 병이 뜬 뒤에는 각도 제한을 풀고, 지금 보고 있던 각도에서 그대로 이어서
        // 병 둘레를 아크로 돈다. 좌우는 끝없이, 위아래는 뒤집히지 않게만 막는다.
        this.orbitYaw -= dx * 0.005;
        // 제한은 orbitPitch가 아니라 "실제 시선각(basePitch + orbitPitch)"에 걸어야 한다.
        // 예전처럼 orbitPitch를 ±1.45로 묶으면 basePitch 0.60이 더해져 아래로는 -0.85(-49도)까지밖에
        // 못 내려가, 병 바닥을 올려다볼 수 없었다. 이제 위아래로 ±1.45(±83도)까지 균등하게 열린다.
        this.orbitPitch = Math.max(-1.45 - basePitchOf(), Math.min(1.45 - basePitchOf(), this.orbitPitch + dy * 0.004));
      } else {
        // 망원렌즈 + 제한된 회전 범위: 섬/배경을 모델링해야 하는 각도 범위를 좁게 유지
        this.orbitYaw = Math.max(-0.85, Math.min(0.85, this.orbitYaw - dx * 0.0032));
        this.orbitPitch = Math.max(-0.2, Math.min(0.55, this.orbitPitch + dy * 0.0024));
      }
    });
    const end = () => { dragging = false; c.style.cursor = "grab"; };
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
    c.addEventListener("pointerleave", end);
  }

  /**
   * 물 재질.
   * 프레넬 + 램버트 + 스펙큘러 조합은 dli/waves의 Tessendorf 오션 데모를 참고했다.
   * 텍스처 이미지 없이 수식만으로 바다를 만드는 접근이라 로우폴리 스타일과 잘 맞는다.
   * 표면 변위는 Gerstner 파도 세 개(파장 2.2 / 1.3 / 0.8)를 겹쳐 만든다.
   */
  _buildWaterMaterial() {
    return new THREE.ShaderMaterial({
      transparent: true,
      // 병을 굴려 아래에서 올려다볼 수 있으므로 뒷면도 그린다.
      // 평면 하나라 비용이 거의 없고, 노멀은 프래그먼트에서 어차피 뒤집어 쓴다.
      side: THREE.DoubleSide,
      // [버그5] 바다에 안개가 안 먹던 문제 — scene.fog는 "안개를 쓰겠다고 선언한" 재질에만 적용된다.
      // 물은 커스텀 ShaderMaterial이라 그 선언이 없어서, 섬·배만 흐려지고 바다는 타일 끝까지
      // 원래 색을 유지한 채 하늘과 직선으로 잘렸다(수평선의 하드 경계). 볼륨 안개나 별도 모델을
      // 만들 필요 없이, Three.js가 이미 갖고 있는 안개 청크를 그대로 끼워넣으면 끝난다.
      fog: true,
      uniforms: THREE.UniformsUtils.merge([
        THREE.UniformsLib.fog,
        {
          uOceanColor: { value: new THREE.Color(0x4bb2e0) },
          uSkyColor: { value: new THREE.Color(0xe8f7ff) },
          // 물의 반사용 태양 방향. 씬의 DirectionalLight(배·섬을 비추는 빛)와는 별개 값이다.
        // 수면 반사는 거울이라, 태양이 카메라 반대편(+z)에 있으면 반짝이는 띠가 화면 뒤로 빠져
        // 카메라를 돌리기 전에는 보이지 않는다. 기본 시점(yaw -0.45 / pitch 0.60)에서
        // 반사가 카메라로 오도록 방위각을 -z 쪽으로 돌렸다.
        // y는 원래 값(0.74)에 가깝게 유지 — 이 성분이 물의 확산광 밝기를 결정해서, 낮추면 바다가 어두워진다.
        uSunDirection: { value: new THREE.Vector3(0.30, 0.72, -0.62).normalize() },
        // 반짝임 전용 태양 방향. 확산광(uSunDirection)과 분리해 카메라와 같이 돌린다.
        uSpecSunDir: { value: new THREE.Vector3(0.30, 0.72, -0.62).normalize() },
          uExposure: { value: 1.15 },
          uTime: { value: 0 },
          uBoatX: { value: 0 },
          uChop: { value: 0.13 },
          uAmpScale: { value: 0.5 },
          uFlowPhase: { value: 0 },
          uSpecOn: { value: 1.0 },
        // 반짝임 조절 손잡이. 지수가 낮을수록 넓게 퍼지고, 세기는 밝기다.
        // 물리값이 아니라 눈으로 맞추는 값이라 상수로 박지 않고 밖으로 빼둔다.
        uSpecPower: { value: 400.0 },
        uSpecStrength: { value: 3.0 },
        // 반짝임 색. 시간대에 따라 바뀐다 (낮 흰빛 → 노을 주황 → 밤 푸른 달빛)
        uSpecColor: { value: new THREE.Color(0xfffcf2) },
        // 물결 — xy는 월드 XZ 중심, z는 반지름, w는 세기(0이면 그 자리는 건너뛴다)
        uRippleOn: { value: 1.0 },
        uRipples: { value: Array.from({ length: RIPPLE_MAX }, () => new THREE.Vector4(0, 0, 0, 0)) },
        uRippleColor: { value: new THREE.Color(0xffffff) },
        // 배 항적 — xy는 배 월드 XZ, z는 진행 방향(라디안), w는 세기
        uWake: { value: new THREE.Vector4(0, 0, 0, 0) },
        // 유리병이 나타나면 바다를 병 안쪽으로 가둔다.
        // uClipOn이 0이면 아무 일도 하지 않으므로 평소 렌더에는 영향이 없다.
        uFadeNear: { value: 100.0 },
        uFadeFar: { value: 120.0 },
        uClipOn: { value: 0.0 },
        uClipCenter: { value: new THREE.Vector3(0, 0, 0) },
        uClipT: { value: 0.0 },
        uClipScaleX: { value: BOTTLE_SCALE_X },
        uClipScaleR: { value: BOTTLE_SCALE_R },
        uProfU: { value: BOTTLE_PROFILE.map((p) => p[0]) },
        uProfR: { value: BOTTLE_PROFILE.map((p) => p[1]) },
        },
      ]),
      vertexShader: `
        #include <fog_pars_vertex>
        uniform float uTime;
        uniform float uBoatX;
        uniform float uChop;
        uniform float uAmpScale;
        // 흐름 가속분은 "속도"가 아니라 이미 쌓인 "위상"으로 들어온다 — 아래 JS의 _flowPhase 참고.
        // (예전엔 (speed + uFlowBoost) * t 였는데, 그러면 uFlowBoost가 조금만 바뀌어도
        //  위상이 t배로 증폭돼 밀리면서 파도가 순간적으로 미친듯이 흘렀다)
        uniform float uFlowPhase;
        varying vec3 vWorldPos;

        vec3 gerstnerSum (vec2 worldXZ, float t) {
          vec3 r = vec3(0.0);
          float k; float theta; float amp; float c;

          k = 6.28318530718 / 2.2;
          theta = k * (1.0 * worldXZ.x + 0.15 * worldXZ.y) - (1.1 * t + uFlowPhase);
          amp = 0.05 * uAmpScale; c = cos(theta);
          r.x += uChop * amp * 1.0 * c; r.z += uChop * amp * 0.15 * c; r.y += amp * sin(theta);

          k = 6.28318530718 / 1.3;
          theta = k * (0.5 * worldXZ.x + -0.85 * worldXZ.y) - (1.6 * t + uFlowPhase);
          amp = 0.03 * uAmpScale; c = cos(theta);
          r.x += uChop * amp * 0.5 * c; r.z += uChop * amp * -0.85 * c; r.y += amp * sin(theta);

          k = 6.28318530718 / 0.8;
          theta = k * (-0.7 * worldXZ.x + 0.4 * worldXZ.y) - (2.1 * t + uFlowPhase);
          amp = 0.018 * uAmpScale; c = cos(theta);
          r.x += uChop * amp * -0.7 * c; r.z += uChop * amp * 0.4 * c; r.y += amp * sin(theta);

          return r;
        }

        void main () {
          // [버그1] 무한 바다 — 타일은 매 프레임 배 위치로 재중심되고(JS: waterMesh.position.x),
          // 파도 위상만 "진짜 월드좌표"(로컬 + 배 위치)로 계산한다.
          // 즉 타일은 언제나 배를 중심으로 덮고 있고, 파도만 월드에 고정된 것처럼 배를 스쳐 지나감.
          // 배가 실제로 이동하니까(mode='between') 흐르는 느낌은 저절로 생긴다 — 예전의
          // mod() 컨베이어처럼 지오메트리를 옆으로 밀어낼 필요가 없고, 그래서 끝이 드러나지도 않음.
          vec2 worldXZ = vec2(position.x + uBoatX, position.z);
          vec3 wave = gerstnerSum(worldXZ, uTime);

          vec4 worldPos = modelMatrix * vec4(position + wave, 1.0);
          vWorldPos = worldPos.xyz;
          // fog_vertex 청크가 mvPosition을 그대로 참조하므로 이름을 맞춰서 미리 만들어둔다.
          vec4 mvPosition = viewMatrix * worldPos;
          gl_Position = projectionMatrix * mvPosition;
          #include <fog_vertex>
        }
      `,
      fragmentShader: `
        #include <fog_pars_fragment>
        uniform vec3 uOceanColor;
        uniform vec3 uSkyColor;
        uniform vec3 uSunDirection;
        uniform vec3 uSpecSunDir;
        uniform float uExposure;
        uniform float uSpecOn;
        uniform float uSpecPower;
        uniform float uSpecStrength;
        uniform vec3 uSpecColor;
        // 먼 바다를 아예 투명하게 지운다. 안개만으로는 '안개색 판'이 남아서
        // 하늘과 만나는 자리에 경계선이 보인다. 알파를 0으로 빼면 하늘이 그대로 비쳐 경계가 없다.
        uniform float uFadeNear;
        uniform float uFadeFar;
        uniform float uClipOn;
        uniform vec3 uClipCenter;
        uniform float uClipT;
        uniform float uClipScaleX;
        uniform float uClipScaleR;
        uniform float uProfU[7];
        uniform float uProfR[7];
        uniform float uTime;          // 정점 셰이더에만 있던 것 — 물결 울렁임에 필요하다
        uniform float uRippleOn;
        uniform vec4 uRipples[8];
        uniform vec3 uRippleColor;
        uniform vec4 uWake;

        /** 거리 d가 반지름 r에서 halfW 안쪽이면 1, 밖이면 0. 가장자리는 부드럽게. */
        float ringAt(float d, float r, float halfW) {
          return 1.0 - smoothstep(0.0, halfW, abs(d - r));
        }

        /**
         * 물체 둘레의 물결.
         *
         * 안쪽 첫 링은 물체를 그대로 감싸되 바깥쪽 굵기만 울렁인다. 각도를 쓰면 atan이
         * 픽셀마다 들어가 비싸므로, 평면파(sin(a*x + b*z + t))로 대신했다 — 링을 따라
         * 굵기가 물결치는 결과는 같고 훨씬 싸다.
         *
         * 파도를 따라가는 것도 마찬가지다. 수면 높이는 이미 vWorldPos.y로 들어와 있으니,
         * 그만큼 링을 안팎으로 밀어주면 "파도에 따라 드러나는 자리가 달라진다"로 읽힌다.
         * 실루엣과 파면의 교차를 실제로 푸는 것보다 비교가 안 되게 싸다.
         */
        float rippleAt(vec2 p, float waveH) {
          float acc = 0.0;
          float shift = waveH * 0.9;
          // 울렁임은 원마다 재지 않는다. 수면 전체에 깔린 무늬 하나를 원들이 함께 쓰면
          // sin이 원 개수만큼 돌지 않아 훨씬 싸고, 링끼리 결이 맞아 오히려 자연스럽다.
          // (원마다 계산했을 때 소프트웨어 렌더러에서 프레임 시간이 48% 늘었다.)
          float halfW = 0.16 * 0.5 * (1.0 + 0.45 * sin(p.x * 5.0 + p.y * 3.7 + uTime * 1.6));
          float gap = 0.34 * (1.0 + 0.18 * sin(p.x * 2.6 - p.y * 3.1 - uTime * 0.9));
          float gapFar = gap * 1.9;
          for (int i = 0; i < 8; i++) {
            vec4 src = uRipples[i];
            if (src.w <= 0.001) continue;
            float d = distance(p, src.xy) + shift;
            float inner = ringAt(d, src.z + halfW, halfW);
            float mid   = ringAt(d, src.z + gap, 0.07) * 0.55;
            float far   = ringAt(d, src.z + gapFar, 0.056) * 0.30;
            acc = max(acc, (inner + mid + far) * src.w);
          }
          return acc;
        }

        /** 나아가는 배 뒤로 끌리는 V자 항적. 배 기준 좌표로 옮겨 놓고 그린다. */
        float wakeAt(vec2 p) {
          if (uWake.w <= 0.001) return 0.0;
          vec2 rel = p - uWake.xy;
          float c = cos(-uWake.z), s = sin(-uWake.z);
          vec2 loc = vec2(rel.x * c - rel.y * s, rel.x * s + rel.y * c);
          float behind = -loc.x;                       // 진행 방향 반대쪽만
          if (behind <= 0.0) return 0.0;
          float spread = 0.42 * behind;
          float arm = 1.0 - smoothstep(0.0, 0.13, abs(abs(loc.y) - spread));
          return arm * exp(-behind * 0.55) * uWake.w;
        }

        // 병 옆면의 반지름은 축을 따라 변한다. 축 위치 ax(스케일 전)에서의 반지름.
        // 병 밖이면 0을 돌려주므로 그 구간의 물은 통째로 사라진다.
        float bottleRadiusAt(float ax) {
          if (ax <= uProfU[0] || ax >= uProfU[6]) return 0.0;
          for (int i = 0; i < 6; i++) {
            if (ax >= uProfU[i] && ax <= uProfU[i + 1]) {
              float t = (ax - uProfU[i]) / max(1e-5, uProfU[i + 1] - uProfU[i]);
              return mix(uProfR[i], uProfR[i + 1], t);
            }
          }
          return 0.0;
        }
        varying vec3 vWorldPos;

        vec3 hdr (vec3 color, float exposure) {
          return 1.0 - exp(-color * exposure);
        }

        void main () {
          // 병 안쪽(X축을 중심축으로 하는 원통)만 남기고 나머지 바다는 버린다.
          // 반지름과 X 범위를 크게 잡았다가 줄여오면 바다가 병 속으로 빨려드는 것처럼 보인다.
          // 병 바깥 바다를 "사라지게" 한다. 면적을 좁혀오면 수면이 슈루룩 빨려드는 것처럼
          // 보여서 어색했다. 경계는 그대로 두고 병 바깥쪽만 서서히 투명해지게 바꿨다.
          float clipA = 1.0;
          if (uClipOn > 0.5) {
            vec3 rel = vWorldPos - uClipCenter;
            // LatheGeometry를 Z로 +90도 돌려 축을 X로 눕혔다. 그래서 로컬 축 좌표는 -x다.
            float ax = -rel.x / uClipScaleX;
            float rad = bottleRadiusAt(ax) * uClipScaleR;
            // 병 안쪽이면 1, 바깥이면 0. 경계는 살짝 부드럽게 이어준다.
            float inside = 1.0 - smoothstep(rad - 0.08, rad + 0.08, length(rel.yz));
            // uClipT가 0이면 전부 그대로 보이고, 1이면 병 바깥이 완전히 사라진다.
            clipA = mix(1.0, inside, uClipT);
            if (clipA < 0.004) discard;
          }

          // (예전엔 여기서 컨베이어 랩어라운드로 찢어진 트라이를 fwidth로 감지해 discard 했는데,
          //  컨베이어 자체를 없앴으므로 찢어질 일이 없음. discard는 early-Z도 깨뜨려서 같이 제거)
          // 플랫 셰이딩: 픽셀별 스크린공간 미분으로 삼각형 "면" 노멀을 직접 계산 → 로우폴리 각진 느낌
          vec3 normal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
          if (normal.y < 0.0) normal = -normal;

          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          vec3 sunDir = normalize(uSunDirection);

          float fresnel = 0.03 + 0.65 * pow(1.0 - max(dot(normal, viewDir), 0.0), 5.0);
          vec3 sky = fresnel * uSkyColor;
          float diffuse = clamp(dot(normal, sunDir), 0.0, 1.0);
          vec3 water = (1.0 - fresnel) * uOceanColor * diffuse;

          // 반짝임만 별도의 태양 방향을 쓴다 (아래 _updateSpecAnchor 참고).
          vec3 reflectDir = reflect(-normalize(uSpecSunDir), normal);
          float spec = pow(max(dot(reflectDir, viewDir), 0.0), uSpecPower);
          vec3 sparkle = uSpecColor * spec * uSpecStrength * uSpecOn;

          vec3 color = sky + water + sparkle;
          if (uRippleOn > 0.5) {
            vec2 pXZ = vWorldPos.xz;
            float foam = rippleAt(pXZ, vWorldPos.y) + wakeAt(pXZ);
            color += uRippleColor * min(1.0, foam) * 0.55;
          }
          // 거리 페이드: 안개가 다 낀 지점에서 바다를 완전히 지워 경계가 드러나지 않게 한다.
          float edgeFade = 1.0 - smoothstep(uFadeNear, uFadeFar, length(cameraPosition - vWorldPos));
          gl_FragColor = vec4(hdr(color, uExposure), 0.92 * clipA * edgeFade);
          // 안개는 색을 다 계산한 뒤 마지막에 섞는다 — 멀어질수록 바다가 하늘색으로 녹아
          // 타일 경계(가장자리)가 눈에 띄기 전에 사라진다.
          #include <fog_fragment>
        }
      `,
    });
  }

  _buildWater() {
    // 타일 반경(SIZE/2 = 7)은 "카메라~배 최대 거리(radius 5.5) + 안개 끝(4.8)"을 커버할 만큼만.
    // 타일이 배를 따라다니므로 이보다 더 키울 이유가 없고, 가장자리는 항상 안개 안에 묻힌다.
    const SEGMENTS = 71, SIZE = 31.5;   // 경계를 5% 넓히고 셀 크기는 유지
    const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEGMENTS, SEGMENTS);
    geo.rotateX(-Math.PI / 2);

    const cellSize = SIZE / SEGMENTS;
    const jitterPos = geo.attributes.position;
    for (let i = 0; i < jitterPos.count; i++) {
      jitterPos.array[i * 3] += (Math.random() - 0.5) * cellSize * 0.6;
      jitterPos.array[i * 3 + 2] += (Math.random() - 0.5) * cellSize * 0.6;
    }
    jitterPos.needsUpdate = true;

    const mat = this._buildWaterMaterial();
    const mesh = new THREE.Mesh(geo, mat);
    this.world.add(mesh);
    this.waterMesh = mesh;

    // 배 들썩임 계산(_waveHeightAt)용 — 위 셰이더 gerstnerSum과 값이 반드시 같아야 함
    this.gerstnerWaves = [
      { dirX: 1.0, dirZ: 0.15, wavelength: 2.2, ampBase: 0.05, speed: 1.1 },
      { dirX: 0.5, dirZ: -0.85, wavelength: 1.3, ampBase: 0.03, speed: 1.6 },
      { dirX: -0.7, dirZ: 0.4, wavelength: 0.8, ampBase: 0.018, speed: 2.1 },
    ];
  }

  async _loadModels() {
    try {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(MODEL_URL);
      const root = gltf.scene;

      const rock = root.getObjectByName("Rock");
      const beachhouse = root.getObjectByName("Beachhouse");
      const ship = root.getObjectByName("Ship");

      if (rock) {
        this.rockMats = [];
        rock.traverse((child) => {
          if (child.isMesh) {
            child.material = child.material.clone();
            this.rockMats.push(child.material);
          }
        });
        this.islandGroup.add(rock);
        if (this._pendingRegionHex !== undefined) this._applyRockColor(this._pendingRegionHex);
      }

      if (beachhouse) {
        this.islandGroup.add(beachhouse);
      }

      // 멀어질 때 서서히 지우려면 재질을 투명하게 다룰 수 있어야 한다.
      // 안개만으로는 '안개색 덩어리'가 남아 하늘과 어긋나 보인다(바다 경계와 같은 문제).
      this.islandMats = [];
      this.islandGroup.traverse((c) => {
        if (!c.isMesh || !c.material) return;
        if (this.islandMats.indexOf(c.material) === -1) {
          c.material.transparent = true;
          this.islandMats.push(c.material);
        }
      });

      if (ship) {
        // Seagull(갈매기)·Tube(구명튜브)는 GLB상 Ship과 형제 노드지만, 실제 좌표는
        // 배 바로 위(갈매기)와 뱃전(튜브)이다. attach()는 월드 변환을 유지한 채 부모만 바꾸므로
        // 블렌더에서 잡아둔 상대 위치 그대로 배의 자식이 되어 항해·롤링·헤딩에 딸려 간다.
        // (add()를 쓰면 로컬 좌표로 재해석돼서 엉뚱한 데로 날아가니 주의)
        // 기본으로는 둘 다 숨겨두고, 키워드 선택에 따라 applyKeywords에서 켠다.
        ["Seagull", "Tube"].forEach((name) => {
          const obj = root.getObjectByName(name);
          // 블렌더에서 다시 뽑으면서 노드 이름이 바뀌면 여기서 조용히 사라진다 —
          // 씬은 멀쩡히 돌아가고 갈매기만 없어서 한참 뒤에나 눈치챈다.
          console.assert(obj, `[selfCheck] GLB에 "${name}" 노드가 없음 — 이름이 바뀌었는지 확인`);
          if (!obj) return;
          ship.attach(obj);
          obj.visible = false;
        });
        this.gullMesh = ship.getObjectByName("Seagull");
        this.tubeMesh = ship.getObjectByName("Tube");

        // GLB엔 갈매기가 4마리 겹쳐 들어있는데 크기가 작아 화면에선 한 덩어리로 뭉쳐 보인다.
        // 가장 큰 한 마리만 남긴다 (이름은 재익스포트마다 바뀔 수 있어 크기로 고른다).
        if (this.gullMesh && this.gullMesh.children.length > 1) {
          const spanOf = (o) => new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).length();
          const keep = this.gullMesh.children.reduce((a, b) => (spanOf(b) > spanOf(a) ? b : a));
          this.gullMesh.children.slice().forEach((c) => { if (c !== keep) this.gullMesh.remove(c); });
        }

        const box = new THREE.Box3().setFromObject(ship);
        const topLocal = new THREE.Vector3(
          (box.max.x + box.min.x) / 2 - ship.position.x,
          box.max.y - ship.position.y,
          (box.max.z + box.min.z) / 2 - ship.position.z
        );

        // 캐빈은 배 모델의 일부라 나중에 배 UV 아틀라스에 텍스처가 붙는다.
        // 그래서 재질을 새로 만들어 갈아끼우지 않는다 — 그러면 map과 UV가 통째로 날아간다.
        // 대신 원래 재질을 clone해서(다른 메쉬와 공유될 수 있으므로) color만 바꾼다.
        // three.js는 color를 map에 곱하므로, 텍스처가 붙은 뒤에도 키워드 색이 틴트로 그대로 먹는다.
        // (텍스처는 밝은 회색조로 그려야 틴트가 눈에 보인다)
        const cabin = ship.getObjectByName("Cabin");
        if (cabin) {
          cabin.traverse((c) => {
            if (!c.isMesh) return;
            c.material = c.material ? c.material.clone()
              : new THREE.MeshStandardMaterial({ roughness: 0.8 });
            if (!this.cabinMat) this.cabinMat = c.material;
          });
          if (this.cabinMat) this.cabinMat.color.setHex(0xf3e6cf);
        }

        // 마스트/깃발은 삭제했다 — 배 바운딩박스 꼭대기(=굴뚝 위)에 매달려 있어서 갑판이 아니라
        // 공중에 떠 보였고, 키워드 표시는 이제 갈매기/튜브가 대신한다.

        const funnel = ship.getObjectByName("Funnel");
        this.smokeAnchor = new THREE.Object3D();
        if (funnel && funnel.geometry) {
          funnel.geometry.computeBoundingBox();
          const fb = funnel.geometry.boundingBox;
          this.smokeAnchor.position.set((fb.max.x + fb.min.x) / 2, fb.max.y, (fb.max.z + fb.min.z) / 2);
          funnel.add(this.smokeAnchor);
        } else {
          this.smokeAnchor.position.copy(topLocal);
          ship.add(this.smokeAnchor);
        }

        // [버그2] 뱃머리가 반대로 향하던 문제 — 모델을 한 번만 돌려두고 끝낸다.
        // 마스트/깃발/연기 앵커/갈매기/튜브는 전부 ship의 자식이라 같이 돌아감.
        ship.rotation.y += SHIP_FORWARD_OFFSET;

        // [버그3] 시작 위치 — Ship 노드가 GLB 씬 좌표(x≈-0.60, y≈0.29, z≈0.15)를 그대로 들고 있어서
        // 배가 앵커에서 그만큼 떨어진 자리에 그려졌다. 게다가 헤딩 회전(boat.rotation.y)은 앵커
        // 기준이라, 배가 제자리에서 도는 게 아니라 반경 0.6짜리 원을 크게 휘돌아 버렸다.
        // 앵커 = 배 자신이 되도록 로컬 좌표를 비우고, 물에 잠기는 깊이만 흘수로 남긴다.
        ship.scale.setScalar(SHIP_SCALE);
        ship.position.set(0, SHIP_DRAFT * SHIP_SCALE, 0);

        // 배만 그림자를 드리운다. 받지는 않는다 —
        // 물체가 자기 그림자를 받으면 표면에 자글자글한 줄무늬(섀도 아크네)가 생긴다.
        // 필요한 건 마스트·굴뚝·선체가 수면에 지는 그림자뿐이라 이걸로 충분하다.
        ship.traverse((c) => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = false; } });
        this.boat.add(ship);
        if (this._pendingKeywords) this.applyKeywords(this._pendingKeywords);
      }
    } catch (err) {
      console.error("모델(GLB) 로드 실패:", err);
    }
  }

  _applyRockColor(hex) {
    if (!this.rockMats) { this._pendingRegionHex = hex; return; }
    this.rockMats.forEach((m) => m.color.setHex(hex));
  }

  /**
   * 그림자만 받는 평면. 물 표면 바로 위에 깔린다.
   * 물은 커스텀 셰이더라 그림자를 받게 하려면 셰이더에 조명·그림자 청크를 통째로
   * 끌어와야 한다. ShadowMaterial 평면 하나를 대신 깔면 물 셰이더를 건드리지 않고도
   * 배와 섬의 그림자가 수면에 떨어진다. 비용도 거의 없다.
   */
  _buildShadowCatcher() {
    const geo = new THREE.PlaneGeometry(24, 24);
    geo.rotateX(-Math.PI / 2);
    // depthWrite를 끄고 파도 마루보다 위에 둔다. 그림자가 물결 사이로 잠겼다 나왔다 하면
    // "물에 잠긴 그림자"처럼 보여 어색하다. 수면 위에 얹혀 있는 것처럼 보이는 게 목적이다.
    this.shadowMat = new THREE.ShadowMaterial({ opacity: 0.34, depthWrite: false });
    const mesh = new THREE.Mesh(geo, this.shadowMat);
    mesh.position.y = 0.16;    // 파도 진폭(최대 약 0.14)보다 위
    mesh.renderOrder = 2;
    mesh.receiveShadow = true;
    mesh.visible = false;      // 저녁에만 보인다
    this.world.add(mesh);
    this.shadowCatcher = mesh;
  }

  _buildBoat() {
    const boat = new THREE.Group();
    boat.position.set(0, 0.0, 0);
    this.world.add(boat);
    this.boat = boat;
  }

  /**
   * 굴뚝 연기. 뭉게뭉게 겹치는 로우폴리 덩어리로 만든다.
   *
   * 한 알갱이가 구 하나면 아무리 키워도 "공이 떠간다"로만 보인다.
   * 그래서 알갱이 하나를 서로 어긋나게 겹친 정이십면체 세 개로 만들어, 처음부터
   * 울퉁불퉁한 덩어리가 되게 했다. 여기에 알갱이마다 다른 속도로 회전을 주면
   * 올라가면서 모양이 계속 바뀌는 것처럼 보인다(실제로 정점을 건드리지는 않는다 — 훨씬 싸다).
   *
   * 정이십면체는 면이 20개뿐이라 각진 로우폴리 느낌이 그대로 살고, 구보다도 가볍다.
   */
  _buildSmokePool() {
    this.smokePool = [];
    const geo = new THREE.IcosahedronGeometry(1, 0);
    // 덩어리를 이루는 세 조각의 상대 위치와 크기. 살짝씩 어긋나게 겹쳐 둔다.
    // 오프셋이 크면 조각들이 밖으로 삐져나와 우글거려 보인다.
    // 반지름보다 한참 작게 어긋내서 서로 깊이 파고들게 한다.
    const BLOBS = [
      { p: [0, 0, 0], s: 1.0 },
      { p: [0.34, 0.20, 0.12], s: 0.74 },
      { p: [-0.28, 0.16, -0.14], s: 0.66 },
    ];
    for (let i = 0; i < SMOKE_COUNT; i++) {
      // depthWrite를 켠다. 이래야 앞의 덩어리가 뒤의 덩어리를 가려서 겹친 부분에
      // 안쪽 윤곽이 비치지 않는다. 알파를 낮게 깔면서 depthWrite를 끄면 겹칠수록 탁해진다.
      const mat = new THREE.MeshLambertMaterial({
        color: 0xf2f2f0, transparent: true, opacity: 0, depthWrite: true,
      });
      const group = new THREE.Group();
      for (const b of BLOBS) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(b.p[0], b.p[1], b.p[2]);
        m.scale.setScalar(b.s);
        group.add(m);
      }
      group.visible = false;
      group.renderOrder = 5;
      this.world.add(group);
      this.smokePool.push({
        mesh: group, mat, age: 0, active: false,
        spin: 0, drift: 0, wobble: 0,
      });
    }
    this.smokeSpawnTimer = 0;
  }

  _buildBottleShell() {
    const pts = BOTTLE_PROFILE.map(([u, r]) => new THREE.Vector2(r, u));
    const geo = new THREE.LatheGeometry(pts, 40);
    geo.rotateZ(Math.PI / 2);

    this.bottleMat = new THREE.MeshStandardMaterial({
      color: 0xeaf7f2, transparent: true, opacity: 0,
      roughness: 0.15, metalness: 0.05,
      side: THREE.DoubleSide, depthWrite: false,
    });
    const glass = new THREE.Mesh(geo, this.bottleMat);
    glass.renderOrder = 20;

    this.bottleRimMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0, side: THREE.BackSide, depthWrite: false,
    });
    const rim = new THREE.Mesh(geo, this.bottleRimMat);
    rim.scale.setScalar(1.035);
    rim.renderOrder = 19;

    this.bottleCorkMat = new THREE.MeshStandardMaterial({ color: 0xb08a5c, roughness: 0.85, transparent: true, opacity: 0 });
    const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.45, 16), this.bottleCorkMat);
    cork.rotation.z = Math.PI / 2;
    cork.position.x = -1.85;

    const group = new THREE.Group();
    group.add(rim, glass, cork);
    group.scale.set(BOTTLE_SCALE_X, BOTTLE_SCALE_R, BOTTLE_SCALE_R);
    group.position.set(BOTTLE_SHIFT_X, BOTTLE_Y, BOTTLE_SHIFT_Z);
    group.visible = false;
    this.scene.add(group);
    this.bottleGroup = group;
  }

  /**
   * 인트로에서 스치고 지나가는 구름 층.
   *
   * 하늘에서 바다까지 한 번에 내려오면 높이가 얼마나 되는지 읽히지 않는다.
   * 중간에 가로로 화면을 덮는 층을 하나 두고 지나가면 "내려오고 있다"가 분명해진다.
   * 로우폴리 스타일에 맞춰 납작하게 눌린 정이십면체를 흩어 놓았다.
   */
  _buildClouds() {
    const geo = new THREE.IcosahedronGeometry(1, 0);
    this.cloudMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0,
      depthWrite: false, side: THREE.DoubleSide,
    });
    const g = new THREE.Group();
    g.visible = false;
    for (let i = 0; i < CLOUD_COUNT; i++) {
      const m = new THREE.Mesh(geo, this.cloudMat);
      const a = (i / CLOUD_COUNT) * Math.PI * 2 + 0.6;
      const r = 1.6 + (i % 3) * 1.9;
      m.position.set(Math.cos(a) * r, CLOUD_Y + ((i % 3) - 1) * 0.7, Math.sin(a) * r);
      // 가로로 넓고 세로로 납작하게 — 지나갈 때 화면을 가득 덮는다.
      m.scale.set(4.2 + (i % 3) * 1.6, 0.5, 3.2 + (i % 2) * 1.4);
      m.rotation.y = a;
      m.renderOrder = 12;
      g.add(m);
    }
    this.cloudGroup = g;
    this.scene.add(g);
  }

  /**
   * 물결을 그릴 원들을 한 번만 추려 둔다.
   *
   * 물체 실루엣을 그대로 따라가려면 거리장이 필요하고 그건 렌더 타깃 한 장 값이다.
   * 대신 "수면에 걸친 메쉬 하나 = 원 하나"로 근사한다. 로우폴리 덩어리들이라 원으로 싸도
   * 크게 어색하지 않고, 셰이더는 거리 몇 번만 재면 된다.
   * 좌표는 각자 부모(섬 그룹 / 배) 기준으로 담아 두고, 매 프레임 월드로 옮긴다.
   */
  _buildRippleSources() {
    const circlesOf = (root, max) => {
      const out = [];
      root.updateWorldMatrix(true, true);
      const inv = root.matrixWorld.clone().invert();
      root.traverse((o) => {
        if (!o.geometry) return;
        o.geometry.computeBoundingBox();
        const bb = o.geometry.boundingBox;
        // 수면(y=0)에 걸쳐 있는 덩어리만 — 공중에 뜬 지붕이나 물속 바닥은 물결을 만들지 않는다
        const lo = new THREE.Vector3(bb.min.x, bb.min.y, bb.min.z).applyMatrix4(o.matrixWorld);
        const hi = new THREE.Vector3(bb.max.x, bb.max.y, bb.max.z).applyMatrix4(o.matrixWorld);
        if (Math.min(lo.y, hi.y) > 0.05 || Math.max(lo.y, hi.y) < -0.05) return;
        const c = new THREE.Vector3((bb.min.x + bb.max.x) / 2, 0, (bb.min.z + bb.max.z) / 2)
          .applyMatrix4(o.matrixWorld).applyMatrix4(inv);
        const w = Math.abs(hi.x - lo.x), d = Math.abs(hi.z - lo.z);
        const long = Math.max(w, d), short = Math.min(w, d);
        // 길쭉한 덩어리(배 선체 같은)를 원 하나로 싸면 실루엣에서 한참 떨어진 큰 원이 된다.
        // 긴 축을 따라 원 두세 개로 나눠 담으면 훨씬 몸에 붙는다.
        const parts = long > short * 1.6 ? (long > short * 2.6 ? 3 : 2) : 1;
        const alongX = w >= d;
        for (let k = 0; k < parts; k++) {
          const f = parts === 1 ? 0 : (k / (parts - 1) - 0.5) * (long - short) ;
          out.push({
            x: c.x + (alongX ? f : 0),
            z: c.z + (alongX ? 0 : f),
            r: (parts === 1 ? long : short * 0.95) * 0.5,   // 나눈 원끼리 겹쳐야 테두리가 톱니지지 않는다
          });
        }
      });
      // 큰 것부터 남긴다 — 작은 조각까지 다 그리면 링이 뭉개진다
      out.sort((a, b) => b.r - a.r);
      return out.slice(0, max);
    };
    this._rippleIsland = circlesOf(this.islandGroup, 6);
    this._rippleBoat = circlesOf(this.boat, 3);
  }

  /** 추려 둔 원들을 이번 프레임의 월드 좌표로 옮겨 셰이더에 넘긴다. */
  _updateRipples(dt) {
    const wu = this.waterMesh.material.uniforms;
    if (wu.uRippleOn.value < 0.5) return;
    if (!this._rippleIsland && this.boat.children.length) this._buildRippleSources();
    if (!this._rippleIsland) return;

    const arr = wu.uRipples.value;
    let n = 0;
    // 섬 — 멀어져 흐려지는 동안 물결도 같이 옅어진다
    const islandFade = THREE.MathUtils.smoothstep(this.shoreBlend, 0.0, SHORE_FADE_UNTIL);
    const ig = this.islandGroup.position;
    for (const c of this._rippleIsland) {
      if (n >= RIPPLE_MAX) break;
      arr[n++].set(ig.x + c.x, ig.z + c.z, c.r, islandFade);
    }
    // 배 — 뱃머리 방향으로 돌려서 얹는다
    const by = this.boat.rotation.y, cs = Math.cos(by), sn = Math.sin(by);
    const bp = this.boat.position;
    for (const c of this._rippleBoat) {
      if (n >= RIPPLE_MAX) break;
      arr[n++].set(bp.x + c.x * cs + c.z * sn, bp.z - c.x * sn + c.z * cs, c.r, 1.0);
    }
    for (; n < RIPPLE_MAX; n++) arr[n].set(0, 0, 0, 0);

    // 항적 — 배가 실제로 움직인 거리에서 속도를 낸다. 멈추면 저절로 사라진다.
    const vx = dt > 0 ? (bp.x - (this._wakePrevX ?? bp.x)) / dt : 0;
    this._wakePrevX = bp.x;
    const speed = Math.min(1, Math.abs(vx) / 1.2);
    this._wakeStrength = (this._wakeStrength ?? 0) + (speed - (this._wakeStrength ?? 0)) * Math.min(1, dt * 2.5);
    wu.uWake.value.set(bp.x, bp.z, vx >= 0 ? 0 : Math.PI, this._wakeStrength);
  }

  /** 카메라 높이가 구름 층에 가까울 때만 짙어진다 — 지나가면 곧 사라진다. */
  _updateClouds() {
    if (!this.cloudGroup) return;
    const active = this._introPending || this._liftT < 1 || this._lift > 0.01;
    if (!active) { this.cloudGroup.visible = false; return; }
    this.cloudGroup.visible = true;
    this.cloudGroup.position.x = this.boat.position.x;
    const k = Math.max(0, 1 - Math.abs(this._lift - CLOUD_Y) / CLOUD_FADE_SPAN);
    this.cloudMat.opacity = 0.9 * k * k;
  }

  /** 인트로 끝에서 배가 나타나 떨어진다. 반환값은 파도 흔들림에 더할 높이. */
  _startBoatDrop() {
    this._dropT = 0;
    this.boat.visible = true;
  }

  _updateBoatDrop(dt) {
    if (this._dropT >= 1) { this._dropOffset = 0; return; }
    this._dropT = Math.min(1, this._dropT + dt / BOAT_DROP_SEC);
    if (this._dropT >= 1) { this._dropOffset = 0; this._fireIntroSettled(); return; }
    const u = this._dropT;
    if (u < 0.13) {
      // 뽁 — 제자리에서 부풀어 나타난다
      this.boat.scale.setScalar(Math.min(1, (u / 0.13) * 1.15));
      this._dropOffset = BOAT_DROP_HEIGHT;
      return;
    }
    this.boat.scale.setScalar(1);
    if (u < 0.62) {
      // 낙하 — 가속만 있고 감속이 없다(ease-in). 처음엔 느리게 떨어지다 빨라진다.
      const p = (u - 0.13) / (0.62 - 0.13);
      this._dropOffset = BOAT_DROP_HEIGHT * (1 - p * p * p);
      return;
    }
    // 착수 — 한 번 깊이 잠겼다가 천천히 올라와 파도 흔들림으로 이어진다.
    // 위로 튀어오르지 않아야 가볍지 않다.
    const p = (u - 0.62) / (1 - 0.62);
    this._dropOffset = -BOAT_DROP_DIP * Math.sin(Math.PI * p) * (1 - p * 0.35);
  }

  /**
   * 병 안 수면 아래를 채우는 물 덩어리.
   * 파도 메쉬는 "표면" 한 장뿐이라, 병을 아래에서 올려다보면 수심이 통째로 비어 보였다.
   * 병 안쪽 프로파일을 살짝 줄여 같은 모양으로 만들고, 월드 기준 수평면으로 잘라
   * 수면 아래만 남긴다. 색은 시간대별 바다색을 따라간다(_applyTime).
   */
  _buildBottleWater() {
    const pts = BOTTLE_PROFILE.map(([u, r]) => new THREE.Vector2(r * 0.985, u));
    const geo = new THREE.LatheGeometry(pts, 40);
    geo.rotateZ(Math.PI / 2);
    // 자를 높이는 파도 골(진폭 약 0.14)보다 조금 아래다. 마루에서는 표면이 덮고,
    // 골에서도 덩어리 윗면이 드러나지 않는 선을 실측으로 잡았다.
    this.bottleWaterMat = new THREE.MeshBasicMaterial({
      color: 0x2fb3e6, transparent: true, opacity: 0,
      side: THREE.FrontSide, depthWrite: true,
      clippingPlanes: [new THREE.Plane(new THREE.Vector3(0, -1, 0), -0.05)],
    });
    const mesh = new THREE.Mesh(geo, this.bottleWaterMat);
    mesh.renderOrder = 18;      // 유리(20)·테두리(19)보다 먼저
    this.bottleWater = mesh;
    this.bottleGroup.add(mesh);
  }

  /**
   * 시작하기를 누른 직후. 기본 시점 그대로 수직으로 올라가 하늘만 남는다.
   * (예전엔 배가 뽁 튀어올라 물에 떨어지는 연출이었다.)
   */
  playIntro(onSettled) {
    if (this.introDone) { onSettled && onSettled(); return; }
    this.introDone = true;
    // 올라가는 과정은 보여주지 않는다 — 처음부터 하늘에 있다.
    this._introPending = true;
    this._lift = INTRO_LIFT;
    this._liftT = 1;
    this.boat.visible = false;      // 내려앉기 직전에 뽁 하고 나타난다
    onSettled && onSettled();
  }

  /** 온보딩에서 다음으로 넘어갈 때. 올라간 높이를 그대로 내려온다 — 감속만 있고 가속은 없다. */
  /**
   * 온보딩에서 다음으로 넘어갈 때. 올라간 높이를 그대로 내려온다.
   * 배가 떨어져 자리를 잡는 건 카메라가 멈춘 뒤에도 이어지므로, 끝났다는 신호는
   * 카메라가 아니라 "배가 가라앉았다 올라와 멎은 시점"에 보낸다.
   */
  introDescend(onDone) {
    this._introPending = false;
    this._onIntroSettled = onDone || null;
    this._liftTo(0, INTRO_FALL_SEC, INTRO_FALL_EASE, null);
  }

  _fireIntroSettled() {
    const cb = this._onIntroSettled;
    this._onIntroSettled = null;
    cb && cb();
  }

  _liftTo(to, dur, ease, onDone) {
    this._liftFrom = this._lift;
    this._liftTarget = to;
    this._liftT = 0;
    this._liftDur = dur;
    this._liftEase = ease;
    this._onLiftDone = onDone || null;
  }

  revealBottle(onDone) {
    this.bottleGroup.visible = true;
    this.bottleTarget = 1;
    if (this.bottleRevealed) { onDone && onDone(); return; }
    this.bottleRevealed = true;
    setTimeout(() => onDone && onDone(), 1500);
  }

  applyRegion(region) {
    const hex = REGION_SAND[region] || 0xd9b98c;
    this._applyRockColor(hex);
  }

  applyKeywords(keywords) {
    if (!this.cabinMat) { this._pendingKeywords = keywords; return; }
    const picked = keywords || [];
    const cols = picked.map((k) => KEYWORD_COLOR[k]);
    this.cabinMat.color.setHex(cols[0] !== undefined ? cols[0] : 0xf3e6cf);

    // 갑판 소품: 예전엔 깃발 색으로 두 번째 키워드를 표현했는데, 깃발(과 공중에 뜬 마스트)을
    // 지우면서 갈매기/튜브가 그 역할을 맡는다. 고른 키워드 중 하나라도 해당되면 붙는다.
    const props = new Set(picked.map((k) => KEYWORD_PROP[k]).filter(Boolean));
    if (this.gullMesh) this.gullMesh.visible = props.has("gull");
    if (this.tubeMesh) this.tubeMesh.visible = props.has("tube");
  }

  setMode(mode) {
    if (this.mode === mode) return;
    const prev = this.mode;
    this.mode = mode;
    this.modeChangedAt = this.elapsed;
    // 파도 위상이 같은 자리로 접어 좌표를 작게 유지한다(부동소수점 보호).
    // 1144단위로 건너뛰는 것이라 화면엔 티가 안 나지만, 카메라와 배 실제 좌표도 같이
    // 옮겨 주지 않으면 카메라가 그 거리를 추종 속도로 기어가게 된다.
    if (this._boatEaseX !== undefined) {
      const wrapped = this._wrapWave(this._boatEaseX);
      const shift = wrapped - this._boatEaseX;
      this._boatEaseX = wrapped;
      this.boat.position.x += shift;
      if (this._camFollowX !== undefined) this._camFollowX += shift;
      this.dockX += shift;
      if (this.cruiseFromX !== undefined) this.cruiseFromX += shift;
    }

    // 배를 순간이동시키지 않는다.
    //
    // 예전엔 상태를 바꿀 때 배를 0이나 -2.4로 옮겨 놓았다. 파도는 월드에 고정돼 있고
    // 카메라는 배를 따라가므로, 그 순간 바다 전체가 옮긴 거리만큼 한 번에 훑고 지나가
    // 화면이 튀었다. 카메라 추종에 속도 상한을 걸어 봤지만 그건 튐을 미끄러짐으로
    // 바꿨을 뿐이었다.
    //
    // 그래서 배가 아니라 "선착장이 어디인지"를 배가 지금 있는 자리 기준으로 다시 잡는다.
    // 섬은 선착장에 딸려 오므로(islandGroup 위치가 dockX 기준), 배가 얼마나 멀리 나가 있든
    // 화면에서는 늘 배 옆으로 섬이 미끄러져 들어온다. 배는 한 번도 순간이동하지 않는다.
    const here = this._boatEaseX ?? this.boat.position.x;
    if (mode === "returned") {
      this.dockX = here + RETURN_DISTANCE;   // 지금 자리에서 그만큼 더 가면 선착장
    } else if (mode === "between") {
      this.cruiseFromX = here;               // 지금 자리에서 이어서 나아간다
    } else if (mode !== "unsure") {
      this.dockX = here;                     // 있던 자리를 그대로 선착장으로 삼는다
    }
    const nextShore = (mode === "between" || mode === "unsure") ? 0 : 1;
    if (nextShore !== this.shoreTarget) {
      this._shoreFrom = this.shoreBlend;   // 지금 있는 자리에서 이어서 움직인다
      this._shoreT = 0;
    }
    this.shoreTarget = nextShore;

    // between이 1.0이면 파도가 너무 거칠어서 0.1('아직 모르겠음'과 같은 값)로 낮췄다.
    // 진폭은 ampScale = 0.5 + 0.9*windT 이므로 1.4 -> 0.59, 약 58% 감소다.
    // (0.5가 하한이라 이 공식으로 낼 수 있는 최저치는 1.4의 36%다)
    // '오가는 중'은 배뿐 아니라 바다도 함께 1.5배로 (0.1 → 0.15).
    const windByMode = { stay: 0.22, leaving: 0.55, returned: 0.75, between: 0.15, unsure: 0.1 };
    this.windTarget = windByMode[mode] ?? 0.3;
  }

  /**
   * 시간대를 바꾼다. 같은 시간대면 다시 시작하지 않는다.
   * 전환 곡선은 easeInOutQuint — 앞뒤가 아주 완만하고 가운데가 급해서,
   * "확 바뀌고 잔상이 길게 남는" 느낌이 난다.
   */
  setTimeOfDay(key) {
    const to = TIME_OF_DAY[key];
    if (!to || this._timeKey === key) return;
    this._timeFrom = this._snapshotTime();
    this._timeTo = to;
    this._timeKey = key;
    this._timeT = 0;
  }

  /** 현재 화면에 실제로 적용돼 있는 값. 전환 중에 또 바꿔도 이어지도록 스냅숏을 뜬다. */
  _snapshotTime() {
    const wu = this.waterMesh.material.uniforms;
    return {
      sky: this._skyColors.map((c) => c.clone()),
      fog: this.scene.fog.color.getHex(),
      ocean: wu.uOceanColor.value.getHex(),
      skyRefl: wu.uSkyColor.value.getHex(),
      exposure: wu.uExposure.value,
      // 팔레트 값으로 되돌려 담는다 — _applyTime이 다시 SCENE_BRIGHTNESS를 곱하므로
      // 여기서 곱해진 값을 그대로 넣으면 전환할 때마다 밝기가 누적된다.
      sun: this.sunLight.color.getHex(), sunI: this.sunLight.intensity / SCENE_BRIGHTNESS,
      rim: this.rimLight.color.getHex(), rimI: this.rimLight.intensity / SCENE_BRIGHTNESS,
      amb: this.ambLight.color.getHex(), ambI: this.ambLight.intensity / SCENE_BRIGHTNESS,
      spec: wu.uSpecColor.value.getHex(), specI: wu.uSpecStrength.value,
      sunPos: this._sunOffset.toArray(),
      shadow: this.shadowMat ? this.shadowMat.opacity : 0,
    };
  }

  /**
   * 배경 하늘을 그린다.
   *
   * 병이 떠오르면 배경이 처음 화면(#bgFallback)의 단색으로 수렴한다. 병 안(빛·물·반짝임)은
   * 고른 시간대를 그대로 유지하므로, 내가 고른 시간이 병 속에 봉해지고 그 병이 처음 그
   * 배경 위에 놓인 것처럼 보인다. 색은 CSS에서 매번 읽어오니 --cream 을 바꾸면 따라온다.
   */
  _refreshSky() {
    const bt = Math.min(1, Math.max(0, this.bottleT));
    if (bt > 0.001 && this.bgFallback) {
      // 값을 여기 옮겨 적지 않고 CSS에서 읽는다. 나중에 --cream 을 바꾸면 이 배경도 따라온다.
      this._splashColor.setStyle(getComputedStyle(this.bgFallback).backgroundColor);
    }
    for (let i = 0; i < 4; i++) {
      TMP_SKY[i].copy(this._skyColors[i]).lerp(this._splashColor, bt);
    }
    paintSky(this.scene.background, TMP_SKY);
    this._skyBlend = bt;
  }

  /**
   * 반짝임 띠를 처음 시점에서 잡은 자리에 붙들어 둔다.
   *
   * 반짝임은 reflect(태양, 파면)과 시선이 얼마나 맞는지로 정해진다. 태양이 월드에
   * 고정돼 있으면 카메라를 돌릴수록 그 조건을 만족하는 자리가 화면 밖으로 밀려난다.
   * 실측하면 orbitYaw를 -0.8에서 +0.8로 돌릴 때 반짝임 중심이 화면 가로 10%에서 92%로
   * 쓸려가고, 화면 점유도 7.8%에서 1.7%로 줄어 배 주변이 텅 비었다.
   *
   * 그래서 반짝임에 쓰는 태양 방향만 카메라 yaw만큼 같이 돌린다. 반짝임이 생기는
   * "자리"는 화면에 머물고, 파면이 바뀌는 대로 반짝이는 각도만 달라진다.
   * 물의 확산광은 원래 태양 방향(uSunDirection)을 그대로 써서 전체 음영은 흔들리지 않는다.
   */
  _updateSpecAnchor() {
    const wu = this.waterMesh.material.uniforms;
    const base = wu.uSunDirection.value;
    const c = Math.cos(this.orbitYaw), s = Math.sin(this.orbitYaw);
    // 좌우: 카메라가 도는 만큼 태양도 같이 돌려 반짝임 자리를 붙들어 둔다.
    const x = base.x * c + base.z * s;
    const y = base.y;
    const z = -base.x * s + base.z * c;
    // 상하: 완전히 붙들면 파도를 훑는 느낌까지 죽는다. 카메라가 위아래로 움직인 만큼의
    // 70%만 따라 돌려서, 반짝임이 움직이는 정도를 예전의 30%로 남긴다.
    const yaw = BASE_YAW + this.orbitYaw;
    const ax = Math.cos(yaw), az = -Math.sin(yaw);        // 카메라 오른쪽 축(수평)
    // 부호: +가 맞다. 반대로 걸면 오히려 반짝임이 더 크게 쓸려간다(실측 63%p → 75%p).
    const a = SPEC_PITCH_FOLLOW * this.orbitPitch;
    const ca = Math.cos(a), sa = Math.sin(a), t = 1 - ca;
    // 임의 축(ax, 0, az) 둘레 회전 — 로드리게스 공식
    wu.uSpecSunDir.value.set(
      x * (t * ax * ax + ca) + y * (-sa * az)          + z * (t * ax * az),
      x * (sa * az)          + y * (ca)                + z * (-sa * ax),
      x * (t * ax * az)      + y * (sa * ax)           + z * (t * az * az + ca)
    );
  }

  /** from→to 사이 k(0~1) 지점의 색·세기를 실제 씬에 반영한다. */
  _applyTime(k) {
    const a = this._timeFrom, b = this._timeTo;
    const wu = this.waterMesh.material.uniforms;
    const mixHex = (target, from, to) => {
      target.set(typeof from === "number" ? from : from.getHex());
      target.lerp(TMP_COLOR.set(typeof to === "number" ? to : to.getHex()), k);
    };
    for (let i = 0; i < 4; i++) {
      const fromC = a.sky[i] instanceof THREE.Color ? a.sky[i] : new THREE.Color(a.sky[i]);
      const toC = b.sky[i] instanceof THREE.Color ? b.sky[i] : new THREE.Color(b.sky[i]);
      this._skyColors[i].copy(fromC).lerp(toC, k);
    }
    this._refreshSky();
    mixHex(this.scene.fog.color, a.fog, b.fog);
    mixHex(wu.uOceanColor.value, a.ocean, b.ocean);
    // 병 안 물 덩어리도 같은 바다색을 쓰되, 표면이 하늘을 반사해 조금 밝은 걸 감안해 섞는다.
    if (this.bottleWaterMat) {
      this.bottleWaterMat.color.copy(wu.uOceanColor.value)
        .lerp(TMP_COLOR.set(wu.uSkyColor.value.getHex()), 0.18);
    }
    mixHex(wu.uSkyColor.value, a.skyRefl, b.skyRefl);
    mixHex(this.sunLight.color, a.sun, b.sun);
    mixHex(this.rimLight.color, a.rim, b.rim);
    mixHex(this.ambLight.color, a.amb, b.amb);
    mixHex(wu.uSpecColor.value, a.spec, b.spec);
    wu.uSpecStrength.value = a.specI + (b.specI - a.specI) * k;
    // 해의 위치도 함께 움직인다 — 저녁엔 낮게 깔려 그림자가 길어진다.
    // 실제 배치는 _animate에서 배 위치를 더해 적용한다.
    for (let i = 0; i < 3; i++) {
      this._sunOffset.setComponent(i, a.sunPos[i] + (b.sunPos[i] - a.sunPos[i]) * k);
    }
    if (this.shadowMat) {
      const op = a.shadow + (b.shadow - a.shadow) * k;
      this.shadowMat.opacity = op;
      // 그림자가 없는 시간대에는 그림자 맵 렌더 자체를 건너뛴다.
      this.sunLight.castShadow = op > 0.001;
      this.shadowCatcher.visible = op > 0.001;
    }
    wu.uExposure.value = (a.exposure + (b.exposure - a.exposure) * k) * SCENE_BRIGHTNESS;
    // 전체 밝기는 팔레트 네 벌을 다 고치지 않고 여기 한 곳에서 곱한다.
    this.sunLight.intensity = (a.sunI + (b.sunI - a.sunI) * k) * SCENE_BRIGHTNESS;
    this.rimLight.intensity = (a.rimI + (b.rimI - a.rimI) * k) * SCENE_BRIGHTNESS;
    this.ambLight.intensity = (a.ambI + (b.ambI - a.ambI) * k) * SCENE_BRIGHTNESS;
  }

  /**
   * 단계에 맞는 카메라 목적지를 건다. 이미 같은 목적지면 다시 시작하지 않는다
   * (같은 단계에서 render()가 여러 번 불리는데 그때마다 전환이 재시작되면 안 된다).
   */
  _setCamStep(step) {
    const p = CAM_STEPS[step] || CAM_DEFAULT;
    const to = { tx: p.target[0], ty: p.target[1], tz: p.target[2], radius: p.radius, widen: p.widen || CAM_MAX_WIDEN };
    if (!this._camCur) { this._camCur = { ...to }; this._camFrom = { ...to }; this._camTo = to; this._camT = 1; return; }
    const cur = this._camTo;
    if (cur && cur.tx === to.tx && cur.ty === to.ty && cur.tz === to.tz && cur.radius === to.radius && cur.widen === to.widen) return;
    this._camFrom = { ...this._camCur };
    this._camTo = to;
    this._camT = 0;
    this._camDur = CAM_MOVE_SEC;
  }

  show(step, appState) {
    const wasVisible = this.visible;
    this.visible = ACTIVE_STEPS.includes(step);
    this.stage.classList.toggle("visible", this.visible);
    if (!this.visible) return;

    this.applyRegion(appState.region);
    this.setMode(appState.stateId || "stay");
    this.applyKeywords(appState.keywords);

    this._setCamStep(step);

    if (step !== "result") {
      this.bottleTarget = 0;
      this.bottleRevealed = false;
      // 병을 둘러볼 때만 열리는 넓은 각도가 다음 단계로 새어 나가지 않게 일반 범위로 접는다.
      this._easeOrbitTo(
        Math.max(-0.85, Math.min(0.85, this.orbitYaw)),
        Math.max(-0.2, Math.min(0.55, this.orbitPitch))
      );
    }

    // 둘러보던 시점은 단계를 넘어가도 그대로 둔다 — 줌인·패닝(프리셋의 target/radius)만 바뀐다.
    // 예외로 프리셋에 orbit이 지정된 단계(지역)는 그 시점으로 갈아타고, 벗어나면 원래 시점으로 돌아온다.
    const override = (CAM_STEPS[step] || {}).orbit;
    if (override) {
      if (!this._orbitOverridden) {
        this._orbitSaved = { yaw: this.orbitYaw, pitch: this.orbitPitch };
        this._orbitOverridden = true;
      }
      this._easeOrbitTo(override.yaw, override.pitch);
    } else if (this._orbitOverridden) {
      this._orbitOverridden = false;
      this._easeOrbitTo(this._orbitSaved.yaw, this._orbitSaved.pitch);
    }

    // 씬이 숨어 있다가 다시 나타나는 길 — 아카이브에서 "다시 한 문장 남기기"를 누르는 경우다.
    // 여기서는 카메라를 이징으로 옮기지 않고 목적지에 바로 세운다.
    // 결과 화면의 카메라는 병을 다 담느라 반지름 35 남짓까지 물러나 있어서, 기본 시점(12)까지
    // 같은 1.1초 안에 오려면 50 가까이를 가로질러야 한다. 수식으로는 끊김 없이 이어지지만
    // (프레임당 이동이 종 모양으로 오르내린다) 화면에는 확 낚아채는 줌인으로 보였다.
    // 무대가 어차피 0.7초 동안 페이드 인하므로, 이미 자리를 잡은 채 떠오르는 편이 자연스럽다.
    if (!wasVisible) this._reenter();
  }

  /**
   * 씬이 숨은 사이에 처음 상태로 되돌려 놓고, 다시 나타날 때는 줌인만 보여준다.
   *
   * 결과 화면의 카메라는 병을 담느라 멀리 물러난 데다 둘러보던 각도까지 남아 있다.
   * 그대로 이징하면 1.1초 동안 50 가까이를 가로지르며 시선까지 휘어 들어와 뒤틀려 보였다.
   * 각도·병·시간대는 안 보이는 동안 처음 값으로 되돌리고 거리만 뒤에서 당겨온다.
   * 방향이 이미 맞아 있으니 화면에는 깨끗한 줌인만 남는다.
   */
  _reenter() {
    // 스플래시 → 온보딩 첫 진입에서는 인트로가 이미 시점을 올리는 중이다.
    // 그때 여기서 높이를 0으로 되돌리고 줌인까지 걸면 인트로가 통째로 지워진다.
    const introRunning = this._introPending || this._liftT < 1;

    this.orbitYaw = 0; this.orbitPitch = 0;
    this._orbitFrom = { yaw: 0, pitch: 0 };
    this._orbitTo = { yaw: 0, pitch: 0 };
    this._orbitT = 1;
    this._orbitOverridden = false;
    this._orbitSaved = { yaw: 0, pitch: 0 };
    this.bottleT = this.bottleTarget;
    if (!introRunning) {
      this._lift = 0; this._liftT = 1; this._onLiftDone = null;
      this.boat.visible = true; this.boat.scale.setScalar(1);
      this._dropT = 1; this._dropOffset = 0;
    }

    // 시간대도 처음 값으로 되돌린다. 앞사람이 고른 시간이 다음 사람 첫 화면에 남지 않게.
    this._timeKey = INITIAL_TIME_KEY;
    this._timeFrom = TIME_OF_DAY[INITIAL_TIME_KEY];
    this._timeTo = TIME_OF_DAY[INITIAL_TIME_KEY];
    this._timeT = 1;
    this._applyTime(1);

    if (introRunning) {
      // 인트로가 시점을 올렸다 내리는 것으로 등장을 대신하므로 줌인은 걸지 않는다.
      this._camFrom = { ...this._camTo };
      this._camCur = { ...this._camTo };
      this._camT = 1;
      return;
    }
    // 목적지(각도·바라보는 지점)는 이미 맞춰져 있고, 거리만 뒤에서 시작한다.
    this._camFrom = { ...this._camTo, radius: this._camTo.radius * REENTER_ZOOM_FROM };
    this._camCur = { ...this._camFrom };
    this._camT = 0;
    this._camDur = REENTER_ZOOM_SEC;
  }

  /**
   * 아카이브 카드에 남길 스냅샷.
   *
   * 예전엔 버튼을 누른 그 순간의 화면을 그대로 떠서, 둘러보다 누르면 기울어진 각도가
   * 그대로 남았다. 둘러보던 각도를 잠깐 0으로 되돌린 기본 구도로 찍고 원래대로 돌려놓는다.
   * 배경(하늘)·그림자·바다를 잠시 끄면 알파가 뚫려 병과 그 안만 남은 그림이 나온다.
   */
  capture() {
    const saved = {
      yaw: this.orbitYaw, pitch: this.orbitPitch,
      bg: this.scene.background,
      shadow: this.shadowCatcher ? this.shadowCatcher.visible : false,
      clearAlpha: this.renderer.getClearAlpha(),
      fogNear: this.scene.fog.near, fogFar: this.scene.fog.far,
    };

    this.orbitYaw = 0; this.orbitPitch = 0;
    this.scene.background = null;
    if (this.shadowCatcher) this.shadowCatcher.visible = false;
    this.renderer.setClearAlpha(0);
    // 안개는 색을 섞을 뿐 알파를 비우지 않는다. 배경을 없앤 채로 두면 병 밖 바다가
    // 안개색으로 칠해진 채 남으므로, 찍는 동안만 안개를 멀리 밀어 둔다.
    this.scene.fog.near = 1e6; this.scene.fog.far = 1e7;

    this._placeCamera();
    this.renderer.render(this.scene, this.camera);
    const url = this.canvas.toDataURL("image/png");

    this.orbitYaw = saved.yaw; this.orbitPitch = saved.pitch;
    this.scene.background = saved.bg;
    if (this.shadowCatcher) this.shadowCatcher.visible = saved.shadow;
    this.renderer.setClearAlpha(saved.clearAlpha);
    this.scene.fog.near = saved.fogNear; this.scene.fog.far = saved.fogFar;
    this._placeCamera();
    return url;
  }

  _wrapWave(x) {
    const D = this.WAVE_WRAP_DOMAIN;
    return x - D * Math.round(x / D);
  }

  // 네 번째 인자는 "흐름 세기"가 아니라 이미 누적된 "흐름 위상"이다 (셰이더 uFlowPhase와 동일).
  // 셰이더의 gerstnerSum과 식이 한 글자라도 어긋나면 배가 수면에서 뜨거나 잠긴다.
  _waveHeightAt(x, z, t, flowPhase) {
    const ampScale = 0.5 + 0.9 * this.windT;
    let dy = 0;
    for (let w = 0; w < this.gerstnerWaves.length; w++) {
      const wave = this.gerstnerWaves[w];
      const k = (2 * Math.PI) / wave.wavelength;
      const theta = k * (wave.dirX * x + wave.dirZ * z) - (wave.speed * t + (flowPhase || 0));
      dy += wave.ampBase * ampScale * Math.sin(theta);
    }
    return dy;
  }

  _spawnSmoke(dt) {
    if (!this.smokeAnchor) return;
    this.smokeSpawnTimer -= dt;
    if (this.smokeSpawnTimer > 0) return;
    // 간격이 짧아야 덩어리끼리 겹쳐서 하나의 기둥으로 보인다.
    this.smokeSpawnTimer = SMOKE_INTERVAL;
    const free = this.smokePool.find((s) => !s.active);
    if (!free) return;

    free.active = true; free.age = 0;
    free.mesh.visible = true;
    free.mat.opacity = 1;
    free.mat.color.setHex(0xf2f2f0);
    free.mesh.scale.setScalar(SMOKE_START * SHIP_SCALE);
    free.mesh.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    free.spin = (Math.random() - 0.5) * 0.9;      // 알갱이마다 다른 회전 — 모양이 변하는 느낌
    free.drift = (Math.random() - 0.5) * 0.12;    // 옆으로 흩어지는 정도
    free.wobble = Math.random() * 6.28;           // 흔들림 위상
    const wp = new THREE.Vector3();
    this.smokeAnchor.getWorldPosition(wp);
    free.mesh.position.copy(wp);
  }

  _updateSmoke(dt) {
    for (const s of this.smokePool) {
      if (!s.active) continue;
      s.age += dt;
      const life = s.age / SMOKE_LIFE;            // 0 → 1

      s.mesh.position.y += dt * SMOKE_RISE * SHIP_SCALE;
      // 올라갈수록 옆으로 퍼지고 살짝 흔들린다
      s.mesh.position.x += dt * (SMOKE_LEAN + s.drift) * SHIP_SCALE;
      s.mesh.position.z += dt * Math.sin(s.wobble + s.age * 1.6) * 0.06 * SHIP_SCALE;
      s.mesh.rotation.y += dt * s.spin;
      s.mesh.rotation.x += dt * s.spin * 0.6;

      // 처음엔 빠르게, 나중엔 천천히 커진다
      const grow = SMOKE_START + (SMOKE_END - SMOKE_START) * Math.pow(life, 0.65);
      s.mesh.scale.setScalar(grow * SHIP_SCALE);
      // 대부분의 수명 동안 불투명하게 둔다(겹쳐도 지저분해지지 않는 이유).
      // 마지막 구간에서만 투명해지는데, 그때는 덩어리가 크고 흩어져 있어 겹침이 적다.
      // 색도 안개색 쪽으로 밀어서 알파가 빠지기 전에 이미 하늘에 녹아든 것처럼 보이게 한다.
      if (life > SMOKE_SOLID_UNTIL) {
        const tail = (life - SMOKE_SOLID_UNTIL) / (1 - SMOKE_SOLID_UNTIL);
        s.mat.opacity = 1 - tail * tail;
        s.mat.color.setHex(0xf2f2f0).lerp(this.scene.fog.color, tail * 0.85);
      } else {
        s.mat.opacity = 1;
      }

      // [버그] 병이 풍경을 감싼 뒤에도 굴뚝 연기는 유리를 뚫고 밖으로 흘러나갔다.
      // 물처럼 셰이더로 자르지 않고, 덩어리가 병 벽에 다가갈수록 흐려지다 벽에 닿으면 지운다.
      if (this.bottleT > 0.01) {
        const cx = this.boat.position.x + BOTTLE_SHIFT_X;
        const u = -(s.mesh.position.x - cx) / BOTTLE_SCALE_X;
        const rad = bottleRadiusAtU(u) * BOTTLE_SCALE_R;
        const dist = Math.hypot(s.mesh.position.y - BOTTLE_Y, s.mesh.position.z - BOTTLE_SHIFT_Z) + s.mesh.scale.x;
        const slack = rad - dist;
        if (slack <= 0) { s.active = false; s.mesh.visible = false; continue; }
        // 벽에 닿기 직전 구간에서만 흐려진다 — 갑자기 사라지지 않게
        const near = Math.min(1, slack / (0.30 * BOTTLE_SCALE_R));
        s.mat.opacity *= (1 - this.bottleT) + this.bottleT * near;
      }

      if (s.age >= SMOKE_LIFE) { s.active = false; s.mesh.visible = false; }
    }
  }

  /** 둘러보던 각도를 카메라 전환과 같은 곡선으로 목적지까지 옮긴다. */
  _easeOrbitTo(yaw, pitch) {
    if (Math.abs(yaw - this.orbitYaw) < 1e-4 && Math.abs(pitch - this.orbitPitch) < 1e-4) {
      this._orbitT = 1;
      return;
    }
    this._orbitFrom = { yaw: this.orbitYaw, pitch: this.orbitPitch };
    this._orbitTo = { yaw, pitch };
    this._orbitT = 0;
  }

  /** 카메라를 지금 상태(단계 프리셋·둘러보기 각도·병·인트로 높이)에 맞춰 놓는다. */
  _placeCamera() {
    const cam = this._camCur;
    const radius = radiusForAspect(cam.radius, this.camera.aspect, cam.widen);
    // 카메라가 도는 중심 = 바라보는 지점. 둘을 일치시켜야 yaw/pitch가 실제 시선각과 같아진다.
    const tX = (this._camFollowX ?? this.boat.position.x) + cam.tx, tY = cam.ty, tZ = cam.tz;
    // 카메라가 뒤로 빠진 만큼 안개도 같이 밀어줘야 배가 안개에 묻히지 않는다.
    const fogRange = fogRangeFor(radius);
    this.scene.fog.near = fogRange.near;
    this.scene.fog.far = fogRange.far;
    // 안개가 거의 다 낀 지점부터 지우기 시작해서, 안개가 완전히 낀 지점에서 사라진다.
    const wuFade = this.waterMesh.material.uniforms;
    wuFade.uFadeNear.value = fogRange.far * 0.80;
    wuFade.uFadeFar.value = fogRange.far;
    // 기본 시점: 좌측 상단에서 내려다보는 아이소메트릭. yaw가 음수면 카메라가 배 왼쪽으로,
    // pitch 0.60rad(≈34°)은 정아이소메트릭(35.26°)에 가까운 내려다보기 각도.
    // 바라보는 지점(lookAt)은 그대로 배 — 카메라 위치만 옮긴 것.
    // ?debug=1 로 접속해 드래그로 각도를 잡은 뒤, HUD에 찍히는 값을 여기 붙여넣으면 된다.
    const yaw = BASE_YAW + this.orbitYaw;
    this._updateSpecAnchor();
    const pitch = BASE_PITCH + this.orbitPitch;
    // 병이 뜬 뒤에는 병 중심을 축으로 돈다. 그래야 아크가 병 주위를 정확히 감싼다.
    // 예전엔 bottleT가 0.01을 넘는 순간 회전 중심이 배에서 병으로 한 프레임에 갈아탔다.
    // 결과 화면을 빠져나올 때 그 지점에서 시점이 툭 튀는 원인이었다. bottleT로 이어준다.
    const bt = Math.min(1, Math.max(0, this.bottleT));
    const bX = this.boat.position.x + BOTTLE_CENTER_X;
    const oX = tX + (bX - tX) * bt;
    const oY = tY + (BOTTLE_Y - tY) * bt;
    const oZ = tZ + (BOTTLE_SHIFT_Z - tZ) * bt;
    this.camera.position.set(
      oX + radius * Math.sin(yaw) * Math.cos(pitch),
      oY + radius * Math.sin(pitch),
      oZ + radius * Math.cos(yaw) * Math.cos(pitch)
    );
    // 병을 둘러볼 때는 수면 아래로도 내려갈 수 있어야 아래에서 올려다보는 각이 나온다.
    // 수면 아래로 내려가는 건 병을 둘러볼 때만 허용한다. 바닥을 bt로 풀어줘야
    // 병에서 빠져나오는 동안 카메라가 갑자기 위로 튀지 않는다.
    this.camera.position.y = Math.max(this.camera.position.y, 0.16 * (1 - bt));
    // 인트로: 시점을 통째로 수직 이동시킨다. 카메라와 바라보는 지점을 같은 양만큼 올리므로
    // 각도는 그대로고 프레임만 위로 미끄러진다. 충분히 올라가면 바다가 안개 너머로 밀려나
    // 하늘만 남는다(수면 제한보다 뒤에 더해야 올라간 높이가 깎이지 않는다).
    this.camera.position.y += this._lift;

    // 병이 떠 있으면 병 중심을 바라본다. 드래그로 바뀐 yaw/pitch가 그대로 아크가 된다.
    // oX/oY/oZ가 이미 bottleT로 이어져 있어서, 병이 없으면 그대로 배를 본다.
    this.camera.lookAt(oX, oY + this._lift, oZ);

    return { yaw, pitch, radius };
  }

  _animate() {
    requestAnimationFrame(() => this._animate());
    const dt = Math.min(0.05, this.clock.getDelta());
    this.elapsed += dt;
    const t = this.elapsed;

    if (!this._perfDecided) {
      this._perfSamples.push(dt);
      if (this.elapsed > 2.0) {
        this._perfDecided = true;
        const avgDt = this._perfSamples.reduce((a, b) => a + b, 0) / this._perfSamples.length;
        if (avgDt > 0.03) {
          this.waterMesh.material.uniforms.uSpecOn.value = 0.0;
          // 물결도 같은 스위치에 물린다 — 픽셀마다 도는 계산이라 저사양에서 같이 꺼야 한다.
          this.waterMesh.material.uniforms.uRippleOn.value = 0.0;
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1));
        }
        this._perfSamples = null;
      }
    }

    this.windT += (this.windTarget - this.windT) * Math.min(1, dt * 1.5);

    // [버그1] 무한 바다의 전부: 타일을 매 프레임 배 위치로 재중심.
    // 배는 언제나 타일 한가운데에 있고, 파도 위상은 셰이더가 월드좌표로 계산하므로 이음매가 없다.
    this.waterMesh.position.x = this.boat.position.x;
    if (this.shadowCatcher) this.shadowCatcher.position.x = this.boat.position.x;
    // 해와 그림자 절두체를 배에 붙여 둔다 (배가 어디로 가든 그림자가 유지되도록)
    this.sunLight.position.set(
      this.boat.position.x + this._sunOffset.x, this._sunOffset.y, this._sunOffset.z
    );
    this.sunLight.target.position.set(this.boat.position.x, 0, 0);
    this.sunLight.target.updateMatrixWorld();

    // 나아가는 느낌이 강한 상태일수록 파도의 시간축을 빠르게 (전환 시 뚝 끊기지 않게 보간)
    const flowBoostTarget = this.mode === "between" ? 2.0 : (this.mode === "leaving" || this.mode === "returned" ? 0.5 : 0);
    if (this._flowBoost === undefined) this._flowBoost = flowBoostTarget;
    this._flowBoost += (flowBoostTarget - this._flowBoost) * Math.min(1, dt * 1.5);

    // [버그6] 선택지를 바꾼 직후 파도가 미친듯이 흐르고 배가 튀던 문제.
    // 예전 위상은 (speed + flowBoost) * t 였다. flowBoost가 0→2로 바뀌면 위상차가
    // Δflow * t 라서 "얼마나 오래 켜뒀는지"에 비례해 폭발한다 — 60초쯤 지난 뒤 '오가는 중'을
    // 고르면 120라디안(≈19바퀴)이 0.7초 안에 밀려들어왔다.
    // 흐름은 "속도"이므로 위상으로 적분해서 누적한다. 그러면 세기를 바꿔도 위상 자체는
    // 이어지고 흐르는 "속도"만 달라진다 — 파도가 제자리에서 변형된다.
    if (this._flowPhase === undefined) this._flowPhase = 0;
    this._flowPhase += this._flowBoost * dt;
    // 위상은 sin/cos 안에만 들어가므로 2π로 접어도 결과가 완전히 동일하다(정밀도 보호).
    this._flowPhase %= 2 * Math.PI;

    const wu = this.waterMesh.material.uniforms;
    wu.uTime.value = t;
    wu.uBoatX.value = this.boat.position.x;
    wu.uChop.value = 0.32 * (0.4 + 0.6 * this.windT);
    wu.uAmpScale.value = 0.5 + 0.9 * this.windT;
    wu.uFlowPhase.value = this._flowPhase;

    {
      // 2.2 → 3.2: 섬이 화면 밖(x≈3.05)에서 출발하는데 지수 감쇠라 초반에만 빨리 움직이고
      // 정작 프레임에 들어오는 구간에서 느려져서 "늦게 나타난다"는 인상을 줬다. 등장 거리
      // 자체를 줄이면 가로 화면(FOV가 훨씬 넓음)에서 '무한한 바다'에 섬이 새어 보이므로,
      // 거리는 그대로 두고 속도만 올린다.
      // 시간 기반 이징. 지수 감쇠는 ease-out만 되어 출발이 툭 튀었다.
      if (this._shoreT < 1) {
        this._shoreT = Math.min(1, this._shoreT + dt / SHORE_MOVE_SEC);
        this.shoreBlend = this._shoreFrom
          + (this.shoreTarget - this._shoreFrom) * SHORE_EASE(this._shoreT);
      } else {
        this.shoreBlend = this.shoreTarget;
      }
      // 섬은 선착장에 딸려 있다. 배가 멀리 나가 있어도 선착장을 다시 잡으면 그쪽으로 온다.
      this.islandGroup.position.x = this.dockX
        + THREE.MathUtils.lerp(this.islandGoneX, this.islandRestX, this.shoreBlend);
      // [버그4] 섬이 "짠" 하고 나타나던 문제 — 예전 임계값이 0.5라 슬라이드가 절반이나 진행된
      // 뒤에야 visible이 켜졌다(= 화면 중앙 근처에서 갑자기 팝인). visible은 완전히 사라졌을 때
      // 렌더를 건너뛰려는 용도일 뿐이므로 0에 가깝게 두면 화면 밖에서부터 미끄러져 들어온다.
      this.islandGroup.visible = this.shoreBlend > 0.002;
      // 여정의 뒤쪽 절반에서만 투명해진다. 앞쪽은 또렷한 채로 멀어지고,
      // 멀어질수록 안개가 옅게 덮은 위에 알파가 빠지면서 자연스럽게 지워진다.
      if (this.islandMats) {
        const fade = THREE.MathUtils.smoothstep(this.shoreBlend, 0.0, SHORE_FADE_UNTIL);
        for (const m of this.islandMats) m.opacity = fade;
      }

      let rotZ = 0;
      let targetX = 0;

      const TRAVEL_DURATION = 6.5; // '돌아온 사람'이 먼 바다에서 해안까지 오는 데 걸리는 시간(초)
      // '오가는 중' 순항 속도(월드 단위/초). 컨베이어를 걷어낸 뒤로 화면에서 파도가 흘러가는
      // 속도는 전적으로 이 값이 결정한다(배가 나아간 만큼 파도가 스쳐 지나감).
      // 흐름이 느리거나 빠르게 느껴지면 다른 데 손대지 말고 이 숫자만 조절할 것.
      const CRUISE_SPEED = 1.2;

      // 목적지는 전부 선착장(dockX) 기준이다. 절대 좌표 0을 쓰지 않으므로 배가 어디에
      // 있든 순간이동 없이 이어진다 (setMode의 선착장 재설정 참고).
      if (this.mode === "returned") {
        const et = t - this.modeChangedAt;
        const p = Math.min(1, et / TRAVEL_DURATION);
        targetX = THREE.MathUtils.lerp(this.dockX - RETURN_DISTANCE, this.dockX, easeOutCubic(p));
        rotZ += -0.06 * (1 - p);
      } else if (this.mode === "leaving") {
        targetX = this.dockX;
      } else if (this.mode === "between") {
        // 멈추지 않고 계속 나아감. 카메라가 배를 따라가므로 배는 화면상 제자리처럼 보이고,
        // 월드에 고정된 파도만 옆으로 흘러간다.
        const et = t - this.modeChangedAt;
        targetX = (this.cruiseFromX ?? this.dockX) - CRUISE_SPEED * et;
        rotZ += Math.sin(t * 0.7) * 0.015;
      } else if (this.mode === "unsure") {
        // 표류 — 섬이 없으니 돌아갈 기준점도 없다. 있던 자리에 그대로 선다.
        targetX = this._boatEaseX ?? this.dockX;
      } else {
        targetX = this.dockX + Math.sin(t * 0.4) * 0.03;
      }

      if (this.mode !== "stay" && this.mode !== "unsure") {
        this._spawnSmoke(dt);
      }

      if (this._boatEaseX === undefined) this._boatEaseX = targetX;
      this._boatEaseX += (targetX - this._boatEaseX) * Math.min(1, dt * 3.0);
      const boatX = this._wrapWave(this._boatEaseX);

      const waveY = this._waveHeightAt(boatX, 0, t, this._flowPhase);
      const waveSlope = this._waveHeightAt(boatX + 0.12, 0, t, this._flowPhase) - this._waveHeightAt(boatX - 0.12, 0, t, this._flowPhase);

      // '아직 모르겠음'은 '돌아온 사람'과 같은 방향을 본다.
      // 땅과 바위(islandGroup)는 shoreTarget이 0이라 미끄러져 나가므로 화면에 남지 않는다.
      const headingTarget = (this.mode === "returned" || this.mode === "unsure") ? 0 : Math.PI;
      if (this.headingY === undefined) this.headingY = headingTarget;
      let headingDiff = headingTarget - this.headingY;
      headingDiff = ((headingDiff + Math.PI) % (2 * Math.PI)) - Math.PI;
      this.headingY += headingDiff * Math.min(1, dt * 1.5);

      // '오가는 중'은 파도를 잔잔하게 두면서도(windTarget 0.1) 배는 더 흔들려야
      // 나아가는 느낌이 산다. 바다가 아니라 배에만 곱한다.
      const bob = BOAT_BOB_BY_MODE[this.mode] ?? 1;
      this.boat.position.x = boatX;
      this.boat.position.y = 0.0 + waveY * bob + this._dropOffset;
      this.boat.rotation.z = rotZ + waveSlope * 0.9 * bob;
      this.boat.rotation.y = this.headingY + Math.sin(t * 0.5) * 0.08;
    }

    this._updateSmoke(dt);

    // 카메라가 배를 따라가는 지점 — 순간이동은 상한 속도로 흡수한다 (CAM_FOLLOW_MAX_SPEED 참고)
    if (this._camFollowX === undefined) this._camFollowX = this.boat.position.x;
    {
      const d = this.boat.position.x - this._camFollowX;
      const step = CAM_FOLLOW_MAX_SPEED * dt;
      this._camFollowX += Math.abs(d) <= step ? d : Math.sign(d) * step;
    }

    if (this._liftT < 1) {
      this._liftT = Math.min(1, this._liftT + dt / this._liftDur);
      this._lift = this._liftFrom + (this._liftTarget - this._liftFrom) * this._liftEase(this._liftT);
      // 카메라가 멈추기 BOAT_DROP_LEAD초 전에 배가 나타나 떨어지기 시작한다.
      if (this._liftTarget === 0 && this._dropT >= 1 && !this.boat.visible
          && (1 - this._liftT) * this._liftDur <= BOAT_DROP_LEAD) {
        this._startBoatDrop();
      }
      if (this._liftT >= 1) {
        const cb = this._onLiftDone; this._onLiftDone = null; cb && cb();
        // 떨어지는 배가 없으면(되돌아온 경우 등) 카메라가 멎는 즉시 끝난 것으로 본다.
        if (this._dropT >= 1) this._fireIntroSettled();
      }
    }
    this._updateBoatDrop(dt);
    this._updateClouds();
    this._updateRipples(dt);

    this.bottleT += (this.bottleTarget - this.bottleT) * Math.min(1, dt * 2.2);
    // 병이 오르내리는 동안 배경 하늘도 같이 건너간다. 매 프레임 다시 칠하면 낭비라
    // 눈에 보일 만큼 바뀐 프레임에만 칠한다.
    if (Math.abs(this.bottleT - this._skyBlend) > 0.004) this._refreshSky();
    // 시간대 전환
    if (this._timeT < 1) {
      this._timeT = Math.min(1, this._timeT + dt / TIME_MOVE_SEC);
      this._applyTime(easeInOutQuint(this._timeT));
    }

    // 단계 전환: 각도는 그대로 두고 목적지(target)와 거리(radius)만 ease-in-out으로 이동한다.
    // 결과에서 빠져나올 때 둘러보던 각도를 카메라 전환과 같은 곡선으로 되돌린다.
    if (this._orbitT < 1) {
      this._orbitT = Math.min(1, this._orbitT + dt / CAM_MOVE_SEC);
      const k = easeInOutCubic(this._orbitT);
      this.orbitYaw = this._orbitFrom.yaw + (this._orbitTo.yaw - this._orbitFrom.yaw) * k;
      this.orbitPitch = this._orbitFrom.pitch + (this._orbitTo.pitch - this._orbitFrom.pitch) * k;
    }
    if (this._camT < 1) {
      this._camT = Math.min(1, this._camT + dt / this._camDur);
      const k = easeInOutCubic(this._camT);
      const a = this._camFrom, b = this._camTo;
      this._camCur = {
        tx: a.tx + (b.tx - a.tx) * k,
        ty: a.ty + (b.ty - a.ty) * k,
        tz: a.tz + (b.tz - a.tz) * k,
        radius: a.radius + (b.radius - a.radius) * k,
        // widen도 같이 이어줘야 한다. 빼먹으면 전환이 끝난 뒤 _camCur에 widen이 없어
        // 결과 화면이 기본 상한으로 되돌아가 병이 다시 잘린다.
        widen: a.widen + (b.widen - a.widen) * k,
      };
    }
    this.bottleMat.opacity = 0.28 * this.bottleT;
    this.bottleRimMat.opacity = 0.62 * this.bottleT;
    this.bottleCorkMat.opacity = 0.9 * this.bottleT;
    this.bottleWaterMat.opacity = 0.9 * this.bottleT;
    if (this.bottleT < 0.01) this.bottleGroup.visible = false;
    // 병은 scene에 직접 붙어 있어 배를 따라가지 않았다. '오가는 중'처럼 배가 이동하는
    // 상태로 결과 화면에 오면 병만 원점에 남아 화면 밖으로 사라진다.
    this.bottleGroup.position.x = this.boat.position.x + BOTTLE_SHIFT_X;

    // 바다를 병 안으로 가둔다. bottleT가 0→1로 가는 동안 반지름과 길이를 넓은 값에서
    // 병 크기까지 좁혀와서, 바다가 병 속으로 빨려드는 것처럼 보이게 한다.
    const wc = this.waterMesh.material.uniforms;
    if (this.bottleT > 0.01) {
      const t = Math.min(1, this.bottleT);
      const bx = this.boat.position.x + BOTTLE_SHIFT_X;
      wc.uClipOn.value = 1.0;
      wc.uClipCenter.value.set(bx, BOTTLE_Y, BOTTLE_SHIFT_Z);
      wc.uClipT.value = t;
    } else {
      wc.uClipOn.value = 0.0;
    }

    const { yaw, pitch, radius } = this._placeCamera();

    if (this.debugCam && this.camDebugEl) {
      this.camDebugEl.textContent =
        `yaw: ${yaw.toFixed(3)}\npitch: ${pitch.toFixed(3)}\nradius: ${radius.toFixed(2)}\n(드래그로 각도 잡고 이 값을 baseYaw/basePitch/radius에 붙여넣기)`;
    }

    if (this.visible) this.renderer.render(this.scene, this.camera);
  }
}

try {
  window.BottleScene = new BottleScene();
  selfCheck(window.BottleScene);
} catch (err) {
  console.error("BottleScene 초기화 실패:", err);
}

// 자기검증(콘솔) — 조용히 깨지면 한참 뒤에나 눈치채는 것들만 딱 두 개.
// 실패해도 씬은 그대로 돌아가고, 콘솔에 빨간 assert만 남는다.
function selfCheck(s) {
  // 1) 파도 랩어라운드가 정말 "위상 불변"인가.
  //    깨지면 '오가는 중'으로 오래 항해할 때 바다가 순간적으로 튄다.
  const a = s._waveHeightAt(3.7, 0.9, 12.5, 0);
  const b = s._waveHeightAt(3.7 + s.WAVE_WRAP_DOMAIN, 0.9, 12.5, 0);
  console.assert(
    Math.abs(a - b) < 1e-6,
    "[selfCheck] WAVE_WRAP_DOMAIN이 유효파장(wavelength/dirX)의 공배수가 아님 — 랩 순간 바다가 튄다", a, b
  );

  // 2) 배 들썩임(JS)과 물 표면(GLSL)이 같은 파도를 쓰고 있는가.
  //    둘 중 하나만 고치면 배가 수면에서 붕 뜨거나 잠긴다.
  const glsl = s.waterMesh.material.vertexShader;
  s.gerstnerWaves.forEach((w) => {
    console.assert(
      glsl.includes(`/ ${w.wavelength};`),
      `[selfCheck] 파장 ${w.wavelength}가 셰이더에 없음 — JS와 GLSL 파도 정의가 어긋났다`
    );
  });

  // 3) 바다 끝을 가리는 안개가 실제로 물에 걸려 있는가.
  //    scene.fog는 "쓰겠다"고 선언한 재질에만 적용돼서, 셰이더를 손대다 청크나 fog:true를
  //    떨어뜨리면 바다만 안개를 안 먹고 수평선이 다시 직선으로 잘린다(조용히 깨지는 쪽).
  const mat = s.waterMesh.material;
  console.assert(
    mat.fog === true && !!mat.uniforms.fogColor && mat.fragmentShader.includes("fog_fragment"),
    "[selfCheck] 물 재질에 안개 배선이 빠졌다 — 수평선에 하드 경계가 다시 생긴다"
  );

  // 3-1) 흐름 세기를 바꿔도 파도가 "제자리에서" 변형되는가 — 오래 켜둔 뒤일수록 잘 터진다.
  //      위상이 다시 시간에 비례하는 식(flow * t)으로 돌아가면, t가 큰 시점에서 흐름값이
  //      조금만 달라져도 파도가 통째로 밀려 배가 튄다. 늦은 시각 t에서 검사해야 잡힌다.
  const tLate = 1000;
  const drift = Math.abs(s._waveHeightAt(0.3, 0, tLate, 0.10) - s._waveHeightAt(0.3, 0, tLate, 0.11));
  console.assert(
    drift < 0.01,
    `[selfCheck] 흐름값을 0.01 바꿨을 뿐인데 파도 높이가 ${drift.toFixed(4)} 튐 — 위상이 시간에 비례하고 있다(선택지 전환 시 파도 폭주)`
  );

  // 4) 가장 많이 줌아웃한 상태(결과 화면)에서도 안개가 바다 타일 끝보다 먼저 짙어지는가.
  //    여기가 뒤집히면 안개가 다 끼기 전에 타일이 끝나서 경계선이 그대로 보인다.
  //    타일 크기·카메라 거리·안개 범위 중 아무거나 건드리면 조용히 깨지는 조합.
  const tileRadius = s.waterMesh.geometry.parameters.width / 2;
  const worstFar = fogRangeFor(CAM_RADIUS.far).far;
  console.assert(
    worstFar < tileRadius + CAM_RADIUS.far,
    `[selfCheck] 최대 줌아웃에서 fog.far(${worstFar})가 타일 끝(${tileRadius + CAM_RADIUS.far})보다 멀다 — 바다 경계가 드러난다`
  );
}
</script>
</body>
</html>
