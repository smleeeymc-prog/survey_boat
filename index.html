        const toGroup = new THREE.Matrix4().copy(offset.group.matrixWorld).invert().multiply(o.matrixWorld);
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i).applyMatrix4(toGroup).add(offset.at);
          const u = -(v.x - cx) / BOTTLE_SCALE_X;
          const R = bottleRadiusAtU(u) * BOTTLE_SCALE_R;
          const r = Math.hypot(v.y - BOTTLE_Y, v.z - BOTTLE_SHIFT_Z);
          worst = Math.min(worst, R > 0 ? R - r : -r);
        }
      });
      return worst;
    };
    const rows = [];
    const ship = this.boat.getObjectByName(GLB_NODES.ship);
    if (ship) rows.push(["배", fit(ship, { group: this.boat, at: new THREE.Vector3(0, 0, 0) })]);
    // GLB에서 온 섬 노드만 잰다 (등대 빛줄기·번짐처럼 코드가 붙인 것은 빼고)
    const islandNodes = [GLB_NODES.rock, GLB_NODES.beachhouse, GLB_NODES.backMountain, GLB_NODES.lighthouse];
    for (const c of this.islandGroup.children) {
      if (islandNodes.indexOf(c.name) === -1) continue;
      rows.push([c.name, fit(c, { group: this.islandGroup, at: islandAt })]);
    }
    const out = rows.filter(([, w]) => w < 0).map(([n]) => n);
    console.log("[병] 유리까지 여유(음수 = 삐져나옴): "
      + rows.map(([n, w]) => `${n} ${w >= 0 ? "+" : ""}${w.toFixed(2)}`).join(", ")
      + (out.length ? ` — ${out.join("·")}는 결과 화면에서 병 모양에 맞춰 눌러 담긴다` : ""));
    // 섬은 넘쳐도 눌러 담기지만 배는 그렇지 않다 — 배가 넘치면 병 배율(BOTTLE_SCALE_*)을 손봐야 한다.
    console.assert(out.indexOf("배") === -1, "[selfCheck] 배가 병 밖으로 삐져나온다 — BOTTLE_SCALE_* 확인");
  }

  _applyRockColor(hex) {
    if (!this.rockMats) { this._pendingRegionHex = hex; return; }
    this.rockMats.forEach((m) => m.color.setHex(hex));
  }

  /**
   * 그림자만 받는 평면. 물 표면 바로 위에 깔린다.
   * 물은 커스텀 셰이더라 그림자를 받게 하려면 셰이더에 조명·그림자 청크를 통째로
   * 끌어와야 한다. ShadowMaterial 평면 하나를 대신 깔면 물 셰이더를 건드리지 않고도
   * 배와 섬의 그림자가 수면에 떨어진다. 비용도 거의 없다.
   */
  /**
   * 룩의 거칠기 상한을 재질에 건다. 원래 값은 userData에 남겨 두어 basic으로 돌아가면 되돌린다.
   */
  _applyLookRoughness(root) {
    const done = new Set();
    root.traverse((o) => {
      if (!o.isMesh || !o.material || !o.material.isMeshStandardMaterial || done.has(o.material)) return;
      const m = o.material;
      done.add(m);
      if (m.userData.baseRoughness === undefined) m.userData.baseRoughness = m.roughness;
      m.roughness = LOOK.roughness !== undefined ? Math.min(m.userData.baseRoughness, LOOK.roughness) : m.userData.baseRoughness;
    });
  }

  /**
   * 부드러운 그림자(PCFSoft) 켜기/끄기 — 테스트 메뉴용. 켜면 배·소품·섬이 서로 드리우고 받고, 해가 늘
   * 그림자 맵을 그린다(매 프레임, 굽지 않음 — 헤드리스에서 약 +30ms였다). 끄면 원래대로(저녁에 수면만).
   * 그림자 방식이 바뀌면 재질을 다시 컴파일해야 해서 한 번 멈칫한다.
   */
  setSoftShadows(on) {
    this._softShadows = !!on;
    this.renderer.shadowMap.type = on ? THREE.PCFSoftShadowMap : THREE.BasicShadowMap;
    this.sunLight.shadow.normalBias = on ? 0.025 : 0;
    const ship = this.shipNode;
    const set = (root, cast, recv) => root && root.traverse((o) => {
      if (!o.isMesh || !o.material || !o.material.isMeshStandardMaterial) return;
      o.castShadow = cast; o.receiveShadow = recv;
    });
    set(ship, true, !!on);
    set(this.islandGroup, !!on, !!on);
    this.scene.traverse((o) => {
      if (!o.material) return;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; });
    });
    this._applyTime(this._timeT >= 1 ? 1 : easeInOutQuint(this._timeT));
  }

  /**
   * 룩을 바꾼다 (LOOKS의 이름, 필름 룩이면 톤도 — TONES의 키). 톤 매핑이 바뀌면 재질을 다시 컴파일해야 해서 한 번 멈칫할 수 있다.
   * 테스트 메뉴(dev/look-lab.js)가 부른다.
   */
  setLook(name, tone) {
    if (!LOOKS[name]) return;
    for (const k of Object.keys(LOOK)) delete LOOK[k];
    Object.assign(LOOK, { name }, LOOKS[name]);
    if (tone && TONES[tone] && name !== "basic") LOOK.tone = tone;   // 필름 룩의 톤만 갈아 끼운다
    refreshLookScales();
    const t = TONES[LOOK.tone] || TONES.none;
    const recompile = this.renderer.toneMapping !== t.mapping;
    this.renderer.toneMapping = t.mapping;
    this.renderer.toneMappingExposure = LOOK.tone === "none" ? 1 : t.exposure;
    if (recompile) {
      this.scene.traverse((o) => {
        if (!o.material) return;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; });
      });
    }
    this._applyLookRoughness(this.boat);
    this._applyLookRoughness(this.islandGroup);
    // 조명 세기는 시간대 적용 식에 배수로 들어가 있으므로 지금 시간대로 다시 적용한다
    this._applyTime(this._timeT >= 1 ? 1 : easeInOutQuint(this._timeT));
  }

  /**
   * 표면 효과를 모델 재질에 붙인다 (배·소품·섬). 모두 this.fx 유니폼 세기로 켜고 끈다.
   * - AO: GLB에 구운 _AO(tools/build_scene_glb.py)를 채움광에 곱하고 해에도 조금 곱한다 —
   *   갑판 모서리·집 층 사이·소품이 닿는 자리가 가라앉는다.
   * - 물빛: 수면(월드 y≈0) 가까운 면에 일렁이는 코스틱 무늬를 해 색으로 더한다.
   * - 광택·테두리 빛: 반사 방향으로 하늘 그라데이션을 읽어 매끈한 면에 비치게 하고(프레넬),
   *   가장자리를 하늘빛으로 살짝 밝힌다. 텍스처 없이 계산만 — 환경맵(IBL)보다 훨씬 가볍다.
   * 선체는 나무 외판(_installWood)도 붙는다.
   */
  _installSurfaceFx(root) {
    const done = new Set();
    root.traverse((o) => {
      if (!o.isMesh || !o.material || !o.material.isMeshStandardMaterial || o.name === "Clover") return;
      const g = o.geometry;
      // AO가 없는 지오메트리는 1(안 막힘)로 채운다 — 없으면 WebGL 기본값 0이 들어가 새까매진다
      if (!g.attributes._ao) g.setAttribute("_ao", new THREE.BufferAttribute(new Float32Array(g.attributes.position.count).fill(1), 1));
      if (GLB_NODES.hull.test(o.name) && o.parent === this.shipNode) this._installWood(o);
      if (done.has(o.material)) return;
      done.add(o.material);
      patchMaterial(o.material, "surface-fx", (shader) => this._surfaceFxShader(shader, o.material));
    });
  }

  _surfaceFxShader(shader, mat) {
    for (const k of Object.keys(this.fx)) shader.uniforms[k] = this.fx[k];
    // 재질마다 광택·테두리 빛을 줄이는 배수 (userData.fxEdge, 기본 1). 셰이더 코드는 같아서 프로그램은
    // 공유되고, uniform 값만 재질별로 따로 들어간다 — 지금은 튜브만 쓴다(TUBE_TINT 참고).
    shader.uniforms.uFxEdge = { value: mat && mat.userData.fxEdge !== undefined ? mat.userData.fxEdge : 1 };
    shader.vertexShader = shader.vertexShader
      .replace("void main() {", `
        attribute float _ao;
        varying float vFxAO;
        varying vec3 vFxWorld;
        void main() {`)
      .replace("#include <project_vertex>", `
        vFxAO = _ao;
        vFxWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
        #include <project_vertex>`);
    shader.fragmentShader = shader.fragmentShader
      .replace("void main() {", `
        uniform float uFxEdge;
        uniform float uFxTime, uAOAmt, uCausticAmt, uSheenAmt, uRimAmt, uFacetAmt;
        uniform vec3 uSkyTop, uSkyHor, uRimColor, uSunCol;
        varying float vFxAO;
        varying vec3 vFxWorld;
        // 물결 코스틱 — 좌표를 몇 번 비틀어 밝은 실선이 얽히게 한다 (joltz0r의 water turbulence).
        // 원본처럼 좌표를 -250 근처로 옮겨야 값이 0~1에 머문다(원점 근처에선 폭주해 화면이 하얘졌다).
        float fxCaustic(vec2 uv, float t) {
          vec2 p = uv * 6.2831853 - 250.0;
          vec2 i = p; float c = 1.0; const float inten = 0.005;
          for (int n = 0; n < 4; n++) {
            float tt = t * (1.0 - (3.5 / float(n + 1)));
            i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
            c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
          }
          c /= 4.0;
          c = 1.17 - pow(c, 1.4);
          return clamp(pow(abs(c), 8.0), 0.0, 1.0);
        }
        void main() {`)
      .replace("#include <normal_fragment_maps>", `
        #include <normal_fragment_maps>
        // 면마다 색 변주 — 면의 법선(화면 미분)으로 해시를 내서 밝기 ±10%, 따뜻함/차가움을 살짝 돌린다.
        // 레퍼런스(로우폴리 해변 바위)처럼 한 덩어리 안에서도 면마다 색이 조금씩 다르게.
        if (uFacetAmt > 0.0) {
          vec3 fxFN = normalize(cross(dFdx(vFxWorld), dFdy(vFxWorld)));
          float fxH = fract(sin(dot(floor(fxFN * 9.0 + 0.5), vec3(12.9898, 78.233, 37.719))) * 43758.5453);
          float fxH2 = fract(fxH * 7.31 + 0.13);
          vec3 fxTint = mix(vec3(0.93, 0.98, 1.07), vec3(1.07, 0.99, 0.90), fxH2);
          diffuseColor.rgb *= mix(vec3(1.0), fxTint * (0.9 + fxH * 0.2), uFacetAmt);
        }`)
      .replace("#include <aomap_fragment>", `
        float fxAO = mix(1.0, clamp(vFxAO, 0.0, 1.0), uAOAmt);
        reflectedLight.indirectDiffuse *= fxAO;
        reflectedLight.directDiffuse *= mix(1.0, fxAO, ${AO.direct.toFixed(3)});
        reflectedLight.directSpecular *= fxAO;
        #include <aomap_fragment>`)
      .replace("#include <opaque_fragment>", `
        {
          vec3 fxN = inverseTransformDirection(normal, viewMatrix);
          vec3 fxV = inverseTransformDirection(normalize(vViewPosition), viewMatrix);
          float fxNdV = clamp(dot(fxN, fxV), 0.0, 1.0);
          // 광택: 하늘 반사. 예전엔 바닥값(0.04)이 모든 면에 깔려 화면이 뿌옇게 떴다 — 바닥값을 빼고
          // 비스듬히 볼 때만(프레넬) 매끈한 정도만큼 비치게 한다.
          if (uSheenAmt > 0.0) {
            vec3 fxR = reflect(-fxV, fxN);
            vec3 fxSky = mix(uSkyHor, uSkyTop, smoothstep(-0.05, 0.75, fxR.y));
            // 프레넬 지수 3 — 5면 로우폴리의 넓은 면에서는 거의 안 보였다(09-26 사용자: "티가 안 남").
            // 거친 재질도 조금은 비치게 바닥 0.35를 둔다(거칠기 1인 선체·캐빈도 가장자리 쪽엔 하늘이 돈다).
            float fxFres = pow(1.0 - fxNdV, 3.0);
            float fxGloss = mix(0.35, 1.0, smoothstep(0.1, 0.6, 1.0 - material.roughness));
            outgoingLight += fxSky * fxFres * fxGloss * 0.45 * uSheenAmt * fxAO * uFxEdge;
          }
          // 테두리 빛: 실루엣 바로 가장자리만. 예전엔 pow(1-NdV, 3)라 비스듬한 평면(로우폴리의 넓은
          // 옆면·갑판)이 통째로 밝아져 전체가 뿌옇게 보였다 — 좁은 띠로 깎았다.
          if (uRimAmt > 0.0) {
            float fxRim = smoothstep(0.72, 0.97, 1.0 - fxNdV);
            outgoingLight += uRimColor * fxRim * fxRim * 0.35 * uRimAmt * fxAO * uFxEdge;
          }
          if (uCausticAmt > 0.0) {
            // 수면(y≈0)에서 위로 0.4쯤까지만. 물 아래는 바다가 덮는다.
            float fxNear = exp(-max(vFxWorld.y, 0.0) / 0.16) * smoothstep(-0.25, 0.0, vFxWorld.y);
            if (fxNear > 0.01) {
              // 옆면(선체·기둥)은 높이를 섞어 그물이 서게, 윗면(바위 위)은 수평 좌표 그대로
              float fxUp = abs(fxN.y);
              vec2 fxUV = mix(vec2(vFxWorld.x + vFxWorld.z * 0.7, vFxWorld.y * 2.2 + (vFxWorld.x - vFxWorld.z) * 0.35),
                              vFxWorld.xz, smoothstep(0.6, 0.9, fxUp));
              // 밝은 실선만 남긴다 — 무늬 전체를 더하면 대리석처럼 보였다
              float fxC = smoothstep(0.3, 0.95, fxCaustic(fxUV * 1.2, uFxTime * 0.55));
              float fxSide = 0.35 + 0.65 * clamp(1.0 - fxUp, 0.0, 1.0);
              outgoingLight += uSunCol * fxC * fxNear * fxSide * 0.30 * uCausticAmt;
            }
          }
        }
        #include <opaque_fragment>`);
  }

  /**
   * 선체 나무 — 배 좌표로 계산하는 절차적 무늬라 UV도 텍스처도 필요 없다. 카툰 로우폴리 톤:
   * 옆면은 가로 판자, 윗면(갑판)은 길이 방향 꿀색 판자. 판자마다 평평한 색 3단계와 윗단 밝은 띠,
   * 굵은 이음매. 물 아래는 짙은 바닥 칠. (woodPerturb는 요철용으로 남겨 두었지만 지금은 안 쓴다)
   * 지금은 갑판에만 깐다(uWoodSideAmt 0) — 어디가 갑판인지는 _markDeckFaces가 정점 속성 _deck으로 찍는다.
   */
  _installWood(hull) {
    // 배 색(setPaint)이 만지는 두 값 — 선체 재질 색(GLB 단색)과 갑판 판자 색. 원래 값을 기억해 'base'로 돌아온다.
    this._hullMat = hull.material;
    this._hullBase = hull.material.color.clone();
    this._deckBase = new THREE.Color(BOAT_PAINT.deck);
    this._deckColU = { value: this._deckBase.clone() };
    if (this._paintPending) { const p = this._paintPending; this._paintPending = null; this.setPaint(p.hull, p.deck, { instant: true, pure: p.pure }); }
    hull.updateMatrix();
    const toShip = hull.matrix.clone();                         // 선체 로컬 → 배 로컬 (선체는 Ship의 자식)
    const toShipN = new THREE.Matrix3().getNormalMatrix(toShip);
    this._markDeckFaces(hull, toShip);
    this._markHullParts(hull, toShip);
    patchMaterial(hull.material, "wood", (shader) => {
      shader.uniforms.uMastCol = this._tintSlot("mast", BOAT_PAINT.mast);
      shader.uniforms.uStairRailCol = this._tintSlot("stairRail", BOAT_PAINT.stairRail);
      shader.uniforms.uStairTreadCol = this._tintSlot("stairTread", BOAT_PAINT.stairTread);
      shader.uniforms.uDeckCol = this._deckColU;   // 배 색 단계가 바꾼다(setPaint) — 컴파일 전에도 잡을 수 있게 바깥 객체
      this._hullPaintU = shader.uniforms;   // 색 눈금 맞출 때 콘솔·검증 스크립트가 만진다(6.17)
      shader.uniforms.uHullToShip = { value: toShip };
      shader.uniforms.uHullToShipN = { value: toShipN };
      shader.uniforms.uWoodAmt = this.fx.uWoodAmt;
      shader.uniforms.uWoodSideAmt = this.fx.uWoodSideAmt;
      shader.vertexShader = shader.vertexShader
        .replace("void main() {", `
          uniform mat4 uHullToShip; uniform mat3 uHullToShipN;
          attribute float _deck;
          attribute float _part;
          varying vec3 vWoodP; varying vec3 vWoodN; varying float vWoodDeck; varying float vWoodPart;
          void main() {`)
        .replace("#include <project_vertex>", `
          vWoodP = (uHullToShip * vec4(transformed, 1.0)).xyz;
          vWoodN = normalize(uHullToShipN * objectNormal);
          vWoodDeck = _deck;
          vWoodPart = _part;
          #include <project_vertex>`);
      shader.fragmentShader = shader.fragmentShader
        .replace("void main() {", `
          uniform float uWoodAmt, uWoodSideAmt;
          uniform vec3 uMastCol, uStairRailCol, uStairTreadCol, uDeckCol;
          varying vec3 vWoodP; varying vec3 vWoodN; varying float vWoodDeck; varying float vWoodPart;
          float woodHash(float n) { return fract(sin(n * 12.9898) * 43758.5453); }
          ${SEAM_TONE_GLSL}
          // 판자 이음매: 판자 안쪽은 1, 이음매 선에서 0 (멀어서 선이 픽셀보다 가늘면 흐리게 — 반짝임 방지)
          float woodSeam(float v, float w) {
            float f = fract(v), aa = max(w, fwidth(v) * 1.5);
            return smoothstep(0.0, aa, f) * smoothstep(1.0, 1.0 - aa, f);
          }
          vec3 woodPerturb(vec3 surfPos, vec3 surfNorm, vec2 dHdxy, float faceDir) {
            vec3 sx = dFdx(surfPos), sy = dFdy(surfPos);
            vec3 r1 = cross(sy, surfNorm), r2 = cross(surfNorm, sx);
            float det = dot(sx, r1) * faceDir;
            vec3 grad = sign(det) * (dHdxy.x * r1 + dHdxy.y * r2);
            return normalize(abs(det) * surfNorm - grad);
          }
          void main() {`)
        .replace("#include <normal_fragment_maps>", `
          #include <normal_fragment_maps>
          if (uWoodAmt > 0.0) {
            // 카툰 로우폴리 나무 — 결·요철 없이 판자마다 평평한 색 3단계, 굵은 이음매, 판자 윗단에 밝은 띠.
            // (처음엔 결·홈 범프까지 넣었더니 너무 실사·모델링처럼 보였다 — 09-26 사용자)
            // 배 로컬 단위 (배 길이 약 0.85, 흘수선 y = -${SHIP_DRAFT.toFixed(3)})
            vec3 p = vWoodP;
            // 갑판 = 위를 보는 면 중 _markDeckFaces가 바닥으로 고른 것 (뱃전 윗단·계단·돛대는 빠진다)
            float deck = step(0.65, vWoodN.y) * step(0.5, vWoodDeck);
            // 옆면: 높이 0.04마다 한 장 / 갑판: 폭 0.024마다 한 장
            float sv = p.y / 0.04, dv = p.z / 0.024;
            float v = mix(sv, dv, deck);
            float idx = floor(v);
            float f = fract(v);
            float seam = woodSeam(v, 0.09);
            // 갑판 판자 끝 이음매 — 판자마다 어긋난 자리에서 끊긴다(레퍼런스 갑판처럼). 토막마다 색 단계도 다르다.
            float bu = (p.x + woodHash(idx * 3.7 + 1.0) * 0.13) / 0.13;
            float seg = floor(bu) * deck;
            float butt = mix(1.0, woodSeam(bu, 0.02), deck);
            // 색 단계: 옆면 0.86/0.96/1.06, 갑판은 폭을 넓혀 0.84/0.97/1.10 — 레퍼런스 갑판은 판자마다 차이가 크다
            float tone = mix(0.86, 0.84, deck) + floor(woodHash(idx + seg * 7.13 + deck * 17.0) * 3.0) * mix(0.1, 0.13, deck);
            float bevel = smoothstep(0.62, 0.9, f) * (1.0 - smoothstep(0.9, 0.93, f));  // 판자 윗단 밝은 띠
            vec3 base = diffuseColor.rgb;
            vec3 sideCol = mix(base, vec3(0.30, 0.10, 0.05), 0.35);                     // 따뜻한 붉은 갈색
            // 갑판: 예전엔 꿀색 원목(0.50, 0.29, 0.12)이었다 — 레퍼런스의 붉은 갈색 판자로 (BOAT_PAINT.deck)
            vec3 wood = mix(sideCol, uDeckCol, deck) * tone * (1.0 + bevel * mix(0.18, 0.10, deck));
            // 물 아래는 짙은 바닥 칠 (띠 없이 색만 — 흰 흘수선 띠는 배가 떨어지기 전에도 보여서 뺐다)
            float below = (1.0 - deck) * (1.0 - smoothstep(-${SHIP_DRAFT.toFixed(3)} + 0.005, -${SHIP_DRAFT.toFixed(3)} + 0.008, p.y));
            wood = mix(wood, base * vec3(0.55, 0.40, 0.42), below);
            // 이음매: 밝은 나무엔 어두운 선, 어두운 나무(배 색 단계의 진남·먹색 등)엔 밝은 선 — 어두운 판자에 검은 선은 안 보인다
            wood = woodSeamTone(wood, mix(sideCol, uDeckCol, deck), 1.0 - seam, 0.4);
            wood = woodSeamTone(wood, mix(sideCol, uDeckCol, deck), 1.0 - butt, 0.38);
            diffuseColor.rgb = mix(diffuseColor.rgb, wood, uWoodAmt * mix(uWoodSideAmt, 1.0, deck));
          }
          // 마스트·계단 — 무늬 없이 제 색(_markHullParts). 나무 켜고 끄기와 무관하게 늘 칠한다.
          if (vWoodPart > 0.5) {
            diffuseColor.rgb = vWoodPart < 1.5 ? uMastCol : (vWoodPart < 2.5 ? uStairRailCol : uStairTreadCol);
          }`);
    });
  }

  /**
   * 선체 메쉬 안의 마스트·계단을 찾아 정점 속성 _part로 찍는다 (0 선체, 1 마스트, 2 계단 옆판, 3 계단 디딤판).
   * 선체는 재질 하나(단색)라 색으로는 못 가른다. 좌표로 이어진 덩어리로 나누면 부품이 따로 떨어진다
   * (09-30 GLB: 덩어리 14개 — 몸통 1, 마스트 3, 계단 8, 갑판 해치 2):
   *   - 가장 큰 덩어리 = 선체 몸통
   *   - 마스트 = 몸통 윗단보다 2cm 넘게 솟은 덩어리 (기둥, 캐빈 지붕 위 가로대, 꼭대기 가로대)
   *   - 계단 옆판 = 길고 높은데 얇은 판 (길이·높이 > 0.1, 두께 < 0.02)
   *   - 계단 디딤판 = 옆판 두 장이 감싸는 상자 안에 든 나머지 덩어리
   * 모델을 다시 뽑아 못 찾으면 그 부품만 선체 색으로 남는다 — assert로 알린다.
   */
  _markHullParts(hull, toShip) {
    const pos = hull.geometry.attributes.position;
    const P = new Float32Array(pos.count * 3), v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) v.fromBufferAttribute(pos, i).applyMatrix4(toShip).toArray(P, i * 3);
    const r = markHullParts(P);   // statistics/shared/boat-look.js — 지도와 같은 판정
    hull.geometry.setAttribute("_part", new THREE.BufferAttribute(r.part, 1));
    console.assert(r.mast >= 1 && r.rails === 2 && r.treads >= 2,
      `[selfCheck] 선체 부품 판정이 이상하다 — 마스트 ${r.mast}(보통 3) · 계단 옆판 ${r.rails}(2) · 디딤판 ${r.treads}(6)`);
  }


  /**
   * 선체에서 '갑판 바닥'인 면을 골라 정점 속성 _deck(1 = 갑판)으로 찍는다. 나무 판자는 여기에만 깐다.
   * 선체는 재질 하나(Kapal, 텍스처 없는 단색)라 색으로는 못 가르고, 모양으로 가른다:
   * 위를 보는 면(법선 y > 0.65)을 모서리로 이어진 덩어리로 묶고, 두 조건이 맞는 덩어리만 갑판이다.
   *   - 옆에 자기보다 높이 솟은 벽이 있다 → 바닥이다 (뱃전 안쪽 벽에 둘러싸인 면)
   *   - 띠처럼 가늘지 않다: 평균 폭(2 × 위에서 본 넓이 ÷ 둘레) ≥ DECK_MIN_WIDTH
   *     → 뱃전 윗단·계단 디딤판·돛대 가로대는 가는 띠라 빠진다 (09-29 기준 폭 0.007~0.023, 갑판 0.085~0.175)
   * 이웃은 좌표로 찾는다 — 면마다 정점이 따로 있어서 인덱스로는 안 이어진다.
   * 속성을 면 단위로 정확히 주려고 인덱스를 푼다(정점 3,846개 — 부담 없음).
   */
  _markDeckFaces(hull, toShip) {
    const DECK_MIN_WIDTH = 0.04;   // 배 로컬 단위 (배 길이 약 0.85)
    if (hull.geometry.index) {
      const old = hull.geometry;
      hull.geometry = old.toNonIndexed();
      old.dispose();
    }
    const pos = hull.geometry.attributes.position;
    const nTri = pos.count / 3;
    const P = [];
    for (let i = 0; i < pos.count; i++) P.push(new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(toShip));
    const key = (p) => `${Math.round(p.x * 1e4)},${Math.round(p.y * 1e4)},${Math.round(p.z * 1e4)}`;
    const edgeKey = (a, b) => { const ka = key(P[a]), kb = key(P[b]); return ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`; };
    const edgesOf = (t) => [[t * 3, t * 3 + 1], [t * 3 + 1, t * 3 + 2], [t * 3 + 2, t * 3]];
    const up = new Uint8Array(nTri), topY = new Float32Array(nTri), byEdge = new Map();
    const e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
    for (let t = 0; t < nTri; t++) {
      e1.subVectors(P[t * 3 + 1], P[t * 3]); e2.subVectors(P[t * 3 + 2], P[t * 3]);
      up[t] = e1.cross(e2).normalize().y > 0.65 ? 1 : 0;
      topY[t] = Math.max(P[t * 3].y, P[t * 3 + 1].y, P[t * 3 + 2].y);
      for (const [a, b] of edgesOf(t)) {
        const k = edgeKey(a, b);
        if (!byEdge.has(k)) byEdge.set(k, []);
        byEdge.get(k).push(t);
      }
    }
    // 위를 보는 면끼리 모서리로 이어진 덩어리
    const comp = new Int32Array(nTri).fill(-1);
    let nComp = 0;
    for (let s = 0; s < nTri; s++) {
      if (!up[s] || comp[s] >= 0) continue;
      const stack = [s];
      comp[s] = nComp;
      while (stack.length) {
        const t = stack.pop();
        for (const [a, b] of edgesOf(t)) for (const o of byEdge.get(edgeKey(a, b))) {
          if (up[o] && comp[o] < 0) { comp[o] = nComp; stack.push(o); }
        }
      }
      nComp++;
    }
    const area = new Float32Array(nComp), perim = new Float32Array(nComp), rises = new Uint8Array(nComp);
    for (let t = 0; t < nTri; t++) {
      if (!up[t]) continue;
      const c = comp[t];
      e1.subVectors(P[t * 3 + 1], P[t * 3]); e2.subVectors(P[t * 3 + 2], P[t * 3]);
      area[c] += Math.abs(e1.x * e2.z - e1.z * e2.x) / 2;
      for (const [a, b] of edgesOf(t)) {
        const others = byEdge.get(edgeKey(a, b)).filter((o) => o !== t);
        if (!others.some((o) => comp[o] === c)) perim[c] += Math.hypot(P[a].x - P[b].x, P[a].z - P[b].z);
        if (others.some((o) => !up[o] && topY[o] > topY[t] + 0.008)) rises[c] = 1;
      }
    }
    const isDeck = new Uint8Array(nComp);
    let deckArea = 0, upArea = 0;
    for (let c = 0; c < nComp; c++) {
      isDeck[c] = rises[c] && (2 * area[c]) / Math.max(perim[c], 1e-9) >= DECK_MIN_WIDTH ? 1 : 0;
      upArea += area[c];
      if (isDeck[c]) deckArea += area[c];
    }
    const deck = new Float32Array(pos.count);
    for (let t = 0; t < nTri; t++) if (up[t] && isDeck[comp[t]]) deck[t * 3] = deck[t * 3 + 1] = deck[t * 3 + 2] = 1;
    hull.geometry.setAttribute("_deck", new THREE.BufferAttribute(deck, 1));
    // 모델을 다시 뽑아 갑판을 못 찾으면 나무가 조용히 사라지거나 뱃전까지 번진다 — 비율로 잡는다 (09-29: 약 0.71)
    const share = deckArea / Math.max(upArea, 1e-9);
    console.assert(share > 0.5 && share < 0.95,
      `[selfCheck] 갑판 판정이 이상하다 — 위를 보는 면 중 갑판 ${(share * 100).toFixed(0)}% (DECK_MIN_WIDTH 확인)`);
  }

  /**
   * 병 밖으로 나가는 부분을 병 안쪽 유리면에 맞춰 눌러 담는다 (정점 셰이더).
   *
   * 병이 나타나면(uClipT: 0→1) 병 반지름을 넘는 정점은 축 쪽으로, 병 바닥을 넘는 정점은 바닥
   * 쪽으로 옮겨 간다. 메쉬가 닫힌 채로 모양만 바뀌어서 구멍이 생기지 않는다 — 잘라 내는 방식은
   * 단면을 채우려고 뒷면을 칠해도, 그 뒷면마저 병 밖이면 같이 잘려 구멍이 뚫렸다.
   * 눌린 면은 원래 법선이 안 맞으므로 그 자리만 화면 미분으로 구한 면 법선을 쓴다.
   * 병에 다 들어가는 것(대부분)은 정점이 안 움직여서 모습이 그대로다.
   * 물 재질의 클리핑 유니폼을 그대로 공유하므로 병 크기·자리가 바뀌어도 따로 손댈 데가 없다.
   */
  _fitToBottle(mat) {
    const MARGIN = 0.06;   // 유리 안쪽으로 이만큼 띄운다
    patchMaterial(mat, "bottle-fit", (shader) => {
      const wu = this.waterMesh.material.uniforms;
      for (const k of ["uClipOn", "uClipCenter", "uClipT", "uClipScaleX", "uClipScaleR", "uProfU", "uProfR"]) {
        shader.uniforms[k] = wu[k];
      }
      const decl = `
          uniform float uClipOn; uniform vec3 uClipCenter; uniform float uClipT;
          uniform float uClipScaleX; uniform float uClipScaleR;
          uniform float uProfU[7]; uniform float uProfR[7];
          varying float vFitMoved;`;
      shader.vertexShader = shader.vertexShader
        .replace("void main() {", `${decl}
          float fitBottleRadius(float ax) {
            for (int i = 0; i < 6; i++) {
              if (ax >= uProfU[i] && ax <= uProfU[i + 1]) {
                float t = (ax - uProfU[i]) / max(1e-5, uProfU[i + 1] - uProfU[i]);
                return mix(uProfR[i], uProfR[i + 1], t);
              }
            }
            return 0.0;
          }
          void main() {`)
        .replace("#include <project_vertex>", `
          vFitMoved = 0.0;
          if (uClipOn > 0.5 && uClipT > 0.001) {
            vec4 wp = modelMatrix * vec4(transformed, 1.0);
            vec3 rel = wp.xyz - uClipCenter;
            // 축 방향: 바닥의 둥근 모서리(uProfU[0]~[1])는 너무 좁아서 쓰지 않는다 — 거기까지 밀면
            // 반지름이 0으로 모여 뾰족해진다. 바닥 넘은 정점은 평평한 바닥면으로 모은다.
            float ax = clamp(-rel.x / uClipScaleX, uProfU[1], uProfU[6]);
            float R = max(fitBottleRadius(ax) * uClipScaleR - ${MARGIN.toFixed(3)}, 0.05);
            float r = length(rel.yz);
            vec3 fit = uClipCenter + vec3(-ax * uClipScaleX, rel.yz * (r > R ? R / r : 1.0));
            float moved = length(fit - wp.xyz);
            vFitMoved = step(1e-4, moved);
            wp.xyz = mix(wp.xyz, fit, uClipT);
            transformed = (inverse(modelMatrix) * wp).xyz;
          }
          #include <project_vertex>`);
      shader.fragmentShader = shader.fragmentShader
        .replace("void main() {", `${decl}
          void main() {`)
        .replace("#include <normal_fragment_begin>", `
          #include <normal_fragment_begin>
          if (uClipOn > 0.5 && uClipT > 0.001 && vFitMoved > 0.001) {
            vec3 fn = normalize(cross(dFdx(vViewPosition), dFdy(vViewPosition)));
            normal = normalize(mix(normal, fn, uClipT * clamp(vFitMoved * 4.0, 0.0, 1.0)));
          }`);
    });
  }

  _buildShadowCatcher() {
    const geo = new THREE.PlaneGeometry(24, 24);
    geo.rotateX(-Math.PI / 2);
    // depthWrite를 끄고 파도 마루보다 위에 둔다. 그림자가 물결 사이로 잠겼다 나왔다 하면
    // "물에 잠긴 그림자"처럼 보여 어색하다. 수면 위에 얹혀 있는 것처럼 보이는 게 목적이다.
    this.shadowMat = new THREE.ShadowMaterial({ opacity: 0.34, depthWrite: false });
    const mesh = new THREE.Mesh(geo, this.shadowMat);
    mesh.position.y = 0.16;    // 파도 진폭(최대 약 0.14)보다 위
    mesh.renderOrder = 2;
    mesh.receiveShadow = true;
    mesh.visible = false;      // 저녁에만 보인다
    this.world.add(mesh);
    this.shadowCatcher = mesh;
    // [버그] 병이 풍경을 감싼 뒤에도 그림자는 유리를 뚫고 밖까지 깔렸다(저녁에만 보인다).
    // 물·연기와 같은 조치 — 병 프로파일 밖은 잘라 낸다. 물 재질이 쓰는 유니폼을
    // 그대로 공유해서 병 크기나 위치를 바꿔도 따로 손댈 데가 없다.
    this.shadowMat.onBeforeCompile = (shader) => {
      const wu = this.waterMesh.material.uniforms;
      shader.uniforms.uClipOn = wu.uClipOn;
      shader.uniforms.uClipCenter = wu.uClipCenter;
      shader.uniforms.uClipT = wu.uClipT;
      shader.uniforms.uClipScaleX = wu.uClipScaleX;
      shader.uniforms.uClipScaleR = wu.uClipScaleR;
      shader.uniforms.uProfU = wu.uProfU;
      shader.uniforms.uProfR = wu.uProfR;
      shader.vertexShader = shader.vertexShader
        .replace("void main() {", "varying vec3 vClipWorld;\nvoid main() {")
        .replace("#include <begin_vertex>",
          "#include <begin_vertex>\n  vClipWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;");
      shader.fragmentShader = shader.fragmentShader
        .replace("void main() {", `
          varying vec3 vClipWorld;
          uniform float uClipOn; uniform vec3 uClipCenter; uniform float uClipT;
          uniform float uClipScaleX; uniform float uClipScaleR;
          uniform float uProfU[7]; uniform float uProfR[7];
          float shadowBottleRadius(float ax) {
            if (ax <= uProfU[0] || ax >= uProfU[6]) return 0.0;
            for (int i = 0; i < 6; i++) {
              if (ax >= uProfU[i] && ax <= uProfU[i + 1]) {
                float t = (ax - uProfU[i]) / max(1e-5, uProfU[i + 1] - uProfU[i]);
                return mix(uProfR[i], uProfR[i + 1], t);
              }
            }
            return 0.0;
          }
          void main() {
            if (uClipOn > 0.5) {
              vec3 rel = vClipWorld - uClipCenter;
              float rad = shadowBottleRadius(-rel.x / uClipScaleX) * uClipScaleR;
              float inside = 1.0 - smoothstep(rad - 0.08, rad + 0.08, length(rel.yz));
              if (mix(1.0, inside, uClipT) < 0.04) discard;
            }
        `);
    };
    this.shadowMat.customProgramCacheKey = () => "shadow-bottle-clip";
  }

  _buildBoat() {
    const boat = new THREE.Group();
    boat.position.set(0, 0.0, 0);
    this.world.add(boat);
    this.boat = boat;
  }

  /**
   * 굴뚝 연기. 뭉게뭉게 겹치는 로우폴리 덩어리로 만든다.
   *
   * 한 알갱이가 구 하나면 아무리 키워도 "공이 떠간다"로만 보인다.
   * 그래서 알갱이 하나를 서로 어긋나게 겹친 정이십면체 세 개로 만들어, 처음부터
   * 울퉁불퉁한 덩어리가 되게 했다. 여기에 알갱이마다 다른 속도로 회전을 주면
   * 올라가면서 모양이 계속 바뀌는 것처럼 보인다(실제로 정점을 건드리지는 않는다 — 훨씬 싸다).
   *
   * 정이십면체는 면이 20개뿐이라 각진 로우폴리 느낌이 그대로 살고, 구보다도 가볍다.
   */
  _buildSmokePool() {
    this.smokePool = [];
    const geo = new THREE.IcosahedronGeometry(1, 0);
    // 덩어리를 이루는 세 조각의 상대 위치와 크기. 살짝씩 어긋나게 겹쳐 둔다.
    // 오프셋이 크면 조각들이 밖으로 삐져나와 우글거려 보인다.
    // 반지름보다 한참 작게 어긋내서 서로 깊이 파고들게 한다.
    const BLOBS = [
      { p: [0, 0, 0], s: 1.0 },
      { p: [0.34, 0.20, 0.12], s: 0.74 },
      { p: [-0.28, 0.16, -0.14], s: 0.66 },
    ];
    for (let i = 0; i < SMOKE_COUNT; i++) {
      // depthWrite를 켠다. 이래야 앞의 덩어리가 뒤의 덩어리를 가려서 겹친 부분에
      // 안쪽 윤곽이 비치지 않는다. 알파를 낮게 깔면서 depthWrite를 끄면 겹칠수록 탁해진다.
      const mat = new THREE.MeshLambertMaterial({
        color: 0xf2f2f0, transparent: true, opacity: 0, depthWrite: true,
      });
      const group = new THREE.Group();
      for (const b of BLOBS) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(b.p[0], b.p[1], b.p[2]);
        m.scale.setScalar(b.s);
        group.add(m);
      }
      group.visible = false;
      group.renderOrder = 5;
      this.world.add(group);
      this.smokePool.push({
        mesh: group, mat, age: 0, active: false,
        spin: 0, drift: 0, wobble: 0,
      });
    }
    this.smokeSpawnTimer = 0;
  }

  _buildBottleShell() {
    const pts = BOTTLE_PROFILE.map(([u, r]) => new THREE.Vector2(r, u));
    const geo = new THREE.LatheGeometry(pts, 40);
    geo.rotateZ(Math.PI / 2);

    this.bottleMat = new THREE.MeshStandardMaterial({
      color: 0xeaf7f2, transparent: true, opacity: 0,
      roughness: 0.15, metalness: 0.05,
      side: THREE.DoubleSide, depthWrite: false,
    });
    const glass = new THREE.Mesh(geo, this.bottleMat);
    glass.renderOrder = 20;

    this.bottleRimMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0, side: THREE.BackSide, depthWrite: false,
    });
    this.bottleRimMat.toneMapped = false;   // 룩 film의 톤 매핑에서 흰 테두리가 회색으로 죽지 않게
    const rim = new THREE.Mesh(geo, this.bottleRimMat);
    rim.scale.setScalar(1.035);
    rim.renderOrder = 19;

    this.bottleCorkMat = new THREE.MeshStandardMaterial({ color: 0xb08a5c, roughness: 0.85, transparent: true, opacity: 0 });
    const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.45, 16), this.bottleCorkMat);
    cork.rotation.z = Math.PI / 2;
    cork.position.x = -1.85;

    const group = new THREE.Group();
    group.add(rim, glass, cork);
    group.scale.set(BOTTLE_SCALE_X, BOTTLE_SCALE_R, BOTTLE_SCALE_R);
    group.position.set(BOTTLE_SHIFT_X, BOTTLE_Y, BOTTLE_SHIFT_Z);
    group.visible = false;
    this.scene.add(group);
    this.bottleGroup = group;
  }

  /**
   * 인트로에서 스치고 지나가는 구름 층.
   *
   * 하늘에서 바다까지 한 번에 내려오면 높이가 얼마나 되는지 읽히지 않는다.
   * 중간에 가로로 화면을 덮는 층을 하나 두고 지나가면 "내려오고 있다"가 분명해진다.
   * 로우폴리 스타일에 맞춰 납작하게 눌린 정이십면체를 흩어 놓았다.
   */
  _buildClouds() {
    const geo = new THREE.IcosahedronGeometry(1, 0);
    const g = new THREE.Group();
    g.visible = false;
    this.cloudMats = [];
    for (let i = 0; i < CLOUD_COUNT; i++) {
      // 재질을 덩어리마다 따로 둔다 — 높이에 따라 짙기를 다르게 주려면 공유하면 안 된다.
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0,
        depthWrite: false, side: THREE.DoubleSide,
      });
      this.cloudMats.push(mat);
      const m = new THREE.Mesh(geo, mat);
      const a = (i / CLOUD_COUNT) * Math.PI * 2 + 0.6;
      const r = 1.6 + (i % 3) * 1.9;
      m.position.set(Math.cos(a) * r, CLOUD_Y + ((i % 3) - 1) * 0.7, Math.sin(a) * r);
      // 가로로 넓고 세로로 납작하게 — 지나갈 때 화면을 가득 덮는다.
      m.scale.set(4.2 + (i % 3) * 1.6, 0.5, 3.2 + (i % 2) * 1.4);
      m.rotation.y = a;
      m.renderOrder = 12;
      // 아래에 깔린 덩어리일수록 옅게 — 층이 아래로 흩어지며 사라지는 것처럼 보인다.
      mat.userData.baseAlpha = 0.35 + 0.65 * ((m.position.y - (CLOUD_Y - 0.7)) / 1.4);
      g.add(m);
    }
    this.cloudGroup = g;
    this.scene.add(g);
  }

  /**
   * 물결을 그릴 원들을 한 번만 추려 둔다.
   *
   * 물체 실루엣을 그대로 따라가려면 거리장이 필요하고 그건 렌더 타깃 한 장 값이다.
   * 대신 "수면에 걸친 메쉬 하나 = 원 하나"로 근사한다. 로우폴리 덩어리들이라 원으로 싸도
   * 크게 어색하지 않고, 셰이더는 거리 몇 번만 재면 된다.
   * 좌표는 각자 부모(섬 그룹 / 배) 기준으로 담아 두고, 매 프레임 월드로 옮긴다.
   */
  /**
   * 물체가 물에 닿는 윤곽선의 거리장을 굽는다.
   *
   * 좌표계: 물체 원점을 옮기고 yaw만 되돌린 평면. 굴림(roll)은 넣지 않는다 — 작고,
   * 넣으면 단면이 기울어져 오히려 어긋난다. 웅얼거림이 그 정도 오차는 덮는다.
   *
   * 단면은 "그 높이보다 아래에 잠긴 부분을 위에서 내려다본 그림자"다. 삼각형을 높이에서
   * 잘라 XZ로 눕혀 채운다. 정점만 보고 채우면 큰 삼각형이 통째로 빠지거나 통째로 들어간다.
   */
  _bakeContactSDF(root, restY) {
    root.updateWorldMatrix(true, true);
    // 월드 → 물체는 역회전이다. 예전에는 cos(-yaw)/sin(-yaw)를 넣어 정회전이 됐고,
    // 굽기와 읽기가 같은 식이라 "굽을 때 각도"에서만 맞았다. 배가 돌면 오차가 2Δθ로
    // 벌어져 선회 중에 물결이 반대로 도는 것처럼 보였다.
    const yaw = root.rotation.y, cs = Math.cos(yaw), sn = Math.sin(yaw);
    const ox = root.position.x, oz = root.position.z, oy = root.position.y;
    const v = new THREE.Vector3();
    const tris = [];               // [ax,ay,az, bx,by,bz, cx,cy,cz] — 물체 좌표, y는 물체 원점 기준
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    const toLocal = (o, i, out) => {
      const g = o.geometry, pos = g.attributes.position;
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(o.matrixWorld);
      const rx = v.x - ox, rz = v.z - oz;
      out[0] = rx * cs - rz * sn; out[1] = v.y - oy; out[2] = rx * sn + rz * cs;
    };
    const a = [0, 0, 0], b = [0, 0, 0], c = [0, 0, 0];
    const meshes = [];             // 메쉬마다 [삼각형 시작, 끝, 최저y, 최고y]
    root.traverse((o) => {
      const g = o.geometry;
      if (!g || !g.attributes.position) return;
      // 숨겨진 소품(키워드로 꺼둔 튜브·갈매기)은 물결을 만들지 않는다.
      // 부모가 꺼져 있어도 안 되므로 위로 올라가며 확인한다.
      for (let q = o; q && q !== root.parent; q = q.parent) if (!q.visible) return;
      const idx = g.index, n = idx ? idx.count : g.attributes.position.count;
      const startTri = tris.length;
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < n; i += 3) {
        const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
        toLocal(o, i0, a); toLocal(o, i1, b); toLocal(o, i2, c);
        tris.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
        for (const q of [a, b, c]) {
          if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0];
          if (q[2] < z0) z0 = q[2]; if (q[2] > z1) z1 = q[2];
          if (q[1] < lo) lo = q[1]; if (q[1] > hi) hi = q[1];
        }
      }
      if (tris.length > startTri) meshes.push([startTri, tris.length, lo, hi]);
    });
    if (!tris.length) return null;

    // 격자 — 윤곽선 바깥으로 파동2가 나갈 만큼 여백을 준다
    const P = RIPPLE_SDF_PAD;
    x0 -= P; x1 += P; z0 -= P; z1 += P;
    const sx = x1 - x0, sz = z1 - z0;
    const long = Math.max(sx, sz);
    const res = Math.max(32, Math.min(RIPPLE_SDF_RES_MAX, Math.ceil(long / RIPPLE_SDF_TEXEL)));
    const stepX = sx / res, stepZ = sz / res;

    const data = new Uint8Array(res * res * 4);
    const cover = new Uint8Array(res * res);
    const dist = new Float32Array(res * res);
    const seg = [];                // 단면 교선 [x1,z1, x2,z2, ...] 두 점이 한 선분

    for (let k = 0; k < 4; k++) {
      const h = restY + RIPPLE_SLICES[k];
      cover.fill(0);
      for (const [t0, t1, lo, hi] of meshes) {
        if (lo >= h) continue;                       // 통째로 물 위 — 닿지 않는다
        if (hi <= h) {                               // 통째로 잠김 — 실루엣 전체
          for (let t = t0; t < t1; t += 9) {
            this._rasterTri(cover, res, x0, z0, stepX, stepZ,
              tris[t], tris[t + 2], tris[t + 3], tris[t + 5], tris[t + 6], tris[t + 8]);
          }
          continue;
        }
        // 수면을 가로지른다 — 그 높이의 단면을 채운다.
        // "아래 전부를 위에서 본 그림자"로 채우면, 물속에서 더 넓어지는 바위가
        // 수면에 드러난 크기보다 큰 자국을 남긴다. 실제로 그렇게 보였다.
        seg.length = 0;
        for (let t = t0; t < t1; t += 9) {
          let n = 0;
          for (let e = 0; e < 3; e++) {
            const p0 = t + e * 3, p1 = t + ((e + 1) % 3) * 3;
            const y0 = tris[p0 + 1], y1 = tris[p1 + 1];
            if ((y0 < h) === (y1 < h)) continue;
            const f = (h - y0) / (y1 - y0);
            seg.push(tris[p0] + (tris[p1] - tris[p0]) * f,
                     tris[p0 + 2] + (tris[p1 + 2] - tris[p0 + 2]) * f);
            n++;
          }
          if (n === 1) seg.length -= 2;              // 꼭짓점만 스친 것은 버린다
        }
        this._fillSection(cover, res, x0, z0, stepX, stepZ, seg);
      }
      this._chamferSDF(cover, dist, res, stepX, stepZ);
      for (let i = 0; i < res * res; i++) {
        const d = Math.max(-RIPPLE_SDF_MAXD, Math.min(RIPPLE_SDF_MAXD, dist[i]));
        data[i * 4 + k] = Math.round((0.5 + d / (2 * RIPPLE_SDF_MAXD)) * 255);
      }
    }

    const tex = new THREE.DataTexture(data, res, res, THREE.RGBAFormat);
    tex.minFilter = tex.magFilter = THREE.LinearFilter;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return { tex, x0, z0, invSX: 1 / sx, invSZ: 1 / sz, res, restY };
  }

  /**
   * 단면 교선(선분 묶음)을 짝수-홀수 규칙으로 채운다.
   *
   * 닫힌 메쉬를 평면으로 자르면 교선은 닫힌 고리가 된다. 고리를 굳이 잇지 않고,
   * 격자 한 줄마다 선분과의 교차점을 모아 정렬한 뒤 짝을 지어 칠하면 같은 결과가 된다.
   */
  _fillSection(cover, res, x0, z0, stepX, stepZ, seg) {
    if (seg.length < 4) return;
    const xs = [];
    for (let j = 0; j < res; j++) {
      const zr = z0 + (j + 0.5) * stepZ;
      xs.length = 0;
      for (let k = 0; k + 3 < seg.length; k += 4) {
        const za = seg[k + 1], zb = seg[k + 3];
        if ((za <= zr) === (zb <= zr)) continue;
        const f = (zr - za) / (zb - za);
        xs.push(seg[k] + (seg[k + 2] - seg[k]) * f);
      }
      if (xs.length < 2) continue;
      xs.sort((p, q) => p - q);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        let i0 = Math.max(0, Math.round((xs[k] - x0) / stepX - 0.5));
        let i1 = Math.min(res - 1, Math.round((xs[k + 1] - x0) / stepX - 0.5));
        for (let i = i0; i <= i1; i++) cover[j * res + i] = 1;
      }
    }
  }

  /** 삼각형 하나를 커버리지 격자에 채운다 (바운딩박스 + 무게중심 판정). */
  _rasterTri(cover, res, x0, z0, stepX, stepZ, ax, az, bx, bz, cx, cz) {
    const gx = (x) => (x - x0) / stepX, gz = (z) => (z - z0) / stepZ;
    const AX = gx(ax), AZ = gz(az), BX = gx(bx), BZ = gz(bz), CX = gx(cx), CZ = gz(cz);
    const area = (BX - AX) * (CZ - AZ) - (BZ - AZ) * (CX - AX);
    if (Math.abs(area) < 1e-9) return;
    const inv = 1 / area;
    const lo = (v) => Math.max(0, Math.floor(v)), hi = (v) => Math.min(res - 1, Math.ceil(v));
    const i0 = lo(Math.min(AX, BX, CX)), i1 = hi(Math.max(AX, BX, CX));
    const j0 = lo(Math.min(AZ, BZ, CZ)), j1 = hi(Math.max(AZ, BZ, CZ));
    for (let j = j0; j <= j1; j++) {
      const pz = j + 0.5;
      for (let i = i0; i <= i1; i++) {
        const px = i + 0.5;
        const w0 = ((BX - px) * (CZ - pz) - (BZ - pz) * (CX - px)) * inv;
        const w1 = ((CX - px) * (AZ - pz) - (CZ - pz) * (AX - px)) * inv;
        const w2 = 1 - w0 - w1;
        if (w0 >= 0 && w1 >= 0 && w2 >= 0) cover[j * res + i] = 1;
      }
    }
  }

  /**
   * 커버리지에서 부호 있는 거리장을 만든다 (3x3 챔퍼, 두 번 훑기).
   * 정확한 유클리드 거리는 아니지만 오차가 4% 안쪽이라 — 파동 굵기 0.17에 비해 —
   * 눈에 보이지 않는다. 대신 O(n)이라 로드가 늦어지지 않는다.
   */
  _chamferSDF(cover, dist, res, stepX, stepZ) {
    const t = (stepX + stepZ) * 0.5;
    const A = 0.9619 * t, B = 1.3604 * t, BIG = 1e9;
    // 버퍼는 격자 크기가 바뀌면 다시 잡는다. 예전에는 한 번 만든 것을 재사용해서
    // 배(156²) 다음에 굽는 섬(158²)이 모자란 배열을 읽었고, undefined가 NaN으로 번져
    // 거리장 전체가 "물체 안쪽"이 됐다 — 수면에 커다란 흰 사각형이 깔렸다.
    const need = res * res;
    if (!this._chamferBuf || this._chamferBuf.length < need) this._chamferBuf = new Float32Array(need);
    const run = (inside) => {
      const d = this._chamferBuf;
      for (let i = 0; i < res * res; i++) d[i] = (cover[i] === (inside ? 0 : 1)) ? 0 : BIG;
      for (let j = 0; j < res; j++) for (let i = 0; i < res; i++) {
        const k = j * res + i; let m = d[k];
        if (i > 0) m = Math.min(m, d[k - 1] + A);
        if (j > 0) m = Math.min(m, d[k - res] + A);
        if (i > 0 && j > 0) m = Math.min(m, d[k - res - 1] + B);
        if (i < res - 1 && j > 0) m = Math.min(m, d[k - res + 1] + B);
        d[k] = m;
      }
      for (let j = res - 1; j >= 0; j--) for (let i = res - 1; i >= 0; i--) {
        const k = j * res + i; let m = d[k];
        if (i < res - 1) m = Math.min(m, d[k + 1] + A);
        if (j < res - 1) m = Math.min(m, d[k + res] + A);
        if (i < res - 1 && j < res - 1) m = Math.min(m, d[k + res + 1] + B);
        if (i > 0 && j < res - 1) m = Math.min(m, d[k + res - 1] + B);
        d[k] = m;
      }
      return d;
    };
    const out = run(false);                 // 물체 바깥에서 윤곽선까지
    for (let i = 0; i < res * res; i++) dist[i] = out[i];
    const inn = run(true);                  // 물체 안쪽 (부호를 뒤집는다)
    for (let i = 0; i < res * res; i++) if (cover[i]) dist[i] = -inn[i];
  }

  _buildRippleSources() {
    const wu = this.waterMesh.material.uniforms;
    // 배는 굽는 순간의 높이를 기준으로 삼는다. 둥실거리면 그만큼 단면이 옮겨간다.
    // [버그 09-30] 배는 **내려앉은 뒤에만** 굽는다. 첫 화면에서 배는 숨어 있다가 "뽁" 하고 크기 0에서
    // 부풀며 하늘 높이 나타나는데(_updateBoatDrop), 예전엔 보이는 첫 프레임에 한 번 구워 버려서
    // 크기 0·하늘 높이의 배를 구웠다 — 거리장이 텅 비어 배 둘레 일렁임만 사라지고 섬은 멀쩡했다.
    // 굽기는 한 번뿐이라 그 뒤로도 되살아나지 않았다.
    const boatReady = this.boat.visible && this._dropT >= 1 && Math.abs(this.boat.scale.x - 1) < 1e-6;
    if (!this._sdfBoat && boatReady) {
      this._sdfBoat = this._bakeContactSDF(this.boat, -this.boat.position.y);
      if (this._sdfBoat) wu.uSdfBoat.value = this._sdfBoat.tex;
    }
    if (!this._sdfIsland) {
      this._sdfIsland = this._bakeContactSDF(this.islandGroup, -this.islandGroup.position.y);
      if (this._sdfIsland) wu.uSdfIsland.value = this._sdfIsland.tex;
    }
  }

  /** 거리장의 위치·방향·흘수를 이번 프레임 값으로 갱신한다. */
  _updateRipples(dt) {
    const wu = this.waterMesh.material.uniforms;
    if (wu.uRippleOn.value < 0.5) return;
    if ((!this._sdfBoat || !this._sdfIsland) && this.boat.children.length) this._buildRippleSources();

    // 수면이 물체 기준으로 어느 높이에 있는지 → 네 단면 중 어디를 읽을지.
    // 물체가 떠오르면 값이 내려가 더 얕은 단면(= 좁은 접촉면)을 읽는다.
    const sliceOf = (bake, objY) => {
      const rel = -objY - bake.restY;
      const S = RIPPLE_SLICES;
      if (rel <= S[0]) return 0;
      if (rel >= S[3]) return 3;
      for (let i = 0; i < 3; i++) {
        if (rel <= S[i + 1]) return i + (rel - S[i]) / (S[i + 1] - S[i]);
      }
      return 3;
    };
    const step = RIPPLE_SLICES[1] - RIPPLE_SLICES[0];
    const apply = (bake, obj, yaw, strength, xf, grid, meta) => {
      // 인트로에서 배는 하늘에 있고 boat.visible이 false다. 그때도 그리면 배가
      // 떨어지기 전부터 수면에 접촉면이 나타난다.
      if (!bake || !obj.visible) { meta.z = 0; return false; }
      // 수면이 구워 둔 단면 범위를 벗어나면(물체가 물에서 떠올랐거나 잠겼으면) 사라진다
      const rel = -obj.position.y - bake.restY;
      const span = RIPPLE_SLICES[3] - RIPPLE_SLICES[0];
      const over = Math.max(RIPPLE_SLICES[0] - rel, rel - RIPPLE_SLICES[3]);
      strength *= Math.max(0, 1 - over / (span * 0.5));
      // 세기가 0이어도 자리는 계속 맞춘다 — 배 안쪽 물 지우기(uHullCut)는 단면 범위 밖(착수 출렁임)에서도 필요하다
      if (strength <= 0.001) strength = 0;
      const c = Math.cos(yaw), sn = Math.sin(yaw);   // 굽기와 같은 역회전
      xf.set(obj.position.x, obj.position.z, c, sn);
      grid.set(bake.x0, bake.z0, bake.invSX, bake.invSZ);
      // rotation.z는 배의 긴 축(로컬 X)을 중심으로 한 앞뒤 기울기다. 로컬 x에 있는 점은
      // x*sin(기울기)만큼 올라가므로, 그만큼 더 얕은 단면을 읽어야 한다.
      meta.set(sliceOf(bake, obj.position.y), RIPPLE_SDF_MAXD, strength,
               Math.sin(obj.rotation.z) / step);
      return true;
    };
    // 섬 — 멀어져 흐려지는 동안 물결도 같이 옅어진다
    const islandFade = THREE.MathUtils.smoothstep(this.shoreBlend, 0.0, SHORE_FADE_UNTIL);
    const placed = apply(this._sdfBoat, this.boat, this.boat.rotation.y, 1.0,
          wu.uSdfBoatXf.value, wu.uSdfBoatGrid.value, wu.uSdfBoatMeta.value);
    // 배 안쪽 물 지우기는 선체가 물에 잠겨 있을 때만. [버그 10-06] 떨어지는 중이거나 출렁임에서 위로 떠오른 동안에도
    // 켜 두었더니, 공중의 배 바로 아래 수면에 배 모양 구멍이 뚫려 그림자 같은 자국이 보였다. 쉬는 높이보다 0.05 넘게
    // 떠 있으면 끈다 — 그만큼 떠 있으면 물이 갑판을 넘을 일도 없다.
    wu.uHullCut.value = placed && (this._dropOffset ?? 0) < 0.05 && this.boat.scale.x > 0.99 ? 1 : 0;
    apply(this._sdfIsland, this.islandGroup, this.islandGroup.rotation.y, islandFade,
          wu.uSdfIslandXf.value, wu.uSdfIslandGrid.value, wu.uSdfIslandMeta.value);

  }

  /** 카메라 높이가 구름 층에 가까울 때만 짙어진다 — 지나가면 곧 사라진다. */
  _updateClouds() {
    if (!this.cloudGroup) return;
    const active = this._introPending || this._liftT < 1 || this._lift > 0.01;
    if (!active) { this.cloudGroup.visible = false; return; }
    this.cloudGroup.visible = true;
    this.cloudGroup.position.x = this.boat.position.x;
    const k = Math.max(0, 1 - Math.abs(this._lift - CLOUD_Y) / CLOUD_FADE_SPAN);
    const a = 0.9 * k * k;
    for (const mat of this.cloudMats) mat.opacity = a * (mat.userData.baseAlpha ?? 1);
  }

  /** 인트로 끝에서 배가 나타나 떨어진다. 반환값은 파도 흔들림에 더할 높이. */
  _startBoatDrop() {
    this._dropT = 0;
    this.boat.visible = true;
    // [버그 10-06] 이 함수는 _animate 안에서 배 높이를 이미 계산한 **뒤에** 불린다. 그래서 첫 프레임만
    // 배가 바다 높이(dropOffset 0)에 그려졌다 — 하늘에서 내려오기 직전 바다에 배가 반짝 보였다가 사라진 원인
    // (헤드리스 실측: 첫 프레임 y 0.01·크기 0.35 → 다음 프레임 y 1.71). 높이·크기를 지금 바로 맞춘다.
    this._dropOffset = BOAT_DROP_HEIGHT;
    this.boat.position.y += BOAT_DROP_HEIGHT;
    this.boat.scale.setScalar(0.001);
  }

  _updateBoatDrop(dt) {
    if (this._dropT >= 1) { this._dropOffset = 0; return; }
    const prev = this._dropT * BOAT_DROP_SEC;
    this._dropT = Math.min(1, this._dropT + dt / BOAT_DROP_SEC);
    const sec = this._dropT * BOAT_DROP_SEC;
    if (prev < BOAT_SETTLED_AT && sec >= BOAT_SETTLED_AT) this._fireIntroSettled();
    if (this._dropT >= 1) { this._dropOffset = 0; this._fireIntroSettled(); return; }   // 이미 불렀으면 빈 호출
    if (sec < BOAT_POP_SEC) {
      // 뽁 — 제자리에서 부풀어 나타난다
      this.boat.scale.setScalar(Math.min(1, (sec / BOAT_POP_SEC) * 1.15));
      this._dropOffset = BOAT_DROP_HEIGHT;
      return;
    }
    this.boat.scale.setScalar(1);
    if (sec < BOAT_POP_SEC + BOAT_FALL_SEC) {
      // 낙하 — 가속만 있고 감속이 없다(ease-in). 처음엔 느리게 떨어지다 빨라진다.
      const p = (sec - BOAT_POP_SEC) / BOAT_FALL_SEC;
      this._dropOffset = BOAT_DROP_HEIGHT * (1 - p * p * p);
      return;
    }
    // 착수 — 미리 흘려 둔 출렁임 표(SPLASH_CURVE)를 읽는다. 마지막 15%는 남은 폭(이미 0.005 아래)을
    // 0으로 부드럽게 접어, 끝나는 순간 파도 흔들림으로 끊김 없이 넘어간다.
    const t = sec - BOAT_POP_SEC - BOAT_FALL_SEC;
    const f = Math.min(SPLASH_CURVE.length - 1.001, t * 240);
    const i = Math.floor(f);
    const y = SPLASH_CURVE[i] + (SPLASH_CURVE[i + 1] - SPLASH_CURVE[i]) * (f - i);
    this._dropOffset = y * (1 - THREE.MathUtils.smoothstep(t / BOAT_SETTLE_SEC, 0.85, 1));
  }

  /**
   * 병 안 수면 아래를 채우는 물 덩어리.
   * 파도 메쉬는 "표면" 한 장뿐이라, 병을 아래에서 올려다보면 수심이 통째로 비어 보였다.
   * 병 안쪽 프로파일을 살짝 줄여 같은 모양으로 만들고, 월드 기준 수평면으로 잘라
   * 수면 아래만 남긴다. 색은 시간대별 바다색을 따라간다(_applyTime).
   */
  _buildBottleWater() {
    const pts = BOTTLE_PROFILE.map(([u, r]) => new THREE.Vector2(r * BOTTLE_WATER_R, u));
    const geo = new THREE.LatheGeometry(pts, 40);
    geo.rotateZ(Math.PI / 2);
    // 물 덩어리 윗면 = 그 자리의 파도 높이. 바다와 같은 거스트너 식(GERSTNER_GLSL)과 같은 유니폼으로 파고를 재서
    // 그보다 위는 버린다(discard). 예전엔 수평면(y = −0.05)으로 잘라서, 옆에서 보면 파도 마루와 덩어리 윗면 사이가
    // 비어 보였다(10-07 사용자: 수면과 물 사이 유격). 앞면만 그리므로 위에서는 바다 표면이 덮고, 옆에서는 병 벽을 따라
    // 덩어리가 물결선까지 차오른다.
    this.bottleWaterMat = new THREE.MeshBasicMaterial({
      color: 0x2fb3e6, transparent: true, opacity: 0,
      side: THREE.FrontSide, depthWrite: true,
    });
    patchMaterial(this.bottleWaterMat, "wave-top", (sh) => {
      const wu = this.waterMesh.material.uniforms;   // 컴파일은 첫 렌더 때 — 바다는 이미 있다
      for (const k of ["uTime", "uChop", "uAmpScale", "uFlowPhase", "uWaveShift"]) sh.uniforms[k] = wu[k];
      sh.vertexShader = sh.vertexShader
        .replace("void main() {", `varying vec3 vBwWorld;
        void main() {`)
        .replace("#include <project_vertex>", `#include <project_vertex>
        vBwWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
      sh.fragmentShader = sh.fragmentShader
        .replace("void main() {", `uniform float uTime, uChop, uAmpScale, uFlowPhase, uWaveShift;
        varying vec3 vBwWorld;
${GERSTNER_GLSL}
        void main() {
          // 바다 꼭짓점은 파도 위상 좌표(월드 x + uWaveShift, z)에서 옆으로도 밀린다(chop) — 그 밀림을 두 번 되짚어
          // 이 자리(xz)에 와 있는 수면 점의 높이를 찾는다. 로우폴리 면의 보간 오차만큼 조금(0.015) 더 채운다
          vec2 bwT = vec2(vBwWorld.x + uWaveShift, vBwWorld.z);
          vec3 bwW = gerstnerSum(bwT, uTime);
          bwW = gerstnerSum(bwT - bwW.xz, uTime);
          bwW = gerstnerSum(bwT - bwW.xz, uTime);
          if (vBwWorld.y > bwW.y + 0.015) discard;`);
    });
    const mesh = new THREE.Mesh(geo, this.bottleWaterMat);
    mesh.renderOrder = 18;      // 유리(20)·테두리(19)보다 먼저
    this.bottleWater = mesh;
    this.bottleGroup.add(mesh);
  }

  /**
   * 시작하기를 누른 직후. 기본 시점 그대로 수직으로 올라가 하늘만 남는다.
   * (예전엔 배가 뽁 튀어올라 물에 떨어지는 연출이었다.)
   */
  playIntro(onSettled) {
    if (this.introDone) { onSettled && onSettled(); return; }
    this.introDone = true;
    // 올라가는 과정은 보여주지 않는다 — 처음부터 하늘에 있다.
    this._introPending = true;
    this._lift = INTRO_LIFT;
    this._liftT = 1;
    this.boat.visible = false;      // 내려앉기 직전에 뽁 하고 나타난다
    onSettled && onSettled();
  }

  /** 온보딩에서 다음으로 넘어갈 때. 올라간 높이를 그대로 내려온다 — 감속만 있고 가속은 없다. */
  /**
   * 온보딩에서 다음으로 넘어갈 때. 올라간 높이를 그대로 내려온다.
   * 배가 떨어져 자리를 잡는 건 카메라가 멈춘 뒤에도 이어지므로, 끝났다는 신호는
   * 카메라가 아니라 "배가 가라앉았다 올라와 멎은 시점"에 보낸다.
   */
  introDescend(onDone) {
    this._introPending = false;
    this._onIntroSettled = onDone || null;
    this._liftTo(0, INTRO_FALL_SEC, INTRO_FALL_EASE, null);
  }

  /**
   * 첫 화면(onboard·prompt)으로 되돌아올 때 — 내려왔던 길을 되짚어 하늘로 오른다.
   * 인트로는 한 번만 재생되므로(playIntro) 예전엔 첫 질문에서 '이전'을 누르면 바다에 머문 채
   * 첫 화면 글자가 떠 있었다. 다 오르면 배를 숨긴다 — 다시 내려갈 때 뽁 하고 나타나도록.
   */
  introRise(onDone) {
    // 출렁임(약 5초)이 끝나기 전에 '이전'으로 올라왔으면 여기서 끝낸다 — _dropT가 1이 아니면
    // 다시 내려갈 때 _startBoatDrop이 걸리지 않아 배가 안 나타난다.
    const up = () => { this.boat.visible = false; this._dropT = 1; this._dropOffset = 0; this._introPending = true; onDone && onDone(); };
    this._onIntroSettled = null;
    if (this._lift >= INTRO_LIFT - 0.01 && this._liftT >= 1) { up(); return; }
    this._liftTo(INTRO_LIFT, INTRO_RISE_SEC, easeInOutCubic, up);
  }

  _fireIntroSettled() {
    const cb = this._onIntroSettled;
    this._onIntroSettled = null;
    cb && cb();
  }

  _liftTo(to, dur, ease, onDone) {
    this._liftFrom = this._lift;
    this._liftTarget = to;
    this._liftT = 0;
    this._liftDur = dur;
    this._liftEase = ease;
    this._onLiftDone = onDone || null;
  }

  revealBottle(onDone) {
    this.bottleGroup.visible = true;
    this.bottleTarget = 1;
    if (this.bottleRevealed) { onDone && onDone(); return; }
    this.bottleRevealed = true;
    setTimeout(() => onDone && onDone(), 1500);
  }

  applyRegion(region) {
    const hex = REGION_SAND[region] || 0xd9b98c;
    this._applyRockColor(hex);
  }

  /**
   * 키워드 소품 칠(10-07 사용자) — 아틀라스 텍스처라 텍셀 색을 골라 바꿔 칠한다(_recolorShader).
   *   튜브(가족) 빨강 · 서핑보드(소속감) 하늘색 → 고른 색.  종(불안) 받침 나무 → 늘 캐빈 벽 색(캐빈 슬롯을 같이 쥔다).
   *   고양이(주거) → 털 무늬(_catCoatShader).  클로버(우연)는 그려 만드는 데칼이라 잎 색으로 다시 그린다(_setCloverColor).
   * 재질을 소품마다 복제한다 — 아틀라스 재질을 다른 소품과 같이 쓰고 있어서. 표면 효과(_installSurfaceFx)보다 먼저 불려야
   * 복제본에도 표면 효과가 붙는다(재질 복제는 셰이더 패치를 옮겨 주지 않는다).
   */
  _installPropPaint(ship) {
    this._propU = {};
    const own = (name) => {
      const o = ship.getObjectByName(name);
      const list = [];
      if (o) o.traverse((m) => {
        if (!m.isMesh) return;
        if (name !== GLB_NODES.tube) m.material = m.material.clone();   // 튜브는 위에서 이미 복제했다(TUBE_TINT)
        list.push(m.material);
      });
      return list;
    };
    const lin = (hex) => new THREE.Color(hex);   // sRGB hex → 선형(셰이더 값)
    for (const [prop, name] of [["tube", GLB_NODES.tube], ["board", "Surfboard"]]) {
      const u = { to: { value: new THREE.Color(1, 1, 1) }, on: { value: 0 } };
      this._propU[prop] = u;
      for (const mat of own(name)) patchMaterial(mat, "recolor", (sh) => this._recolorShader(sh, lin(PROP_KEYS[prop].key), u.to, u.on, 0.16));
    }
    // 종 받침 나무 = 캐빈 벽 색. 캐빈 슬롯을 그대로 쥐어서 배 색이 바뀌면 같이 바뀐다
    const bellOn = { value: 1 };
    for (const mat of own("Bell")) patchMaterial(mat, "recolor", (sh) => this._recolorShader(sh, lin(0x3e2d1a), this._tintSlot("cabin", BOAT_PAINT.cabin), bellOn, 0.08));
    // 고양이 털 무늬
    const cu = {
      on: { value: 0 }, fur: { value: new THREE.Color() }, stripe: { value: new THREE.Color() }, white: { value: new THREE.Color() },
      line: { value: new THREE.Color(0xf4efe6) }, whiteMode: { value: 0 }, whiteH: { value: 0.4 }, stripeOn: { value: 0 },
      y: { value: new THREE.Vector2(0, 1) }, c: { value: new THREE.Vector2() },
    };
    this._propU.cat = cu;
    const cat = ship.getObjectByName(GLB_NODES.cat);
    if (cat) cat.traverse((m) => {   // 메시 좌표(y = 위)의 높이 범위와 웅크린 중심 — 흰 털 높이·줄무늬 기준
      if (!m.isMesh) return;
      m.geometry.computeBoundingBox();
      const b = m.geometry.boundingBox;
      cu.y.value.set(b.min.y, b.max.y);
      cu.c.value.set((b.min.x + b.max.x) / 2, (b.min.z + b.max.z) / 2);
    });
    for (const mat of own(GLB_NODES.cat)) patchMaterial(mat, "cat-coat", (sh) => this._catCoatShader(sh, cu));
    // 모델보다 먼저 들어온 칠(이어 쓰기 등)
    if (this._propsPending) { const p = this._propsPending; this._propsPending = null; this.setProps(p.props, p.catCoat); }
  }

  /** 텍셀이 열쇠 색(key, 선형)에 가까우면 to 로 바꿔 칠한다 — 밝기는 텍셀/열쇠 비로 남겨 그린 결이 산다 */
  _recolorShader(shader, key, to, on, tol) {
    Object.assign(shader.uniforms, { uRcKey: { value: key }, uRcTo: to, uRcOn: on });
    shader.fragmentShader = shader.fragmentShader
      .replace("void main() {", `uniform vec3 uRcKey, uRcTo; uniform float uRcOn;
        void main() {`)
      .replace("#include <map_fragment>", `#include <map_fragment>
        #ifdef USE_MAP
        if (uRcOn > 0.5) {
          vec3 rcTex = sampledDiffuseColor.rgb;
          float rcW = 1.0 - smoothstep(${(tol * 0.5).toFixed(3)}, ${tol.toFixed(3)}, distance(rcTex, uRcKey));
          float rcK = max(dot(uRcKey, vec3(0.2126, 0.7152, 0.0722)), 1e-3);
          vec3 rcRep = uRcTo * clamp(dot(rcTex, vec3(0.2126, 0.7152, 0.0722)) / rcK, 0.0, 1.4);
          diffuseColor.rgb = mix(diffuseColor.rgb, diffuse * rcRep, rcW);
        }
        #endif`);
  }

  /**
   * 고양이 털 무늬(10-07 사용자). 삼색(calico)은 텍스처 그대로, 나머지는 **단색으로 덮는다** — 텍스처의 밝기 결을 남기면 단색 털에
   * 얼룩이 비쳤다. 텍스처에서 가져오는 건 셋뿐:
   *   선 — 눈·입·발가락을 그린 아주 짙은 갈색(#402010 부근). 짙은 빨강 그늘(초록이 거의 0)과는 초록/빨강 비로 가른다.
   *        밑 털이 어두우면(턱시도·올블랙) 밝은 선으로 바꾼다 — 검은 털에 짙은 선은 안 보인다.
   *   분홍 — 귀 안. 그대로.
   *   흰 털 자리 — 턱시도·치즈태비의 가슴·입·앞발: 얼굴 쪽 반(메시 +x)의 아래쪽(웅크린 고양이의 아래 whiteH)에서 주황·갈색 얼룩이
   *        아닌 곳. 텍스처엔 가슴·발 구분이 없어 높이로 가른다(흰 털을 다 남기면 젖소 무늬가 된다).
   * 치즈태비 줄무늬는 텍스처에 없어서 3D로 그린다: 고양이가 둥글게 말려 있어 척추가 말린 중심을 한 바퀴 돈다 —
   * 중심에서 바깥으로 뻗는 방사형 줄이면 등에서는 가로 줄, 바깥 고리를 도는 꼬리에서는 고리 무늬가 된다.
   * 줄마다 굵기·기울기를 조금씩 흔들어 손으로 그린 듯하게, 아래쪽(옆구리 끝)으로 갈수록 옅게.
   */
  _catCoatShader(shader, u) {
    Object.assign(shader.uniforms, {
      uCoatOn: u.on, uCoatFur: u.fur, uCoatStripe: u.stripe, uCoatWhite: u.white, uCoatLine: u.line,
      uCoatWhiteMode: u.whiteMode, uCoatWhiteH: u.whiteH, uCoatStripeOn: u.stripeOn, uCoatY: u.y, uCoatC: u.c,
    });
    shader.vertexShader = shader.vertexShader
      .replace("void main() {", `varying vec3 vCoatP;
        void main() {`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>
        vCoatP = position;`);
    shader.fragmentShader = shader.fragmentShader
      .replace("void main() {", `uniform float uCoatOn, uCoatWhiteMode, uCoatWhiteH, uCoatStripeOn;
        uniform vec3 uCoatFur, uCoatStripe, uCoatWhite, uCoatLine; uniform vec2 uCoatY, uCoatC;
        varying vec3 vCoatP;
        void main() {`)
      .replace("#include <map_fragment>", `#include <map_fragment>
        #ifdef USE_MAP
        if (uCoatOn > 0.5) {
          vec3 tex = sampledDiffuseColor.rgb;
          vec3 s = sqrt(tex);                                   // 대략 sRGB 로 — 분류는 눈에 보이는 값으로
          float mx = max(s.r, max(s.g, s.b)), mn = min(s.r, min(s.g, s.b));
          float sat = (mx - mn) / max(mx, 1e-3);
          float L = dot(s, vec3(0.2126, 0.7152, 0.0722));
          float line = (1.0 - smoothstep(0.2, 0.27, L)) * smoothstep(0.24, 0.32, s.g / max(s.r, 1e-3));
          // 귀 안 분홍(#f888a8)은 파랑이 초록보다 크다 — 살구빛 털(#f8c898)·주황은 반대라 이것으로 갈린다
          float pink = smoothstep(0.02, 0.07, s.b - s.g) * smoothstep(0.15, 0.25, s.r - s.g);
          // 주황·갈색 얼룩(채도 높고 너무 어둡지 않음). 그 밖(흰 털·살구빛·선·선 가장자리)은 흰 털 자리에서 흰색이 된다 —
          // 흰 털만 고르면 입 선 가장자리 텍셀이 빠져 흰 입에 검은 테가 생겼다
          float patchTex = smoothstep(0.38, 0.5, sat) * smoothstep(0.22, 0.3, L);
          float h = (vCoatP.y - uCoatY.x) / max(uCoatY.y - uCoatY.x, 1e-4);
          // 털 바탕 — 줄무늬(치즈태비)
          vec3 fur = uCoatFur;
          if (uCoatStripeOn > 0.5) {
            vec2 q = vCoatP.xz - uCoatC;
            float th = atan(q.y, q.x), r = length(q);
            // 줄 13개를 한 바퀴에. 기울기·굵기를 흔들고, 바깥(옆구리)으로 가며 살짝 휘게
            float band = sin(13.0 * th + 1.1 * sin(2.0 * th + 0.7) + 30.0 * r + 14.0 * (h - 0.6));
            float thick = 0.32 + 0.2 * sin(5.0 * th + 1.3) + 0.15 * sin(60.0 * r + 3.0 * th);   // 줄이 군데군데 가늘어지거나 끊긴다
            float st = smoothstep(thick - 0.08, thick + 0.08, band)
                     * smoothstep(0.3, 0.55, h)                       // 아래쪽(옆구리 끝)으로 옅게
                     * smoothstep(0.03, 0.065, r);                    // 말린 중심 근처는 줄이 모여 바람개비가 된다 — 비운다
            fur = mix(uCoatFur, uCoatStripe, st);
          }
          // 흰 털 자리: 0 없음 · 1 전부(올화이트) · 2 아래쪽의 원래 흰 털만(턱시도·치즈태비)
          // 아래쪽 흰 털은 얼굴 쪽 반(가슴·앞발 — 메시 +x)에만. 등 뒤 아래 가장자리에 흰 점이 튀지 않게
          float front = smoothstep(-0.02, 0.01, vCoatP.x - uCoatC.x);
          float wm = uCoatWhiteMode > 1.5 ? (1.0 - patchTex) * front * (1.0 - smoothstep(uCoatWhiteH - 0.04, uCoatWhiteH + 0.04, h))
                   : step(0.5, uCoatWhiteMode);
          vec3 base = mix(fur, uCoatWhite, wm);
          // 선: 밑이 어두우면 밝은 선, 밝으면 원래 짙은 선
          vec3 lineCol = dot(base, vec3(0.2126, 0.7152, 0.0722)) < 0.12 ? uCoatLine : tex;
          vec3 col = mix(base, lineCol, line);
          diffuseColor.rgb = diffuse * mix(col, tex, pink);
        }
        #endif`);
  }

  /**
   * 소품 칠. props = { tube, board, clover } — 배 색과 같은 값(팔레트 id · "#rrggbb" · base), catCoat = CAT_COATS id.
   * 키워드를 안 골라 소품이 숨어 있어도 칠은 해 둔다(가볍다).
   */
  setProps(props = {}, catCoat = "calico") {
    if (!this._propU) { this._propsPending = { props, catCoat }; return; }
    const key = JSON.stringify([props, catCoat]);
    if (this._propsKey === key) return;
    this._propsKey = key;
    const pal = (globalThis.SURVEY_TAXONOMY || {}).BOAT_COLORS;
    for (const prop of ["tube", "board"]) {
      const u = this._propU[prop], hex = propPaint(props[prop], pal);
      u.on.value = hex === null ? 0 : 1;
      if (hex !== null) {
        u.to.value.setHex(hex);
        // 튜브는 재질 색에 톤 누름(TUBE_TINT)이 곱해진다 — 그만큼 미리 나눠 고른 색이 되게
        if (prop === "tube") { const t = new THREE.Color().setRGB(...TUBE_TINT); u.to.value.r /= t.r; u.to.value.g /= t.g; u.to.value.b /= t.b; }
      }
    }
    this._setCloverColor(propPaint(props.clover, pal));
    // 털 무늬 — 바탕 털 · 줄 · 흰 털(sRGB), 흰 털 자리(0 없음 · 1 전부 · 2 아래쪽), 줄무늬. 삼색은 텍스처 그대로(없음)
    const coats = {
      white:  { fur: 0xf7efe4, white: 0xf7efe4, whiteMode: 1 },   // 살짝 따뜻하게 — 하늘빛을 받으면 푸르게 뜬다
      cheese: { fur: 0xe8913c, stripe: 0xb85c20, white: 0xf8e4c4, whiteMode: 2, whiteH: 0.34, stripeOn: 1 },
      tuxedo: { fur: 0x242120, white: 0xf5f0e8, whiteMode: 2, whiteH: 0.32 },   // 눈은 검은 머리(흰 선), 입·가슴·앞발만 희게
      black:  { fur: 0x242120, whiteMode: 0 },
    };
    const cu = this._propU.cat, c = coats[catCoat];
    cu.on.value = c ? 1 : 0;
    if (c) {
      cu.fur.value.setHex(c.fur); cu.stripe.value.setHex(c.stripe ?? c.fur); cu.white.value.setHex(c.white ?? c.fur);
      cu.whiteMode.value = c.whiteMode; cu.whiteH.value = c.whiteH ?? 0.4; cu.stripeOn.value = c.stripeOn ? 1 : 0;
    }
  }

  /** 클로버 데칼 잎 색 — null 이면 원래 초록. 잎맥은 잎보다 짙게 */
  _setCloverColor(hex) {
    const tex = this._cloverTex;
    if (!tex) { this._cloverPending = hex; return; }
    const k = hex === null ? "base" : hex;
    if (this._cloverKey === k) return;
    this._cloverKey = k;
    const leaf = hex === null ? CLOVER.leaf : "#" + hex.toString(16).padStart(6, "0");
    const vein = hex === null ? CLOVER.vein : "#" + new THREE.Color(hex).multiplyScalar(0.62).getHexString();
    tex.image = this._drawClover(leaf, vein);
    tex.needsUpdate = true;
  }

  /** 배 색이 바꾸는 나머지 부분의 색 슬롯(마스트·계단·캐빈 벽·굴뚝 받침·창 유리·창 테·문손잡이·캐빈 지붕 — 종 받침도 캐빈 슬롯). 셰이더와 setPaint 가 같은 객체를 쥔다 */
  _tintSlot(key, hex) {
    this._tintU = this._tintU || {};
    this._tintBase = this._tintBase || {};
    if (!this._tintU[key]) {
      this._tintBase[key] = new THREE.Color(hex);
      this._tintU[key] = { value: this._tintBase[key].clone() };
    }
    return this._tintU[key];
  }

  /**
   * 배 색 (Ⅵ 색 단계). hull = 팔레트 id 또는 "#rrggbb", deck = 같은 것 또는 "auto"(원톤).
   * opts.instant = 바로 맞춘다(모델이 늦게 뜬 경우·이어 쓰기), opts.pure = false 면 예전 '누름' 방식(기본은 원색 — 10-07).
   * 색 계산은 statistics/shared/boat-look.js paintParts — 선체·갑판에 더해 캐빈 벽·굴뚝 받침·마스트·계단·캐빈 지붕까지.
   * 0.35초쯤에 걸쳐 옮겨 간다(_updatePaint).
   */
  setPaint(hullId = "base", deckId = "auto", opts = {}) {
    if (typeof opts === "boolean") opts = { instant: opts };
    const { instant = false } = opts;
    const pure = opts.pure !== false;   // 원색 그대로가 기본(10-07 사용자)
    if (!this._hullMat) { this._paintPending = { hull: hullId, deck: deckId, pure }; return; }
    const key = `${hullId}/${deckId}/${pure ? 1 : 0}`;
    if (this._paintKey === key && !instant) return;
    this._paintKey = key;
    const m = paintParts(hullId, deckId, (globalThis.SURVEY_TAXONOMY || {}).BOAT_COLORS, { pure });
    const P = BOAT_PAINT;
    const slots = [
      [this._hullMat.color, m.hull, this._hullBase],
      [this._deckColU.value, m.deck, this._deckBase],
    ];
    for (const [k, def] of [["cabin", P.cabin], ["funnelStep", P.funnelStep], ["glass", P.glass], ["trim", P.trim],
                            ["handle", P.handle], ["mast", P.mast], ["stairRail", P.stairRail], ["stairTread", P.stairTread],
                            ["cabinRoof", P.cabinRoof]]) {
      const slot = this._tintSlot(k, def);
      slots.push([slot.value, m[k], this._tintBase[k]]);
    }
    this._paintTo = slots.map(([cur, hex, base]) => [cur, hex === null ? base.clone() : new THREE.Color(hex)]);
    if (instant) { for (const [cur, to] of this._paintTo) cur.copy(to); this._paintTo = null; }
  }

  _updatePaint(dt) {
    const p = this._paintTo;
    if (!p) return;
    const k = Math.min(1, dt * 9);
    let left = 0;
    for (const [cur, to] of p) {
      cur.lerp(to, k);
      left += Math.abs(cur.r - to.r) + Math.abs(cur.g - to.g) + Math.abs(cur.b - to.b);
    }
    // 거의 닿으면 정확히 맞추고 멈춘다 — 스냅샷(SNAP_POSE)이 같은 답이면 같은 색이 되게
    if (left < 2e-3) { for (const [cur, to] of p) cur.copy(to); this._paintTo = null; }
  }

  applyKeywords(keywords) {
    if (!this.keywordObjs) { this._pendingKeywords = keywords; return; }
    // 고른 키워드의 요소만 켠다(세트는 같이). 캐빈 색은 건드리지 않는다.
    const picked = new Set(keywords || []);
    for (const [kw, objs] of Object.entries(this.keywordObjs)) {
      for (const o of objs) o.visible = picked.has(kw);
    }
  }

  setMode(mode) {
    if (this.mode === mode) return;
    const prev = this.mode;
    this.mode = mode;
    this.modeChangedAt = this.elapsed;
    // 파도 위상이 같은 자리로 접어 좌표를 작게 유지한다(부동소수점 보호).
    // 1144단위로 건너뛰는 것이라 화면엔 티가 안 나지만, 카메라와 배 실제 좌표도 같이
    // 옮겨 주지 않으면 카메라가 그 거리를 추종 속도로 기어가게 된다.
    if (this._boatEaseX !== undefined) {
      const wrapped = this._wrapWave(this._boatEaseX);
      const shift = wrapped - this._boatEaseX;
      this._boatEaseX = wrapped;
      this.boat.position.x += shift;
      if (this._camFollowX !== undefined) this._camFollowX += shift;
      this.dockX += shift;
      if (this.cruiseFromX !== undefined) this.cruiseFromX += shift;
    }

    // 배를 순간이동시키지 않는다.
    //
    // 예전엔 상태를 바꿀 때 배를 0이나 -2.4로 옮겨 놓았다. 파도는 월드에 고정돼 있고
    // 카메라는 배를 따라가므로, 그 순간 바다 전체가 옮긴 거리만큼 한 번에 훑고 지나가
    // 화면이 튀었다. 카메라 추종에 속도 상한을 걸어 봤지만 그건 튐을 미끄러짐으로
    // 바꿨을 뿐이었다.
    //
    // 그래서 배가 아니라 "선착장이 어디인지"를 배가 지금 있는 자리 기준으로 다시 잡는다.
    // 섬은 선착장에 딸려 오므로(islandGroup 위치가 dockX 기준), 배가 얼마나 멀리 나가 있든
    // 화면에서는 늘 배 옆으로 섬이 미끄러져 들어온다. 배는 한 번도 순간이동하지 않는다.
    const here = this._boatEaseX ?? this.boat.position.x;
    if (mode === "returned") {
      this.dockX = here + RETURN_DISTANCE;   // 지금 자리에서 그만큼 더 가면 선착장
    } else if (mode === "between") {
      this.cruiseFromX = here;               // 지금 자리에서 이어서 나아간다
      this._cruiseDist = 0;                  // 출발부터 다시 — 속도는 _cruiseSpeedAt 곡선을 따른다
    } else if (mode !== "unsure") {
      this.dockX = here;                     // 있던 자리를 그대로 선착장으로 삼는다
    }
    const nextShore = (mode === "between" || mode === "unsure") ? 0 : 1;
    if (nextShore !== this.shoreTarget) {
      this._shoreFrom = this.shoreBlend;   // 지금 있는 자리에서 이어서 움직인다
      this._shoreT = 0;
      // 섬을 떠나 순항을 시작할 때만 천천히 떨어지는 곡선을 쓴다 (SHORE_DEPART_EASE)
      this._shoreDepart = mode === "between" && nextShore === 0;
    }
    this.shoreTarget = nextShore;

    // between이 1.0이면 파도가 너무 거칠어서 0.1('아직 모르겠음'과 같은 값)로 낮췄다.
    // 진폭은 ampScale = 0.5 + 0.9*windT 이므로 1.4 -> 0.59, 약 58% 감소다.
    // (0.5가 하한이라 이 공식으로 낼 수 있는 최저치는 1.4의 36%다)
    // '오가는 중'은 배뿐 아니라 바다도 함께 1.5배로 (0.1 → 0.15).
    const windByMode = { stay: 0.22, leaving: 0.55, returned: 0.75, between: 0.15, unsure: 0.1 };
    this.windTarget = windByMode[mode] ?? 0.3;
  }

  /**
   * 시간대를 바꾼다. 같은 시간대면 다시 시작하지 않는다.
   * 전환 곡선은 easeInOutQuint — 앞뒤가 아주 완만하고 가운데가 급해서,
   * "확 바뀌고 잔상이 길게 남는" 느낌이 난다.
   */
  setTimeOfDay(key) {
    const to = TIME_OF_DAY[key];
    if (!to || this._timeKey === key) return;
    this._timeFrom = this._snapshotTime();
    this._timeTo = to;
    this._timeKey = key;
    this._timeT = 0;
    this._nightFrom = this._night;
    this._nightTo = LIGHTHOUSE.on[key] ?? 0;
  }

  /** 현재 화면에 실제로 적용돼 있는 값. 전환 중에 또 바꿔도 이어지도록 스냅숏을 뜬다. */
  _snapshotTime() {
    const wu = this.waterMesh.material.uniforms;
    return {
      sky: this._skyColors.map((c) => c.clone()),
      fog: this.scene.fog.color.getHex(),
      ocean: wu.uOceanColor.value.getHex(),
      skyRefl: wu.uSkyColor.value.getHex(),
      // 아래 세기들과 uExposure는 전부 팔레트 값으로 되돌려 담는다 — _applyTime이 다시
      // SCENE_BRIGHTNESS를 곱하므로, 곱해진 값을 그대로 넣으면 전환을 걸 때마다 한 번 더
      // 곱해져 그 순간 화면이 10% 튀었다가 내려온다. (uExposure만 나누기가 빠져 있었다)
      exposure: wu.uExposure.value / SCENE_BRIGHTNESS,
      sun: this.sunLight.color.getHex(), sunI: this.sunLight.intensity / (SCENE_BRIGHTNESS * SUN_SCALE),
      rim: this.rimLight.color.getHex(), rimI: this.rimLight.intensity / SCENE_BRIGHTNESS,
      amb: this.ambLight.color.getHex(), ambI: this.ambLight.intensity / (SCENE_BRIGHTNESS * AMB_SCALE),
      spec: wu.uSpecColor.value.getHex(), specI: wu.uSpecStrength.value,
      sunPos: this._sunOffset.toArray(),
      shadow: this.shadowMat ? this.shadowMat.opacity : 0,
    };
  }

  /**
   * 배경 하늘을 그린다.
   *
   * 병이 떠오르면 배경이 처음 화면(#bgFallback)의 단색으로 수렴한다. 병 안(빛·물·반짝임)은
   * 고른 시간대를 그대로 유지하므로, 내가 고른 시간이 병 속에 봉해지고 그 병이 처음 그
   * 배경 위에 놓인 것처럼 보인다. 색은 CSS에서 매번 읽어오니 --cream 을 바꾸면 따라온다.
   */
  _refreshSky() {
    const bt = Math.min(1, Math.max(0, this.bottleT));
    if (bt > 0.001 && this.bgFallback) {
      // 값을 여기 옮겨 적지 않고 CSS에서 읽는다. 나중에 --cream 을 바꾸면 이 배경도 따라온다.
      this._splashColor.setStyle(getComputedStyle(this.bgFallback).backgroundColor);
    }
    for (let i = 0; i < 4; i++) {
      TMP_SKY[i].copy(this._skyColors[i]).lerp(this._splashColor, bt);
    }
    paintSky(this.scene.background, TMP_SKY);
    this._skyBlend = bt;
  }

  /**
   * 반짝임 띠를 처음 시점에서 잡은 자리에 붙들어 둔다.
   *
   * 반짝임은 reflect(태양, 파면)과 시선이 얼마나 맞는지로 정해진다. 태양이 월드에
   * 고정돼 있으면 카메라를 돌릴수록 그 조건을 만족하는 자리가 화면 밖으로 밀려난다.
   * 실측하면 orbitYaw를 -0.8에서 +0.8로 돌릴 때 반짝임 중심이 화면 가로 10%에서 92%로
   * 쓸려가고, 화면 점유도 7.8%에서 1.7%로 줄어 배 주변이 텅 비었다.
   *
   * 그래서 반짝임에 쓰는 태양 방향만 카메라 yaw만큼 같이 돌린다. 반짝임이 생기는
   * "자리"는 화면에 머물고, 파면이 바뀌는 대로 반짝이는 각도만 달라진다.
   * 물의 확산광은 원래 태양 방향(uSunDirection)을 그대로 써서 전체 음영은 흔들리지 않는다.
   */
  _updateSpecAnchor() {
    const wu = this.waterMesh.material.uniforms;
    const base = wu.uSunDirection.value;
    const c = Math.cos(this.orbitYaw), s = Math.sin(this.orbitYaw);
    // 좌우: 카메라가 도는 만큼 태양도 같이 돌려 반짝임 자리를 붙들어 둔다.
    const x = base.x * c + base.z * s;
    const y = base.y;
    const z = -base.x * s + base.z * c;
    // 상하: 완전히 붙들면 파도를 훑는 느낌까지 죽는다. 카메라가 위아래로 움직인 만큼의
    // 70%만 따라 돌려서, 반짝임이 움직이는 정도를 예전의 30%로 남긴다.
    const yaw = BASE_YAW + this.orbitYaw;
    const ax = Math.cos(yaw), az = -Math.sin(yaw);        // 카메라 오른쪽 축(수평)
    // 부호: +가 맞다. 반대로 걸면 오히려 반짝임이 더 크게 쓸려간다(실측 63%p → 75%p).
    const a = SPEC_PITCH_FOLLOW * this.orbitPitch;
    const ca = Math.cos(a), sa = Math.sin(a), t = 1 - ca;
    // 임의 축(ax, 0, az) 둘레 회전 — 로드리게스 공식
    wu.uSpecSunDir.value.set(
      x * (t * ax * ax + ca) + y * (-sa * az)          + z * (t * ax * az),
      x * (sa * az)          + y * (ca)                + z * (-sa * ax),
      x * (t * ax * az)      + y * (sa * ax)           + z * (t * az * az + ca)
    );
  }

  /** from→to 사이 k(0~1) 지점의 색·세기를 실제 씬에 반영한다. */
  _applyTime(k) {
    const a = this._timeFrom, b = this._timeTo;
    const wu = this.waterMesh.material.uniforms;
    const mixHex = (target, from, to) => {
      target.set(typeof from === "number" ? from : from.getHex());
      target.lerp(TMP_COLOR.set(typeof to === "number" ? to : to.getHex()), k);
    };
    for (let i = 0; i < 4; i++) {
      const fromC = a.sky[i] instanceof THREE.Color ? a.sky[i] : new THREE.Color(a.sky[i]);
      const toC = b.sky[i] instanceof THREE.Color ? b.sky[i] : new THREE.Color(b.sky[i]);
      this._skyColors[i].copy(fromC).lerp(toC, k);
    }
    this._refreshSky();
    mixHex(this.scene.fog.color, a.fog, b.fog);
    mixHex(wu.uOceanColor.value, a.ocean, b.ocean);
    // 병 안 물 덩어리도 같은 바다색을 쓰되, 표면이 하늘을 반사해 조금 밝은 걸 감안해 섞는다.
    if (this.bottleWaterMat) {
      this.bottleWaterMat.color.copy(wu.uOceanColor.value)
        .lerp(TMP_COLOR.set(wu.uSkyColor.value.getHex()), 0.18);
    }
    mixHex(wu.uSkyColor.value, a.skyRefl, b.skyRefl);
    mixHex(this.sunLight.color, a.sun, b.sun);
    mixHex(this.rimLight.color, a.rim, b.rim);
    mixHex(this.ambLight.color, a.amb, b.amb);
    mixHex(wu.uSpecColor.value, a.spec, b.spec);
    wu.uSpecStrength.value = a.specI + (b.specI - a.specI) * k;
    // 해의 위치도 함께 움직인다 — 저녁엔 낮게 깔려 그림자가 길어진다.
    // 실제 배치는 _animate에서 배 위치를 더해 적용한다.
    for (let i = 0; i < 3; i++) {
      this._sunOffset.setComponent(i, a.sunPos[i] + (b.sunPos[i] - a.sunPos[i]) * k);
    }
    if (this.shadowMat) {
      const op = a.shadow + (b.shadow - a.shadow) * k;
      this.shadowMat.opacity = op;
      // 그림자가 없는 시간대에는 그림자 맵 렌더 자체를 건너뛴다.
      this.sunLight.castShadow = this._softShadows || op > 0.001;
      this.shadowCatcher.visible = op > 0.001;
    }
    wu.uExposure.value = (a.exposure + (b.exposure - a.exposure) * k) * SCENE_BRIGHTNESS;
    // 전체 밝기는 팔레트 네 벌을 다 고치지 않고 여기 한 곳에서 곱한다.
    this.sunLight.intensity = (a.sunI + (b.sunI - a.sunI) * k) * SCENE_BRIGHTNESS * SUN_SCALE;
    this.rimLight.intensity = (a.rimI + (b.rimI - a.rimI) * k) * SCENE_BRIGHTNESS;
    this.ambLight.intensity = (a.ambI + (b.ambI - a.ambI) * k) * SCENE_BRIGHTNESS * AMB_SCALE;
    // 반구광: 하늘색(둘째 띠, 채도 절반)과 바다색(절반 밝기). 세기는 채움광 팔레트 값을 따른다.
    const hemiSky = (p) => {
      const band = p.sky[HEMI.skyBand];   // 규칙은 statistics/shared/look-tokens.js (지도와 같이 씀)
      const c = new THREE.Color(band instanceof THREE.Color ? band.getHex() : band);
      const g = c.r * 0.2126 + c.g * 0.7152 + c.b * 0.0722;
      return c.lerp(new THREE.Color(g, g, g), HEMI.skyDesat);
    };
    const hemiGround = (p) => new THREE.Color(p.ocean).multiplyScalar(HEMI.groundMul);
    this.hemiLight.color.copy(hemiSky(a)).lerp(hemiSky(b), k);
    this.hemiLight.groundColor.copy(hemiGround(a)).lerp(hemiGround(b), k);
    this.hemiLight.intensity = (a.ambI + (b.ambI - a.ambI) * k) * SCENE_BRIGHTNESS * HEMI_SCALE;
    // 표면 효과의 하늘 반사·테두리 빛은 지금 하늘색을 쓴다 (위 = 첫 띠, 수평선 = 마지막 띠)
    this.fx.uSkyTop.value.copy(this._skyColors[0]);
    this.fx.uSkyHor.value.copy(this._skyColors[3]);
    this.fx.uRimColor.value.copy(this._skyColors[2]);
  }

  /**
   * 단계에 맞는 카메라 목적지를 건다. 이미 같은 목적지면 다시 시작하지 않는다
   * (같은 단계에서 render()가 여러 번 불리는데 그때마다 전환이 재시작되면 안 된다).
   */
  _setCamStep(step) {
    const p = CAM_STEPS[step] || CAM_DEFAULT;
    const to = { tx: p.target[0], ty: p.target[1], tz: p.target[2], radius: p.radius, widen: p.widen || CAM_MAX_WIDEN };
    if (!this._camCur) { this._camCur = { ...to }; this._camFrom = { ...to }; this._camTo = to; this._camT = 1; return; }
    const cur = this._camTo;
    if (cur && cur.tx === to.tx && cur.ty === to.ty && cur.tz === to.tz && cur.radius === to.radius && cur.widen === to.widen) return;
    this._camFrom = { ...this._camCur };
    this._camTo = to;
    this._camT = 0;
    this._camDur = CAM_MOVE_SEC;
  }

  show(step, appState) {
    const wasVisible = this.visible;
    // 단계가 바뀌면 줌은 기본 거리로 돌아온다(부드럽게) — 당겨 둔 채로 다음 구도가 잘리지 않게
    if (step !== this._zoomStep) { this._zoomStep = step; this._zoomTarget = 1; }
    this._frameTarget = step === "result" ? FRAMING.result : QUESTION_STEPS.includes(step) ? FRAMING.question : FRAMING.intro;
    this.visible = ACTIVE_STEPS.includes(step);
    this.stage.classList.toggle("visible", this.visible);
    if (!this.visible) return;

    this.applyRegion(appState.region);
    this.setMode(appState.stateId || "stay");
    this.applyKeywords(appState.keywords);
    this.setPaint(appState.hullColor || "base", appState.tone === "two" ? (appState.deckColor || "base") : "auto");
    this.setProps(appState.props || {}, appState.catCoat || "calico");

    this._setCamStep(step);

    if (step !== "result") {
      this.bottleTarget = 0;
      this.bottleRevealed = false;
      // 병을 둘러볼 때만 열리는 넓은 각도가 다음 단계로 새어 나가지 않게 일반 범위로 접는다.
      // 결과 화면에서 몇 바퀴 돌렸든 가까운 쪽으로 접은 뒤 일반 범위로 (안 접으면 그 바퀴 수만큼 되감긴다)
      this.orbitYaw = wrapAngle(this.orbitYaw);
      this.orbitPitch = wrapAngle(this.orbitPitch);
      this._easeOrbitTo(
        Math.max(-0.85, Math.min(0.85, this.orbitYaw)),
        Math.max(-0.2, Math.min(0.55, this.orbitPitch))
      );
    }

    // 둘러보던 시점은 단계를 넘어가도 그대로 둔다 — 줌인·패닝(프리셋의 target/radius)만 바뀐다.
    // 예외로 프리셋에 orbit이 지정된 단계(지역)는 그 시점으로 갈아타고, 벗어나면 원래 시점으로 돌아온다.
    const override = (CAM_STEPS[step] || {}).orbit;
    if (override) {
      if (!this._orbitOverridden) {
        this._orbitSaved = { yaw: this.orbitYaw, pitch: this.orbitPitch };
        this._orbitOverridden = true;
      }
      this._easeOrbitTo(override.yaw, override.pitch);
    } else if (this._orbitOverridden) {
      this._orbitOverridden = false;
      this._easeOrbitTo(this._orbitSaved.yaw, this._orbitSaved.pitch);
    }

    // 씬이 숨어 있다가 다시 나타나는 길 — 아카이브에서 "다시 한 문장 남기기"를 누르는 경우다.
    // 여기서는 카메라를 이징으로 옮기지 않고 목적지에 바로 세운다.
    // 결과 화면의 카메라는 병을 다 담느라 반지름 35 남짓까지 물러나 있어서, 기본 시점(12)까지
    // 같은 1.1초 안에 오려면 50 가까이를 가로질러야 한다. 수식으로는 끊김 없이 이어지지만
    // (프레임당 이동이 종 모양으로 오르내린다) 화면에는 확 낚아채는 줌인으로 보였다.
    // 무대가 어차피 0.7초 동안 페이드 인하므로, 이미 자리를 잡은 채 떠오르는 편이 자연스럽다.
    if (!wasVisible) this._reenter();
  }

  /**
   * 씬이 숨은 사이에 처음 상태로 되돌려 놓고, 다시 나타날 때는 줌인만 보여준다.
   *
   * 결과 화면의 카메라는 병을 담느라 멀리 물러난 데다 둘러보던 각도까지 남아 있다.
   * 그대로 이징하면 1.1초 동안 50 가까이를 가로지르며 시선까지 휘어 들어와 뒤틀려 보였다.
   * 각도·병·시간대는 안 보이는 동안 처음 값으로 되돌리고 거리만 뒤에서 당겨온다.
   * 방향이 이미 맞아 있으니 화면에는 깨끗한 줌인만 남는다.
   */
  _reenter() {
    // 스플래시 → 온보딩 첫 진입에서는 인트로가 이미 시점을 올리는 중이다.
    // 그때 여기서 높이를 0으로 되돌리고 줌인까지 걸면 인트로가 통째로 지워진다.
    const introRunning = this._introPending || this._liftT < 1;

    this.orbitYaw = 0; this.orbitPitch = 0;
    this._orbitFrom = { yaw: 0, pitch: 0 };
    this._orbitTo = { yaw: 0, pitch: 0 };
    this._orbitT = 1;
    this._orbitOverridden = false;
    this._orbitSaved = { yaw: 0, pitch: 0 };
    this.bottleT = this.bottleTarget;
    this._bottleCamBlend = this.bottleTarget;
    if (!introRunning) {
      this._lift = 0; this._liftT = 1; this._onLiftDone = null;
      this.boat.visible = true; this.boat.scale.setScalar(1);
      this._dropT = 1; this._dropOffset = 0;
    }

    // 시간대도 처음 값으로 되돌린다. 앞사람이 고른 시간이 다음 사람 첫 화면에 남지 않게.
    this._timeKey = INITIAL_TIME_KEY;
    this._timeFrom = TIME_OF_DAY[INITIAL_TIME_KEY];
    this._timeTo = TIME_OF_DAY[INITIAL_TIME_KEY];
    this._timeT = 1;
    this._applyTime(1);
    this._night = this._nightFrom = this._nightTo = LIGHTHOUSE.on[INITIAL_TIME_KEY] ?? 0;

    if (introRunning) {
      // 인트로가 시점을 올렸다 내리는 것으로 등장을 대신하므로 줌인은 걸지 않는다.
      this._camFrom = { ...this._camTo };
      this._camCur = { ...this._camTo };
      this._camT = 1;
      return;
    }
    // 목적지(각도·바라보는 지점)는 이미 맞춰져 있고, 거리만 뒤에서 시작한다.
    this._camFrom = { ...this._camTo, radius: this._camTo.radius * REENTER_ZOOM_FROM };
    this._camCur = { ...this._camFrom };
    this._camT = 0;
    this._camDur = REENTER_ZOOM_SEC;
  }

  /** 투명한 여백을 잘라 내고 내용만 남긴 PNG를 돌려준다. */
  _cropToContent(src) {
    const w = src.width, h = src.height;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(src, 0, 0);
    const d = cx.getImageData(0, 0, w, h).data;
    let x0 = w, x1 = -1, y0 = h, y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] < 8) continue;
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
    if (x1 < 0) return src.toDataURL("image/png");   // 내용이 없으면 원본 그대로
    const pad = 6;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
    const out = document.createElement("canvas");
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext("2d").drawImage(src, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL("image/png");
  }

  /**
   * 아카이브 카드에 남길 스냅샷.
   *
   * 예전엔 버튼을 누른 그 순간의 화면을 그대로 떠서, 둘러보다 누르면 기울어진 각도가
   * 그대로 남았다. 둘러보던 각도를 잠깐 0으로 되돌린 기본 구도로 찍고 원래대로 돌려놓는다.
   * 배경(하늘)·그림자·바다를 잠시 끄면 알파가 뚫려 병과 그 안만 남은 그림이 나온다.
   */
  /**
   * fn을 "정해 둔 순간"(SNAP_POSE)에서 실행하고, 건드린 상태를 전부 되돌린다.
   * 찍히는 그림을 바꾸는 것: 파도(시각·흐름 위상·배가 파도 공간의 어디 있는지·바람 세기), 배의 출렁임 자세,
   * 연기 덩어리, 등대 빛줄기 각도, 램프 흔들림, 물결 일렁임, 병이 다 떠올랐는지, 카메라가 배를 따라온 정도.
   * 답(지역 모래색·상태·시간대·키워드)에 따라 달라지는 건 그대로 둔다 — 그게 이 병의 모양이다.
   * 연기는 지금 떠 있는 것을 치우고, 정해 둔 난수로 smokeSec초 동안 처음부터 다시 피운다
   * ('오가는 중'은 배가 그동안 나아간 것처럼 연기가 뒤로 끌린다). 찍고 나면 원래 연기로 되돌린다.
   */
  _withSnapPose(fn) {
    const P = SNAP_POSE, wu = this.waterMesh.material.uniforms, b = this.boat;
    const keep = {
      uTime: wu.uTime.value, flow: wu.uFlowPhase.value, chop: wu.uChop.value, amp: wu.uAmpScale.value,
      boatU: wu.uBoatX.value, shift: wu.uWaveShift.value, clipT: wu.uClipT.value,
      waterX: this.waterMesh.position.x, windT: this.windT, fxTime: this.fx.uFxTime.value,
      lh: this._lhAngle, camX: this._camFollowX, bottleT: this.bottleT, camBlend: this._bottleCamBlend,
      bx: b.position.x, by: b.position.y, brz: b.rotation.z, bry: b.rotation.y,
      bottleX: this.bottleGroup.position.x, clipCx: wu.uClipCenter.value.x,
      bottleOp: [this.bottleMat.opacity, this.bottleRimMat.opacity, this.bottleCorkMat.opacity, this.bottleWaterMat.opacity],
      smoke: this.smokePool.map((p) => ({ active: p.active, age: p.age, vis: p.mesh.visible, pos: p.mesh.position.clone(),
        rot: p.mesh.rotation.clone(), sc: p.mesh.scale.x, op: p.mat.opacity, col: p.mat.color.getHex(),
        spin: p.spin, drift: p.drift, wobble: p.wobble })),
      spawnTimer: this.smokeSpawnTimer, random: Math.random,
    };
    try {
      // 병은 다 떠오른 상태로 (결과 화면에서 찍는다)
      if (this.bottleTarget === 1) {
        this.bottleT = 1; this._bottleCamBlend = 1;
        this.bottleMat.opacity = 0.28; this.bottleRimMat.opacity = 0.62;
        this.bottleCorkMat.opacity = 0.9; this.bottleWaterMat.opacity = 0.9;
        wu.uClipT.value = 1;
      }
      // 선착장에 댄 배는 선착장 기준으로 정해 둔 자리에 — 머무르는 중은 제자리에서 좌우로 조금 흔들려서
      // (_animate: dockX + sin(t·0.4)·0.03) 그것만으로도 섬과의 사이가 병마다 달라졌다
      const dockTarget = this.mode === "stay" ? this.dockX + Math.sin(P.t * 0.4) * 0.03
        : (this.mode === "leaving" || this.mode === "returned") ? this.dockX : null;
      if (dockTarget !== null) b.position.x = dockTarget;
      this.bottleGroup.position.x = b.position.x + this._bottleRelX;
      wu.uClipCenter.value.x = this.bottleGroup.position.x;
      // 파도 — 정해 둔 시각·위상·바람, 배가 파도 공간의 waveX에 있는 것처럼(타일은 배에 딱 맞춘다)
      this.windT = this.windTarget;
      wu.uTime.value = P.t; wu.uFlowPhase.value = 0;
      wu.uChop.value = 0.32 * (0.4 + 0.6 * this.windT);
      wu.uAmpScale.value = 0.5 + 0.9 * this.windT;
      this.waterMesh.position.x = b.position.x;
      wu.uBoatX.value = b.position.x;
      wu.uWaveShift.value = P.waveX - b.position.x;
      this.fx.uFxTime.value = P.t;
      // 배 자세 — 같은 파도에서의 출렁임(_animate 의 배 블록과 같은 식)
      const bob = BOAT_BOB_BY_MODE[this.mode] ?? 1;
