<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그래도, 여기 살고 있습니다 — 참여형 아카이브 (프로토타입)</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#1a1a1a; --ink2:#3d3d3d; --ink3:#7a7a7a;
    --cream:#f7f4ef; --white:#ffffff;
    --gold:#b89a6a; --gold2:#d4b896;
    --dark:#16161e; --dark2:#22222e;
    --font:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  }
  html,body{height:100%;}
  body{
    font-family:var(--font); background:transparent; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; overflow-x:hidden;
  }
  #proto-badge{
    position:fixed; top:10px; right:10px; z-index:999;
    background:var(--dark); color:var(--gold2); font-size:11px;
    padding:5px 10px; border-radius:20px; letter-spacing:.02em; opacity:.85;
  }
  #app{ width:100%; max-width:520px; min-height:100vh; padding:32px 20px 60px;
    display:flex; flex-direction:column; position:relative; z-index:2;
    pointer-events:none; user-select:none; -webkit-user-select:none; }

  /* 실제 조작이 필요한 요소들만 포인터 이벤트를 되살림 (그 외 빈 공간은 드래그가 캔버스로 통과) */
  #app button,
  #app .option-card,
  #app .tag,
  #app .filter-chip,
  #app select,
  #app textarea,
  #app .consent-box label,
  #app .consent-box input{
    pointer-events:auto;
  }
  #app textarea{ user-select:text; -webkit-user-select:text; }
  .screen{ display:flex; flex-direction:column; flex:1; animation:fadeIn .5s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* progress */
  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .progress-bar{ flex:1; height:3px; background:rgba(227,221,208,.55); border-radius:2px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gold); transition:width .4s ease; }
  .progress-label{ font-size:12px; color:var(--ink3); white-space:nowrap; }
  .back-btn{ background:none; border:none; color:var(--ink3); font-size:13px; cursor:pointer; margin-bottom:14px; align-self:flex-start; }

  /* splash */
  .splash{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:18px; }
  .splash h1{ font-size:26px; line-height:1.4; font-weight:700; }
  .splash h1 span{ display:block; color:var(--gold); font-size:14px; letter-spacing:.15em; margin-bottom:10px; font-weight:500; }
  .splash p{ color:var(--ink3); font-size:14px; line-height:1.7; max-width:340px; }

  .chat-btn{
    margin-top:18px; width:100%; max-width:320px; background:rgba(22,22,30,.72); color:var(--white);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12); border-radius:30px; padding:16px 22px; font-size:15px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; font-family:var(--font);
    transition:transform .15s ease;
  }
  .chat-btn:hover{ transform:translateY(-2px); }
  .chat-btn span.arrow{ color:var(--gold2); font-size:18px; }

  .onboard-line{ font-size:16px; line-height:1.8; text-align:center; padding:40px 10px; color:var(--ink2); flex:1; display:flex; align-items:center; justify-content:center; }

  .fade-stage{ opacity:0; transform:translateY(8px); transition:opacity .8s ease, transform .8s ease; }
  .fade-stage.show{ opacity:1; transform:translateY(0); }

  h2.q{ font-size:19px; font-weight:700; margin-bottom:6px; }
  p.sub{ font-size:13px; color:var(--ink3); margin-bottom:24px; line-height:1.6; }

  .option-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
  .option-card{
    border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.5);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-radius:14px; padding:16px 18px;
    cursor:pointer; font-size:14px; display:flex; justify-content:space-between; align-items:center;
    transition:all .15s ease;
  }
  .option-card:hover{ border-color:var(--gold2); }
  .option-card.selected{ border-color:var(--gold); background:rgba(251,247,239,.68); font-weight:700; }
  .option-card .desc{ font-weight:400; font-size:12px; color:var(--ink3); margin-top:3px; }

  textarea.sentence{
    width:100%; border:1.5px solid rgba(255,255,255,.55); border-radius:14px; padding:16px; font-size:15px;
    font-family:var(--font); resize:none; min-height:110px; background:rgba(255,255,255,.5);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); line-height:1.6;
  }
  textarea.sentence:focus{ outline:none; border-color:var(--gold); }
  .char-count{ text-align:right; font-size:12px; color:var(--ink3); margin-top:6px; }

  .tag-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .tag{
    border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.5);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-radius:20px; padding:9px 16px;
    font-size:13px; cursor:pointer; transition:all .15s ease;
  }
  .tag.selected{ background:rgba(22,22,30,.72); color:var(--white); border-color:rgba(22,22,30,.72); }
  .tag.disabled{ opacity:.35; pointer-events:none; }

  .consent-box{ border:1.5px solid rgba(255,255,255,.55); border-radius:14px; padding:16px; margin-bottom:16px;
    background:rgba(255,255,255,.5); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .consent-box label{ display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:1.6; cursor:pointer; }
  .consent-box input[type=checkbox]{ margin-top:3px; accent-color:var(--gold); width:16px; height:16px; flex-shrink:0; }
  .privacy-note{ font-size:11.5px; color:var(--ink3); line-height:1.7; margin-top:14px; padding-top:14px; border-top:1px dashed #e3ddd0; }

  .next-btn{
    margin-top:auto; width:100%; background:rgba(22,22,30,.72); color:var(--white); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-radius:30px; padding:16px; font-size:15px; cursor:pointer; font-family:var(--font);
    transition:opacity .15s ease;
  }
  .next-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* 결과 카드 */
  .result-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; gap:22px; text-align:center; }
  .my-card{
    background:rgba(22,22,30,.72); color:var(--white); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:20px; padding:34px 26px; width:100%;
    max-width:340px; position:relative; animation:cardPop .6s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes cardPop{ from{opacity:0; transform:scale(.85) translateY(14px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .my-card .tagline{ color:var(--gold2); font-size:11px; letter-spacing:.12em; margin-bottom:14px; }
  .my-card .sentence-txt{ font-size:18px; line-height:1.6; font-weight:700; margin-bottom:18px; }
  .my-card .meta-row{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; font-size:11px; color:#c9c5bc; }
  .my-card .meta-row span{ border:1px solid #454555; border-radius:20px; padding:3px 10px; }
  .result-wrap p.note{ color:var(--ink3); font-size:13px; }

  /* 아카이브 화면 */
  .archive-screen{ width:100%; max-width:960px; padding:24px 16px 60px; }
  .archive-header{ text-align:center; margin-bottom:22px; }
  .archive-header h2{ font-size:22px; margin-bottom:6px; }
  .archive-header p{ color:var(--ink3); font-size:13px; }
  .filter-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px; }
  .filter-chip{
    border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-radius:20px; padding:7px 14px;
    font-size:12.5px; cursor:pointer;
  }
  .filter-chip.active{ background:rgba(22,22,30,.78); color:var(--white); border-color:rgba(22,22,30,.78); }
  .region-select{ text-align:center; margin-bottom:22px; }
  .region-select select{ font-family:var(--font); font-size:12.5px; padding:6px 10px; border-radius:20px;
    border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }

  .wall{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .wall-card{
    background:rgba(255,255,255,.7); border:1px solid rgba(236,231,220,.8); border-radius:16px; padding:18px;
    font-size:13.5px; line-height:1.6; animation:cardIn .5s ease backwards;
    display:flex; flex-direction:column; gap:10px;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .wall-card.new-card{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,154,106,.25); animation:cardIn .5s ease, pulse 1.8s ease 2; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 2px rgba(184,154,106,.25);} 50%{ box-shadow:0 0 0 5px rgba(184,154,106,.12);} }
  .wall-card .top-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink3); }
  .wall-card .state-tag{ color:var(--gold); font-weight:700; }
  .wall-card .txt{ font-weight:600; }
  .wall-card .kw-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .wall-card .kw{ font-size:10.5px; color:var(--ink3); border:1px solid #e3ddd0; border-radius:10px; padding:2px 8px; }
  .empty-note{ text-align:center; color:var(--ink3); font-size:13px; padding:40px 0; }

  .restart-btn{
    display:block; margin:30px auto 0; background:none; border:1.5px solid var(--ink3); color:var(--ink2);
    border-radius:30px; padding:10px 22px; font-size:13px; cursor:pointer; font-family:var(--font);
  }

  @media (max-width:480px){ .my-card .sentence-txt{ font-size:16px; } }

  /* 병 속 풍경 3D 씬 — 전체화면 배경으로 표시 (onboard~result 단계)
     일부 모바일 브라우저(특히 인앱 웹뷰)는 negative z-index + position:fixed 조합에서
     합성(compositing) 오류로 요소가 아예 안 보이는 경우가 있어, z-index는 0 이상만 사용 */
  #bgFallback{ position:fixed; inset:0; z-index:0; background:var(--cream); }
  #sceneStage{
    position:fixed; inset:0; z-index:1;
    opacity:0; transition:opacity .7s ease;
  }
  #sceneStage.visible{ opacity:1; }
  #bottleCanvas{ width:100%; height:100%; display:block; }

  /* 3D 초기화 실패 시 안내 (파일을 로컬로 직접 열었거나 인앱 브라우저인 경우 등) */
  #sceneError{
    position:fixed; left:12px; right:12px; bottom:16px; z-index:50;
    background:rgba(20,20,26,.92); color:#fff; font-size:12.5px; line-height:1.6;
    padding:12px 14px; border-radius:12px; display:none;
  }
  #sceneError.show{ display:block; }

  /* 카메라 각도 튜닝용 디버그 오버레이 (?debug=1 로 접속했을 때만 표시) */
  #camDebug{
    position:fixed; left:12px; top:12px; z-index:60;
    background:rgba(20,20,26,.85); color:#8ef0c0; font-family:monospace; font-size:11.5px;
    line-height:1.7; padding:10px 12px; border-radius:10px; white-space:pre; display:none;
    pointer-events:none;
  }
  #camDebug.show{ display:block; }

  /* 아카이브 카드 썸네일 */
  .wall-card img.snap-thumb{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px;
    background:#ece7dc; display:block;
  }
</style>
</head>
<body>

<div id="proto-badge">PROTOTYPE · 목업 데이터</div>
<div id="bgFallback"></div>
<div id="sceneStage"><canvas id="bottleCanvas"></canvas></div>
<div id="app"></div>
<div id="sceneError">3D 배경을 불러오지 못했어요. ① 이 파일을 다운로드해서 그냥 열었다면 웹 서버(https)에 올려서 열어보세요. ② 카카오톡·인스타그램 등 인앱 브라우저라면 우측 상단 메뉴에서 "다른 브라우저로 열기"를 사용해보세요. ③ 브라우저를 최신 버전으로 업데이트해보세요.</div>
<div id="camDebug"></div>

<script>
  // 4초 안에 3D 씬이 초기화되지 않으면(모듈 로드 실패, WebGL 미지원 등) 안내 메시지 노출
  setTimeout(function(){
    if(!window.BottleScene){
      var el = document.getElementById("sceneError");
      if(el) el.classList.add("show");
    }
  }, 4000);
</script>

<script>
/* ===========================================================
   그래도, 여기 살고 있습니다 — 참여형 아카이브 프로토타입
   ※ 실제 서버/DB 없음. 브라우저 메모리에만 데이터가 존재하며
     새로고침 시 초기화됩니다. (실서비스는 Supabase 등 연동 필요)
=========================================================== */

const REGIONS = ["아산","천안","기타 충남","충남 밖","비공개"];
const STATES = [
  {id:"stay", label:"머무르는 중", desc:"지금 이곳에서 계속 살아가고 있어요"},
  {id:"leaving", label:"떠날 준비 중", desc:"곧 이곳을 떠날 계획이 있어요"},
  {id:"returned", label:"돌아온 사람", desc:"떠났다가 다시 이곳으로 왔어요"},
  {id:"between", label:"오가는 중", desc:"두 지역을 오가며 지내고 있어요"},
  {id:"unsure", label:"아직 모르겠음", desc:"머물지 떠날지 아직 정하지 못했어요"},
];
const KEYWORDS = ["일","관계","가족","창작","익숙함","주거","불안","자유","소속감","우연"];

// 시연용 목업 시드 데이터
let entries = [
  {region:"아산", state:"stay", text:"여기서 나고 자란 친구들이 아직 다 있어서, 떠날 이유를 못 찾겠어요.", keywords:["관계","익숙함"], name:"익명"},
  {region:"천안", state:"leaving", text:"괜찮은 일자리가 여기엔 없어서, 결국 서울로 가게 될 것 같아요.", keywords:["일","불안"], name:"익명"},
  {region:"기타 충남", state:"returned", text:"서울 살아보니 알겠더라고요, 제가 있을 곳은 여기였다는 걸.", keywords:["소속감","익숙함"], name:"바다"},
  {region:"아산", state:"between", text:"평일엔 일 때문에 나가지만 주말엔 항상 이곳으로 돌아와요.", keywords:["일","가족"], name:"익명"},
  {region:"충남 밖", state:"unsure", text:"고향이 그립긴 한데, 지금 자리 잡은 곳을 버리기도 애매해요.", keywords:["불안","우연"], name:"익명"},
  {region:"천안", state:"stay", text:"작업실 월세가 여기서만 가능해서 계속 남아있어요.", keywords:["창작","주거"], name:"단단"},
  {region:"아산", state:"leaving", text:"부모님이 여기 계시지만, 제 커리어는 다른 도시에 있는 것 같아요.", keywords:["가족","일"], name:"익명"},
  {region:"기타 충남", state:"stay", text:"딱히 이유는 없지만 여길 떠난다는 상상이 잘 안 돼요.", keywords:["익숙함"], name:"익명"},
  {region:"천안", state:"unsure", text:"매년 떠난다고 말만 하고 벌써 5년째 여기 살고 있네요.", keywords:["우연","익숙함"], name:"익명"},
  {region:"충남 밖", state:"returned", text:"타지에서 지치고 나서야 이 동네의 조용함이 그리웠다는 걸 알았어요.", keywords:["소속감","불안"], name:"강"},
];

let state = {
  step: "splash",
  region: null,
  stateId: null,
  text: "",
  keywords: [],
  disclose: "익명",
  consent: false,
  filterState: "all",
  filterRegion: "all",
};

const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  const el = document.createElement("div");
  el.className = "screen";

  if(state.step==="splash") el.appendChild(renderSplash());
  else if(state.step==="onboard") el.appendChild(renderOnboard());
  else if(state.step==="region") el.appendChild(renderRegion());
  else if(state.step==="state") el.appendChild(renderState());
  else if(state.step==="sentence") el.appendChild(renderSentence());
  else if(state.step==="keywords") el.appendChild(renderKeywords());
  else if(state.step==="consent") el.appendChild(renderConsent());
  else if(state.step==="result") el.appendChild(renderResult());
  else if(state.step==="archive") el.appendChild(renderArchive());

  app.appendChild(el);

  // 3D 병 속 풍경 씬 동기화 (onboard ~ result 단계까지 배경으로 노출)
  if(window.BottleScene) window.BottleScene.show(state.step, state);
}

function progress(stepNum, total, label){
  const wrap = document.createElement("div");
  wrap.className = "progress-row";
  wrap.innerHTML = `<div class="progress-bar"><div class="progress-fill" style="width:${(stepNum/total)*100}%"></div></div>
    <div class="progress-label">${stepNum}/${total}</div>`;
  return wrap;
}

function backBtn(prevStep){
  const b = document.createElement("button");
  b.className = "back-btn";
  b.textContent = "← 이전으로";
  b.onclick = () => { state.step = prevStep; render(); };
  return b;
}

function renderSplash(){
  const d = document.createElement("div");
  d.className = "splash";
  d.innerHTML = `
    <h1><span>입다 · 2026 다원예술 프로젝트</span>그래도,<br>여기 살고 있습니다</h1>
    <p>충남·아산에 남아 살아가는 청년의 이야기를 한 문장으로 남겨주세요.<br>당신의 문장은 다른 사람들의 기록과 함께 전시장 안에 쌓입니다.</p>
  `;
  const btn = document.createElement("button");
  btn.className = "chat-btn";
  btn.innerHTML = `시작하기 <span class="arrow">→</span>`;
  btn.onclick = () => { state.step="onboard"; render(); };
  d.appendChild(btn);
  return d;
}

function renderOnboard(){
  const d = document.createElement("div");
  d.style.display="flex"; d.style.flexDirection="column"; d.style.flex="1";
  const line = document.createElement("div");
  line.className = "onboard-line fade-stage";
  line.textContent = "지금, 당신은 이곳에 머물고 있나요, 지나가고 있나요?";
  d.appendChild(line);
  const btn = document.createElement("button");
  btn.className = "chat-btn fade-stage";
  btn.innerHTML = `한 문장 남기러 가기 <span class="arrow">→</span>`;
  btn.onclick = () => { state.step="region"; render(); };
  d.appendChild(btn);

  // 배가 화면 중앙에 뽁 하고 등장해 물가로 떨어져 정착한 뒤,
  // 문장 → 버튼 순서로 페이드인
  if(window.BottleScene){
    window.BottleScene.playIntro(()=>{
      requestAnimationFrame(()=> line.classList.add("show"));
      setTimeout(()=> btn.classList.add("show"), 650);
    });
  } else {
    line.classList.add("show"); btn.classList.add("show");
  }
  return d;
}

function renderRegion(){
  const d = document.createElement("div");
  d.appendChild(backBtn("onboard"));
  d.appendChild(progress(1,5));
  const h = document.createElement("h2"); h.className="q"; h.textContent="지금 활동하는 지역은 어디인가요?";
  d.appendChild(h);
  const p = document.createElement("p"); p.className="sub"; p.textContent="넓은 범주로만 남습니다. 상세 주소는 수집하지 않아요.";
  d.appendChild(p);
  const list = document.createElement("div"); list.className="option-list";
  REGIONS.forEach(r=>{
    const c = document.createElement("div");
    c.className = "option-card" + (state.region===r ? " selected":"");
    c.innerHTML = `<span>${r}</span>`;
    c.onclick = ()=>{ state.region=r; render(); };
    list.appendChild(c);
  });
  d.appendChild(list);
  const next = document.createElement("button");
  next.className="next-btn"; next.textContent="다음";
  next.disabled = !state.region;
  next.onclick = ()=>{ state.step="state"; render(); };
  d.appendChild(next);
  return d;
}

function renderState(){
  const d = document.createElement("div");
  d.appendChild(backBtn("region"));
  d.appendChild(progress(2,5));
  const h=document.createElement("h2"); h.className="q"; h.textContent="지금 당신의 상태에 가장 가까운 것은?";
  d.appendChild(h);
  const p=document.createElement("p"); p.className="sub"; p.textContent="정답은 없습니다. 지금 느끼는 대로 골라주세요.";

  const list=document.createElement("div"); list.className="option-list";

    const c=document.createElement("div");
    c.className="option-card"+(state.stateId===s.id?" selected":"");
    c.innerHTML=`<div><div>${s.label}</div><div class="desc">${s.desc}</div></div>`;
    c.onclick=()=>{ state.stateId=s.id; render(); };
    list.appendChild(c);
  });
  d.appendChild(list);
  const next=document.createElement("button");
  next.className="next-btn"; next.textContent="다음";
  next.disabled=!state.stateId;
  next.onclick=()=>{ state.step="sentence"; render(); };
  d.appendChild(next);
  return d;
}

function renderSentence(){
  const d=document.createElement("div");
  d.appendChild(backBtn("state"));
  d.appendChild(progress(3,5));
  const h=document.createElement("h2"); h.className="q"; h.textContent="지금 당신이 이곳에 머무르게 하는 것은 무엇인가요?";
  d.appendChild(h);
  const p=document.createElement("p"); p.className="sub"; p.textContent="정답은 없으며, 최대 80자까지 한 문장으로 남길 수 있습니다.";
  d.appendChild(p);
  const ta=document.createElement("textarea");
  ta.className="sentence"; ta.maxLength=80; ta.placeholder="예: 아직 여기에 내가 아끼는 사람들이 있어서요.";
  ta.value = state.text;
  const count=document.createElement("div"); count.className="char-count"; count.textContent=`${ta.value.length}/80`;
  ta.addEventListener("input",()=>{ state.text=ta.value; count.textContent=`${ta.value.length}/80`; next.disabled=ta.value.trim().length===0; });
  d.appendChild(ta); d.appendChild(count);
  const next=document.createElement("button");
  next.className="next-btn"; next.textContent="다음"; next.style.marginTop="20px";
  next.disabled = state.text.trim().length===0;
  next.onclick=()=>{ state.step="keywords"; render(); };
  d.appendChild(next);
  return d;
}

function renderKeywords(){
  const d=document.createElement("div");
  d.style.display="flex"; d.style.flexDirection="column"; d.style.flex="1";
  d.appendChild(backBtn("sentence"));
  d.appendChild(progress(4,5));

  // 배가 화면 전체적으로 온전히 보이도록 선택지 묶음을 화면 하단으로 밀어냄
  const bottomWrap=document.createElement("div");
  bottomWrap.style.marginTop="auto";

  const h=document.createElement("h2"); h.className="q"; h.textContent="그 문장을 설명하는 키워드를 골라주세요";
  bottomWrap.appendChild(h);
  const p=document.createElement("p"); p.className="sub"; p.textContent="최대 2개까지 선택할 수 있어요. 배의 모습이 함께 바뀌어요.";
  bottomWrap.appendChild(p);
  const wrap=document.createElement("div"); wrap.className="tag-wrap";
  KEYWORDS.forEach(k=>{
    const t=document.createElement("div");
    t.className="tag"+(state.keywords.includes(k)?" selected":"");
    if(!state.keywords.includes(k) && state.keywords.length>=2) t.className+=" disabled";
    t.textContent=k;
    t.onclick=()=>{
      if(state.keywords.includes(k)) state.keywords=state.keywords.filter(x=>x!==k);
      else if(state.keywords.length<2) state.keywords.push(k);
      render();
    };
    wrap.appendChild(t);
  });
  bottomWrap.appendChild(wrap);
  const next=document.createElement("button");
  next.className="next-btn"; next.textContent="다음"; next.style.marginTop="4px";
  next.onclick=()=>{ state.step="consent"; render(); };
  bottomWrap.appendChild(next);

  d.appendChild(bottomWrap);
  return d;
}

function renderConsent(){
  const d=document.createElement("div");
  d.appendChild(backBtn("keywords"));
  d.appendChild(progress(5,5));
  const h=document.createElement("h2"); h.className="q"; h.textContent="공개 방식과 활용 동의";
  d.appendChild(h);
  const p=document.createElement("p"); p.className="sub"; p.textContent="이름은 선택 사항이며, 실명 대신 별칭을 남길 수도 있어요.";
  d.appendChild(p);

  const list=document.createElement("div"); list.className="option-list";
  ["익명","별칭","실명"].forEach(opt=>{
    const c=document.createElement("div");
    c.className="option-card"+(state.disclose===opt?" selected":"");
    c.textContent=opt;
    c.onclick=()=>{ state.disclose=opt; render(); };
    list.appendChild(c);
  });
  d.appendChild(list);

  const box=document.createElement("div"); box.className="consent-box";
  box.innerHTML=`<label><input type="checkbox" id="consentChk" ${state.consent?"checked":""}>
    <span>제출한 문장이 전시장 내 화면과 웹 아카이브에 공개되고, 아카이브북·결과보고서에 활용되는 것에 동의합니다.</span></label>
    <div class="privacy-note">입력한 지역·상태·문장 외의 개인정보는 저장되지 않습니다. 욕설·혐오·개인정보가 포함된 문장은 비공개 처리될 수 있습니다.</div>`;
  d.appendChild(box);
  box.querySelector("#consentChk").addEventListener("change",(e)=>{ state.consent=e.target.checked; next.disabled=!state.consent; });

  const next=document.createElement("button");
  next.className="next-btn"; next.textContent="제출하기";
  next.disabled=!state.consent;
  next.onclick=()=>{
    entries.unshift({
      region: state.region, state: state.stateId, text: state.text,
      keywords: [...state.keywords], name: state.disclose==="익명" ? "익명" : (state.disclose==="실명" ? "제출자" : "익명 참여자"),
      _new: true,
    });
    state.step="result"; render();
  };
  d.appendChild(next);
  return d;
}

function stateLabel(id){ return (STATES.find(s=>s.id===id)||{}).label || id; }

function renderResult(){
  const d=document.createElement("div");
  d.className="result-wrap";

  const box=document.createElement("div");
  box.className="fade-stage";
  box.style.display="flex"; box.style.flexDirection="column"; box.style.alignItems="center"; box.style.gap="22px"; box.style.width="100%";
  box.innerHTML=`
    <div class="my-card">
      <div class="tagline">MY SENTENCE · 지금 이곳</div>
      <div class="sentence-txt">"${state.text}"</div>
      <div class="meta-row">
        <span>${state.region}</span><span>${stateLabel(state.stateId)}</span>
        ${state.keywords.map(k=>`<span>${k}</span>`).join("")}
      </div>
    </div>
    <p class="note">당신의 문장이 다른 사람들의 기록과 함께 쌓였습니다.</p>
  `;
  const btn=document.createElement("button");
  btn.className="chat-btn"; btn.style.maxWidth="320px";
  btn.innerHTML=`머무름의 지도 보러가기 <span class="arrow">→</span>`;
  btn.onclick=()=>{
    if(window.BottleScene && entries[0]) entries[0].snapshot = window.BottleScene.capture();
    state.step="archive"; render();
  };
  box.appendChild(btn);
  d.appendChild(box);

  // 이 페이지 진입 시: 살짝 줌 + 투명하지만 윤곽이 보이는 유리병이 풍경을 감싸며 등장(ship in a bottle)
  // → 완료된 뒤 박스/버튼이 페이드인
  if(window.BottleScene){
    window.BottleScene.revealBottle(()=>{
      requestAnimationFrame(()=> box.classList.add("show"));
    });
  } else {
    box.classList.add("show");
  }
  return d;
}

function renderArchive(){
  const d=document.createElement("div");
  d.className="archive-screen";
  d.innerHTML=`<div class="archive-header">
      <h2>머무름의 지도</h2>
      <p>지금까지 ${entries.length}개의 문장이 쌓였습니다</p>
    </div>`;

  const filterRow=document.createElement("div"); filterRow.className="filter-row";
  const filters=[{id:"all",label:"전체"}, ...STATES.map(s=>({id:s.id,label:s.label}))];
  filters.forEach(f=>{
    const chip=document.createElement("div");
    chip.className="filter-chip"+(state.filterState===f.id?" active":"");
    chip.textContent=f.label;
    chip.onclick=()=>{ state.filterState=f.id; render(); };
    filterRow.appendChild(chip);
  });
  d.appendChild(filterRow);

  const regionWrap=document.createElement("div"); regionWrap.className="region-select";
  const sel=document.createElement("select");
  sel.innerHTML = `<option value="all">전체 지역</option>` + REGIONS.map(r=>`<option value="${r}" ${state.filterRegion===r?"selected":""}>${r}</option>`).join("");
  sel.value = state.filterRegion;
  sel.onchange=()=>{ state.filterRegion=sel.value; render(); };
  regionWrap.appendChild(sel);
  d.appendChild(regionWrap);

  const filtered = entries.filter(e=>
    (state.filterState==="all" || e.state===state.filterState) &&
    (state.filterRegion==="all" || e.region===state.filterRegion)
  );

  const wall=document.createElement("div"); wall.className="wall";
  if(filtered.length===0){
    const emp=document.createElement("div"); emp.className="empty-note"; emp.textContent="아직 이 조건에 맞는 기록이 없습니다.";
    wall.appendChild(emp);
  } else {
    filtered.forEach((e,i)=>{
      const c=document.createElement("div");
      c.className="wall-card"+(e._new?" new-card":"");
      c.style.animationDelay = (i*0.05)+"s";
      c.innerHTML=`
        ${e.snapshot ? `<img class="snap-thumb" src="${e.snapshot}" alt="내가 만든 병 속 풍경">` : ""}
        <div class="top-meta"><span>${e.region}</span><span class="state-tag">${stateLabel(e.state)}</span></div>
        <div class="txt">"${e.text}"</div>
        <div class="kw-row">${e.keywords.map(k=>`<span class="kw">${k}</span>`).join("")}</div>
      `;
      wall.appendChild(c);
    });
  }
  d.appendChild(wall);

  const restart=document.createElement("button");
  restart.className="restart-btn"; restart.textContent="다시 한 문장 남기기";
  restart.onclick=()=>{
    state = {step:"onboard", region:null, stateId:null, text:"", keywords:[], disclose:"익명", consent:false,
      filterState:state.filterState, filterRegion:state.filterRegion};
    render();
  };
  d.appendChild(restart);

  return d;
}

render();
</script>

<!-- ===========================================================
     병 속 풍경 3D 씬 (BottleScene)
     - 화면 전체 배경으로 표시 (onboard ~ result 단계)
     - 카메라는 항상 배를 중심으로 바라보며, 드래그하면 배를 3D로 둘러볼 수 있음
     - 지역 → 모래 색, 상태 선택 → 배의 항해 방식(정박/출항 연기/귀환/원양 항해/표류),
       키워드(최대 2개) → 캐빈 색상 + 작은 깃발로 배 커스터마이징
     - result 단계에서 캡처(png)하여 아카이브 카드 썸네일로 저장
=========================================================== -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// index.html과 같은 폴더에 이 파일을 같이 둘 것 (상대경로 로드)
const MODEL_URL = "./assets/Scene.glb";

const REGION_SAND = {
  "아산": 0xd9b98c,
  "천안": 0xe0a868,
  "기타 충남": 0xc9b880,
  "충남 밖": 0x9aa7b0,
  "비공개": 0xb0aca4,
};

// 키워드 → 색상 (선택 1번째: 캐빈 색, 2번째: 깃발 색)
const KEYWORD_COLOR = {
  "일": 0x6b7fd7, "관계": 0xe28ea0, "가족": 0xe0a868, "창작": 0xd4b896,
  "익숙함": 0xb89a6a, "주거": 0x8fae8b, "불안": 0x8a6a9a, "자유": 0x7ec8d9,
  "소속감": 0xd6c08a, "우연": 0xaaaaaa,
};

const ACTIVE_STEPS = ["onboard","region","state","sentence","keywords","consent","result"];

function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
function easeOutBounce(x){
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1/d1) return n1*x*x;
  if (x < 2/d1) return n1*(x -= 1.5/d1)*x + 0.75;
  if (x < 2.5/d1) return n1*(x -= 2.25/d1)*x + 0.9375;
  return n1*(x -= 2.625/d1)*x + 0.984375;
}

// 하늘 그라디언트 텍스처 (레퍼런스 사진처럼 위는 파랑, 아래는 뿌연 수평선)
function makeSkyTexture(){
  const c = document.createElement("canvas");
  c.width = 8; c.height = 256;
  const ctx = c.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#7ec3e0");
  grad.addColorStop(0.55, "#bfe3ec");
  grad.addColorStop(1, "#eaf5f1");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(c);
  if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

class BottleScene {
  constructor() {
    this.canvas = document.getElementById("bottleCanvas");
    this.stage = document.getElementById("sceneStage");

    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
    // 픽셀비 상한을 2→1.5로 낮춤: 파도 프래그먼트 셰이더(스펙큘러/프레넬 등)가 전체화면을 덮는
    // 반투명 평면이라, 픽셀비가 커질수록 비용이 거의 제곱으로 늘어남(레티나 2x/3x 기기에서 특히 큼).
    // 로우폴리 스타일이라 1.5로도 체감 화질 차이는 크지 않음.
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    // 프레임 성능 워치독: 초반 ~2초간 평균 프레임타임이 계속 느리면(약 33fps 미만)
    // 자동으로 스펙큘러 반짝임을 끄고 픽셀비를 1로 더 낮춰 저사양 기기에서 렉을 줄임.
    // (한 번만 판단하고 다시는 되돌리지 않음 — 매 프레임 체크하는 비용도 없음)
    this._perfSamples = [];
    this._perfDecided = false;
    // '오가는 중'은 시간이 지날수록 배의 world x가 무한히 커지는데, 이게 커지면 GPU가
    // 쓰는 float32 정밀도가 깨져서(부동소수점 원점 이탈) 파도 위상이 어긋나고 결국
    // seamStretch discard가 오작동해 "바다가 끝난 것처럼" 구멍이 남. 카메라가 항상 배를
    // 따라가고(화면상 배는 늘 제자리) 파도 파장(2.2/1.3/0.8)의 정확한 공배수만큼 순간이동시키면
    // 파형이 완전히 같은 위상이라 화면엔 아무 티도 안 나면서 값만 계속 작게 유지 가능.
    this.WAVE_WRAP_DOMAIN = 114.4; // 2.2*52 = 1.3*88 = 0.8*143 = 114.4

    this.scene = new THREE.Scene();
    this.scene.background = makeSkyTexture();
    // 무한한 바다처럼 보이게 재중심시키는 타일의 가장자리를 안개로 확실히 가리기 위해
    // far를 타일 반경보다 충분히 짧게 잡음 (아래 _buildWater의 타일 크기 참고)
    this.scene.fog = new THREE.Fog(0xbfe3ec, 1.6, 4.8);

    // 망원렌즈 느낌: FOV를 좁혀서 시점을 돌려도 보이는 영역(특히 섬 배경)이 좁게 유지되도록 함
    this.camera = new THREE.PerspectiveCamera(34, 1, 0.05, 30);

    this.scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const sun = new THREE.DirectionalLight(0xfff6e0, 1.0);
    sun.position.set(2.5, 3.5, 2);
    this.scene.add(sun);
    const rim = new THREE.DirectionalLight(0xbfe7ef, 0.3);
    rim.position.set(-3, 1, -2);
    this.scene.add(rim);

    this.world = new THREE.Group();
    this.scene.add(this.world);

    // 해안(모래)·산·선착장을 하나의 그룹으로 묶어서, 등장/퇴장 애니메이션이 항상
    // 이 그룹 하나의 position/visible로만 처리되게 함 — 셋이 따로 움직이거나
    // 따로 토글되며 어긋나는 일이 구조적으로 불가능해짐.
    this.islandGroup = new THREE.Group();
    this.world.add(this.islandGroup);
    // islandGroup 전체가 슬라이드해 나가는 거리 기준값 (섬 등장 X 위치 - 퇴장 X 위치)
    // 예전엔 _buildShore()가 절차적 지오메트리를 만들면서 같이 정했는데, 이제 Shore는
    // 비동기로 로드되는 실제 모델(Rock)이라 지오메트리와 무관하게 여기서 먼저 정해둠.
    this.islandRestX = 0;
    this.islandGoneX = 3.4 - 0.95;

    this._buildWater();
    this._buildDock();
    this._buildBoat();
    this._buildSmokePool();
    this._buildBottleShell();
    // Rock/Beachhouse/Ship 실제 블렌더 모델은 GLB에서 비동기로 로드 — 로드 완료 전엔
    // 그 자리만 비어있고(섬 슬라이드·파도·카메라 등 나머지는 그대로 정상 동작),
    // 로드되는 즉시 islandGroup·boat 안에 그대로 꽂아 넣는 방식.
    this._loadModels();

    // 상태
    this.mode = "stay";
    this.shoreBlend = 1;
    this.shoreTarget = 1;
    this.introPlaying = false;
    this.introDone = false;
    this.visible = false;
    this.driftSeed = Math.random() * 10;
    this.elapsed = 0; // this.clock.getElapsedTime()/getDelta()를 같은 프레임에 함께 쓰면
                       // 서로 델타를 잡아먹어 dt가 항상 0에 가까워지는 문제가 있어 직접 누적함

    // 바람(파도 세기) 세기 — 상태에 따라 다르게, 부드럽게 보간
    this.windTarget = 0.25;
    this.windT = 0.25;

    // 결과 화면: 살짝 줌 + 유리병이 풍경을 감싸는 리빌 연출
    this.bottleRevealed = false;
    this.bottleT = 0;
    this.bottleTarget = 0;
    this.camZoomT = 0;
    this.camZoomTarget = 0;

    // 드래그 오빗(카메라는 항상 배를 중심으로 둠)
    this.orbitYaw = 0;
    this.orbitPitch = 0;
    this._bindDrag();

    // 카메라 각도 튜닝용: ?debug=1로 접속하면 현재 yaw/pitch/radius를 화면에 실시간 표시
    this.debugCam = new URLSearchParams(location.search).has("debug");
    this.camDebugEl = document.getElementById("camDebug");
    if (this.debugCam && this.camDebugEl) this.camDebugEl.classList.add("show");

    this.clock = new THREE.Clock();
    this._resize();
    window.addEventListener("resize", () => this._resize());
    this._animate();
  }

  _resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  _bindDrag() {
    let dragging = false, lastX = 0, lastY = 0;
    const c = this.canvas;
    c.style.touchAction = "none";
    c.style.cursor = "grab";
    c.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      c.style.cursor = "grabbing";
      try { c.setPointerCapture(e.pointerId); } catch (_e) {}
    });
    c.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      // 망원렌즈 + 제한된 회전 범위: 섬/배경을 모델링해야 하는 각도 범위를 좁게 유지
      this.orbitYaw = Math.max(-0.85, Math.min(0.85, this.orbitYaw - dx * 0.0032));
      this.orbitPitch = Math.max(-0.2, Math.min(0.55, this.orbitPitch + dy * 0.0024));
    });
    const end = () => { dragging = false; c.style.cursor = "grab"; };
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
    c.addEventListener("pointerleave", end);
  }

  // dli/waves(Tessendorf 오션 데모)의 OCEAN_FRAGMENT_SOURCE를 참고한 셰이딩.
  // 실제 텍스처 이미지 없이, 노멀 + 프레넬(반사) + 램버트(확산) 수식만으로 바다를 표현.
  // GPU 버텍스 셰이더 기반 물결. 기존엔 JS(CPU)에서 매 프레임 버텍스 배열을 다시 계산해
  // GPU로 재업로드했는데, 이제는 Gerstner 파도 자체를 셰이더 안에서 계산해서
  // JS 쪽은 uniform 값 몇 개만 갱신하면 됨 (사실상 공짜에 가까움).
  //
  // + "흐름(flow)" 효과: 로컬 X좌표를 시간에 따라 밀어내고 타일 경계에서 mod()로 wrap시켜서,
  // 트라이(삼각형) 자체가 배가 향하는 반대 방향으로 실제로 스크롤되는 것처럼 보이게 함.
  // 단, 파도의 "높이/모양"은 wrap 안 된 진짜 월드 좌표로 계산해서 이음매 없이 자연스러움 —
  // wrap으로 인한 순간이동은 안개로 가려지는 타일 가장자리 근처에서만 일어나 거의 안 보임.
  _buildWaterMaterial() {
    return new THREE.ShaderMaterial({
      transparent: true,
      uniforms: {
        uOceanColor: { value: new THREE.Color(0x4bb2e0) },
        uSkyColor: { value: new THREE.Color(0xe8f7ff) },
        uSunDirection: { value: new THREE.Vector3(2.5, 3.5, 2).normalize() },
        uExposure: { value: 1.15 },
        uTime: { value: 0 },
        uBoatX: { value: 0 },
        uChop: { value: 0.13 },
        uAmpScale: { value: 0.5 },
        uFlowBoost: { value: 0 },
        uFlowOffset: { value: 0 },
        // 흐름이 "wrap"되는 주기를 실제 타일 크기보다 훨씬 크게 잡아서(가시 범위 내에서는
        // 사실상 랩어라운드가 거의 안 일어나게) 이음매/트위칭 자체를 원천적으로 드물게 만듦
        uFlowDomain: { value: 90 },
        // 저사양 기기에서 성능 워치독이 끄는 스펙큘러 반짝임 on/off 스위치 (기본 켜짐)
        uSpecOn: { value: 1.0 },
      },
      vertexShader: `
        uniform float uTime;
        uniform float uBoatX;
        uniform float uChop;
        uniform float uAmpScale;
        uniform float uFlowBoost;
        uniform float uFlowOffset;
        uniform float uFlowDomain;
        varying vec3 vWorldPos;

        // JS쪽 this.gerstnerWaves 배열과 값을 반드시 맞춰서 유지할 것 (배 들썩임 계산과 일치시키기 위함)
        vec3 gerstnerSum (vec2 worldXZ, float t) {
          vec3 r = vec3(0.0);
          float k; float theta; float amp; float c;

          k = 6.28318530718 / 2.2;
          theta = k * (1.0 * worldXZ.x + 0.15 * worldXZ.y) - (1.1 + uFlowBoost) * t;
          amp = 0.05 * uAmpScale; c = cos(theta);
          r.x += uChop * amp * 1.0 * c; r.z += uChop * amp * 0.15 * c; r.y += amp * sin(theta);

          k = 6.28318530718 / 1.3;
          theta = k * (0.5 * worldXZ.x + -0.85 * worldXZ.y) - (1.6 + uFlowBoost) * t;
          amp = 0.03 * uAmpScale; c = cos(theta);
          r.x += uChop * amp * 0.5 * c; r.z += uChop * amp * -0.85 * c; r.y += amp * sin(theta);

          k = 6.28318530718 / 0.8;
          theta = k * (-0.7 * worldXZ.x + 0.4 * worldXZ.y) - (2.1 + uFlowBoost) * t;
          amp = 0.018 * uAmpScale; c = cos(theta);
          r.x += uChop * amp * -0.7 * c; r.z += uChop * amp * 0.4 * c; r.y += amp * sin(theta);

          return r;
        }

        void main () {
          float half_ = uFlowDomain * 0.5;
          // 트라이 자체가 흐르도록: 로컬 X를 uFlowOffset만큼 밀고, 훨씬 큰 도메인 경계에서 랩어라운드
          // (도메인이 타일 자체보다 커서, 보이는 범위 안에서는 랩어라운드가 실질적으로 거의 안 일어남)
          float flowX = mod(position.x - uFlowOffset + half_, uFlowDomain) - half_;

          // 파형은 wrap 안 된 "진짜 월드 좌표"(로컬 + 배 위치 오프셋) 기준으로 계산해 이음매 없이 유지
          vec2 worldXZ = vec2(position.x + uBoatX, position.z);
          vec3 wave = gerstnerSum(worldXZ, uTime);

          vec3 finalPos = vec3(flowX + wave.x, wave.y, position.z + wave.z);
          vec4 worldPos = modelMatrix * vec4(finalPos, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uOceanColor;
        uniform vec3 uSkyColor;
        uniform vec3 uSunDirection;
        uniform float uExposure;
        uniform float uSpecOn;
        varying vec3 vWorldPos;

        vec3 hdr (vec3 color, float exposure) {
          return 1.0 - exp(-color * exposure);
        }

        void main () {
          // 흐름(컨베이어) 랩어라운드로 인해, 도메인 경계를 지나가는 순간 원래 이웃한 두 정점이
          // 서로 반대편으로 순간이동하면서 삼각형이 찢어지듯 늘어나는 프레임이 생길 수 있음(트위칭).
          // 그 프레임만 화면공간 미분이 비정상적으로 커지므로 감지해서 버림.
          float seamStretch = fwidth(vWorldPos.x) + fwidth(vWorldPos.z);
          if (seamStretch > 1.3) discard;

          // 플랫 셰이딩: 픽셀별 스크린공간 미분으로 삼각형의 "면" 노멀을 직접 계산
          // (버텍스 노멀 보간을 안 쓰므로 로우폴리 각진 느낌 + 시점 바뀔 때마다 트라이별로 빛이 다르게 반사됨)
          vec3 normal = normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos)));
          if (normal.y < 0.0) normal = -normal;

          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          vec3 sunDir = normalize(uSunDirection);

          float fresnel = 0.03 + 0.65 * pow(1.0 - max(dot(normal, viewDir), 0.0), 5.0);
          vec3 sky = fresnel * uSkyColor;
          float diffuse = clamp(dot(normal, sunDir), 0.0, 1.0);
          vec3 water = (1.0 - fresnel) * uOceanColor * diffuse;

          // 진짜 스펙큘러 하이라이트: 태양 반사 방향과 시선이 맞아떨어지는 면(트라이)만
          // 거의 흰색에 가깝게 반짝임 — 노이즈 없이 트라이 단위로 반짝여서 로우폴리 느낌과도 잘 맞음
          vec3 reflectDir = reflect(-sunDir, normal);
          float spec = pow(max(dot(reflectDir, viewDir), 0.0), 70.0);
          vec3 sparkle = vec3(1.0, 0.99, 0.95) * spec * 2.2 * uSpecOn;

          vec3 color = sky + water + sparkle;
          gl_FragColor = vec4(hdr(color, uExposure), 0.92);
        }
      `,
    });
  }

  _buildWater() {
    // LOD를 확 줄여서 실제로 계산/렌더링해야 할 바다 면적 자체를 작게 잡고(반경↓),
    // 대신 세그먼트를 촘촘히 해서(밀도↑) 가까운 곳은 더 세밀하게 보이도록 함.
    // 안개를 타일 경계보다 확실히 가깝게 잡아서(성능도 가볍고), 가장자리를 가림.
    const SEGMENTS = 32, SIZE = 14;
    const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEGMENTS, SEGMENTS);
    geo.rotateX(-Math.PI / 2);

    // 균일한 격자(엑셀 셀 같은 느낌)를 깨기 위해 각 정점을 셀 크기 대비 무작위로 살짝 흔들어
    // 삼각형 크기·방향이 제각각인 비정형 저폴리 느낌을 냄
    const cellSize = SIZE / SEGMENTS;
    const jitterPos = geo.attributes.position;
    for (let i = 0; i < jitterPos.count; i++) {
      jitterPos.array[i * 3] += (Math.random() - 0.5) * cellSize * 0.6;
      jitterPos.array[i * 3 + 2] += (Math.random() - 0.5) * cellSize * 0.6;
    }
    jitterPos.needsUpdate = true;

    const mat = this._buildWaterMaterial();
    const mesh = new THREE.Mesh(geo, mat);
    this.world.add(mesh);
    this.waterMesh = mesh;
    this.waterTileSize = SIZE;
    this.flowOffset = 0;

    // 배 들썩임 계산(_waveHeightAt)에서 쓰는 값 — 위 셰이더의 gerstnerSum과 반드시 동일하게 유지
    this.gerstnerWaves = [
      { dirX: 1.0, dirZ: 0.15, wavelength: 2.2, ampBase: 0.05, speed: 1.1 },
      { dirX: 0.5, dirZ: -0.85, wavelength: 1.3, ampBase: 0.03, speed: 1.6 },
      { dirX: -0.7, dirZ: 0.4, wavelength: 0.8, ampBase: 0.018, speed: 2.1 },
    ];
  }

  // 실제 블렌더 모델(Rock/Beachhouse/Ship)을 GLB에서 비동기로 로드해서
  // 기존 절차적 지오메트리(Shore/Mountain/Boat 내부) 자리에 그대로 꽂아 넣는다.
  // 참고: 이 GLB엔 텍스처가 전혀 없음(전부 flat color material) — 그래서 재질 색을
  // setHex로 그대로 덮어써도 텍스처가 깨질 걱정 없이 안전하게 틴트 가능.
  // Seagull/Tube 오브젝트도 GLB 안에 있지만 이번엔 요청받은 범위(Rock/Beachhouse/Ship)만
  // 반영함 — 필요해지면 root.getObjectByName("Seagull") / ("Tube")로 같은 방식으로 꺼내 붙이면 됨.
  async _loadModels() {
    try {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync(MODEL_URL);
      const root = gltf.scene;

      const rock = root.getObjectByName("Rock");
      const beachhouse = root.getObjectByName("Beachhouse");
      const ship = root.getObjectByName("Ship");

      if (rock) {
        // Rock의 자식 메쉬들이 전부 같은 재질(인덱스 4)을 공유하는데, 이 재질은
        // Beachhouse 쪽 메쉬 대부분과도 공유돼 있어서 그대로 색을 바꾸면 Beachhouse까지
        // 같이 물듦 — Rock 쪽만 재질을 clone해서 독립시킨 뒤 지역색(applyRegion)을 적용.
        this.rockMats = [];
        rock.traverse((child) => {
          if (child.isMesh) {
            child.material = child.material.clone();
            this.rockMats.push(child.material);
          }
        });
        this.islandGroup.add(rock);
        if (this._pendingRegionHex !== undefined) this._applyRockColor(this._pendingRegionHex);
      }

      if (beachhouse) {
        // 지금은 로드된 그대로(기본 흰 재질) 둠 — 색/텍스처 요청 있으면 나중에 추가
        this.islandGroup.add(beachhouse);
      }

      if (ship) {
        // ship 자신(회전/스케일 항등)의 로컬 상단 좌표 — boat에 꽂아넣기 *전에* 계산해야
        // boat의 실시간 애니메이션 위치가 섞여 들어가지 않음
        const box = new THREE.Box3().setFromObject(ship);
        const topLocal = new THREE.Vector3(
          (box.max.x + box.min.x) / 2 - ship.position.x,
          box.max.y - ship.position.y,
          (box.max.z + box.min.z) / 2 - ship.position.z
        );

        // 캐빈: Ship의 Cabin 메쉬는 원래 재질이 없어서(기본 흰색) 새로 만들어 꽂음 —
        // 예전 절차적 boat의 cabinMat과 동일한 역할(키워드1 → 캐빈 색)
        const cabin = ship.getObjectByName("Cabin");
        if (cabin) {
          this.cabinMat = new THREE.MeshStandardMaterial({ color: 0xf3e6cf, roughness: 0.8 });
          cabin.traverse((c) => { if (c.isMesh) c.material = this.cabinMat; });
        }

        // 마스트/깃발: 새 Ship 모델엔 원래 없어서 최소한으로 다시 붙임(키워드2 → 깃발 기능 유지 목적).
        // 위치는 바운딩박스 상단 추정치라 실제 렌더에서 확인 필요.
        const mast = new THREE.Mesh(
          new THREE.CylinderGeometry(0.012, 0.012, 0.3, 6),
          new THREE.MeshStandardMaterial({ color: 0xb08a5c })
        );
        mast.position.set(topLocal.x, topLocal.y + 0.15, topLocal.z);
        ship.add(mast);

        const flagShape = new THREE.Shape();
        flagShape.moveTo(0, 0); flagShape.lineTo(0.1, -0.03); flagShape.lineTo(0, -0.06); flagShape.closePath();
        this.flagMat = new THREE.MeshStandardMaterial({ color: 0xd9534f, side: THREE.DoubleSide });
        const flag = new THREE.Mesh(new THREE.ShapeGeometry(flagShape), this.flagMat);
        flag.position.set(topLocal.x, topLocal.y + 0.27, topLocal.z);
        flag.visible = false;
        ship.add(flag);
        this.flagMesh = flag;

        // 연기 스폰 지점: Funnel 메쉬 자체의 로컬 지오메트리 바운딩박스 상단 —
        // Funnel의 자식으로 붙여서 Funnel의 회전/스케일에 자동으로 맞물리게 함
        const funnel = ship.getObjectByName("Funnel");
        this.smokeAnchor = new THREE.Object3D();
        if (funnel && funnel.geometry) {
          funnel.geometry.computeBoundingBox();
          const fb = funnel.geometry.boundingBox;
          this.smokeAnchor.position.set((fb.max.x + fb.min.x) / 2, fb.max.y, (fb.max.z + fb.min.z) / 2);
          funnel.add(this.smokeAnchor);
        } else {
          this.smokeAnchor.position.copy(topLocal);
          ship.add(this.smokeAnchor);
        }

        this.boat.add(ship);
        if (this._pendingKeywords) this.applyKeywords(this._pendingKeywords);
      }
    } catch (err) {
      console.error("모델(GLB) 로드 실패:", err);
    }
  }

  _applyRockColor(hex) {
    if (!this.rockMats) { this._pendingRegionHex = hex; return; }
    this.rockMats.forEach((m) => m.color.setHex(hex));
  }

  // 해안에서 물 쪽으로 뻗은 나무 선착장(독)
  _buildDock() {
    const group = new THREE.Group();
    const plankMat = new THREE.MeshStandardMaterial({ color: 0xa9784f, roughness: 0.85 });
    const postMat = new THREE.MeshStandardMaterial({ color: 0x7a5738, roughness: 0.9 });

    const deck = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.035, 0.22), plankMat);
    deck.position.y = 0.06;
    group.add(deck);

    for (let i = -1; i <= 1; i++) {
      const seam = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.006, 0.22), postMat);
      seam.position.set(i * 0.26, 0.079, 0);
      group.add(seam);
    }

    [-0.36, -0.1, 0.16, 0.36].forEach((px) => {
      [1, -1].forEach((s) => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.024, 0.34, 6), postMat);
        post.position.set(px, -0.1, s * 0.08);
        group.add(post);
      });
    });

    group.position.set(0.7, 0, 0.35); // 배가 정박하는 x≈0과 겹치지 않도록 섬(해안) 쪽에 고정
    group.rotation.y = -0.15;
    this.islandGroup.add(group);
    this.dockMesh = group;
  }

  _buildBoat() {
    // 실제 Ship 모델은 _loadModels()에서 비동기로 채워짐. 여기서는 파도 물리/헤딩/뱅킹 등
    // 매 프레임 위치·회전 애니메이션의 기준이 되는 래퍼만 먼저 만들어둠 — 로드 완료 전에도
    // 애니메이션 로직 자체는 그대로 정상 동작(아직 안 보일 뿐).
    const boat = new THREE.Group();
    boat.position.set(0, 0.0, 0);
    this.world.add(boat);
    this.boat = boat;
  }

  _buildSmokePool() {
    this.smokePool = [];
    const geo = new THREE.SphereGeometry(0.045, 8, 8);
    for (let i = 0; i < 8; i++) {
      const mat = new THREE.MeshBasicMaterial({ color: 0xe9e9e9, transparent: true, opacity: 0 });
      const m = new THREE.Mesh(geo, mat);
      m.visible = false;
      this.world.add(m);
      this.smokePool.push({ mesh: m, age: 0, active: false });
    }
    this.smokeSpawnTimer = 0;
  }

  // (이전에 있던 장식용 흰색 스프라이트는 실제 빛을 내는 요소가 아니라
  // 텍스처 없는 사각형이 그대로 보이는 것이어서 제거함)

  // 옆으로 누운 유리병 셸 — 결과 화면에서만 페이드인되어 풍경을 감싸는 "ship in a bottle" 연출
  _buildBottleShell() {
    const pts = [
      new THREE.Vector2(0, -1.55),
      new THREE.Vector2(0.62, -1.5),
      new THREE.Vector2(0.7, -0.9),
      new THREE.Vector2(0.68, 1.0),
      new THREE.Vector2(0.6, 1.25),
      new THREE.Vector2(0.24, 1.5),
      new THREE.Vector2(0.2, 1.75),
    ];
    const geo = new THREE.LatheGeometry(pts, 40);
    geo.rotateZ(Math.PI / 2); // 세워진 병 형태를 옆으로 눕힘 (레퍼런스 사진처럼)

    // 진짜 transmission(굴절)은 Three.js가 별도 렌더패스를 태워서 비용이 큼 —
    // 실제 굴절 없이 얇은 투명 재질 + (아래) 림라이트 조합만으로 "유리 느낌"을 흉내내는 가짜 버전
    this.bottleMat = new THREE.MeshStandardMaterial({
      color: 0xeaf7f2, transparent: true, opacity: 0,
      roughness: 0.15, metalness: 0.05,
      side: THREE.DoubleSide, depthWrite: false,
    });
    const glass = new THREE.Mesh(geo, this.bottleMat);
    glass.renderOrder = 20;

    // 윤곽(rim) — 살짝 확대한 뒷면만 그려서 은은한 유리 테두리를 표현
    this.bottleRimMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0, side: THREE.BackSide, depthWrite: false,
    });
    const rim = new THREE.Mesh(geo, this.bottleRimMat);
    rim.scale.setScalar(1.035);
    rim.renderOrder = 19;

    this.bottleCorkMat = new THREE.MeshStandardMaterial({ color: 0xb08a5c, roughness: 0.85, transparent: true, opacity: 0 });
    const cork = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.45, 16), this.bottleCorkMat);
    cork.rotation.z = Math.PI / 2;
    cork.position.x = -1.85;

    const group = new THREE.Group();
    group.add(rim, glass, cork);
    group.scale.setScalar(1.9);
    group.position.y = 0.18;
    group.visible = false;
    this.scene.add(group);
    this.bottleGroup = group;
  }

  // 온보딩: 배가 화면 중앙에 뽁 하고 나타났다가 물가로 떨어져 정착
  playIntro(onSettled) {
    if (this.introDone) { onSettled && onSettled(); return; }
    this.introPlaying = true;
    this.introStart = this.elapsed;
    this._onSettled = onSettled;
  }

  // 결과 화면 진입: 살짝 줌 + 유리병이 풍경을 감싸며 등장(ship in a bottle) → 완료 후 콜백
  revealBottle(onDone) {
    this.bottleGroup.visible = true;
    this.bottleTarget = 1;
    this.camZoomTarget = 1;
    if (this.bottleRevealed) { onDone && onDone(); return; }
    this.bottleRevealed = true;
    setTimeout(() => onDone && onDone(), 1500);
  }

  applyRegion(region) {
    const hex = REGION_SAND[region] || 0xd9b98c;
    this._applyRockColor(hex);
  }

  applyKeywords(keywords) {
    // Ship 모델이 아직 로드 전이면(cabinMat 없음) 값을 보관해뒀다가 _loadModels()에서 적용
    if (!this.cabinMat) { this._pendingKeywords = keywords; return; }
    const cols = (keywords || []).map((k) => KEYWORD_COLOR[k]);
    this.cabinMat.color.setHex(cols[0] !== undefined ? cols[0] : 0xf3e6cf);
    if (cols[1] !== undefined) {
      this.flagMat.color.setHex(cols[1]);
      this.flagMesh.visible = true;
    } else {
      this.flagMesh.visible = false;
    }
  }

  setMode(mode) {
    if (this.mode === mode) return;
    this.mode = mode;
    this.modeChangedAt = this.elapsed;
    // 모드 전환 시 누적된 배 위치 누산기(_boatEaseX)를 파형-불변 도메인으로 접어서
    // (화면엔 티 안 남) 다음 모드의 target까지의 거리를 작게 되돌려놓음 —
    // 안 그러면 '오가는 중'에서 오래 누적된 큰 값 때문에 다음 모드로 바뀔 때 배가
    // 화면을 몇 바퀴 훑고 지나가듯 보일 수 있음
    if (this._boatEaseX !== undefined) this._boatEaseX = this._wrapWave(this._boatEaseX);
    // 예전엔 여기서 flowOffset을 0으로 리셋했는데, 이게 바로 "모드 바꿀 때 바다가 깜빡/초기화되는"
    // 원인이었음 — flowOffset이 쌓여있는 상태에서 갑자기 0으로 점프하면 흐르는 물 트라이의
    // 로컬 X가 그 순간 순간이동하듯 튐. 이제는 리셋하지 않고 계속 누적시키고,
    // (도메인 배수만큼 넘어갈 때만 _animate에서 시각적 차이 없이 안전하게 wrap함)
    if (mode === "returned") {
      // 섬(해안)은 화면 오른쪽에 있으므로, 배는 왼쪽 먼 바다(화면 밖)에서 시작해
      // 오른쪽으로 향하며 해안에 도착 — 육지를 가로지르지 않도록 반대편에서 접근
      this.returnStartX = -2.4;
      this.boat.position.x = this.returnStartX;
      this._boatEaseX = this.returnStartX;
    }
    // "머무름/떠날 준비"로 바뀔 때는 더 이상 배 위치를 0으로 순간이동시키지 않음 —
    // _animate에서 targetX(0 근처)를 향해 부드럽게 미끄러져 돌아오도록 바뀜(아래 boatEase 참고)
    // 오가는 중 / 아직 모르겠음 → 해안이 사라진 무한한 바다
    this.shoreTarget = (mode === "between" || mode === "unsure") ? 0 : 1;

    // 바람(파도 세기) 세기: 나아가고 있다는 느낌이 들수록 강하게
    const windByMode = { stay: 0.22, leaving: 0.55, returned: 0.75, between: 1, unsure: 0.1 };
    this.windTarget = windByMode[mode] ?? 0.3;
  }

  show(step, appState) {
    this.visible = ACTIVE_STEPS.includes(step);
    this.stage.classList.toggle("visible", this.visible);
    if (!this.visible) return;

    this.applyRegion(appState.region);
    this.setMode(appState.stateId || "stay");
    this.applyKeywords(appState.keywords);

    if (step !== "result") {
      this.bottleTarget = 0;
      this.camZoomTarget = 0;
      this.bottleRevealed = false;
    }
  }

  capture() {
    this.renderer.render(this.scene, this.camera);
    return this.canvas.toDataURL("image/png");
  }

  // 파장(2.2/1.3/0.8)의 공배수(114.4)로 감싸기 — 이 값만큼 위치가 순간이동해도
  // 파형 위상이 완전히 똑같아서 화면상 티가 안 남 (무한 누적으로 인한 정밀도 문제 방지용)
  _wrapWave(x) {
    const D = this.WAVE_WRAP_DOMAIN;
    return x - D * Math.round(x / D);
  }

  // 물 표면 변위와 동일한 수식으로 임의 위치의 파도 높이만 계산 (배를 실제 파도 위에 태우기 위함)
  _waveHeightAt(x, z, t, flowBoost) {
    const ampScale = 0.5 + 0.9 * this.windT;
    let dy = 0;
    for (let w = 0; w < this.gerstnerWaves.length; w++) {
      const wave = this.gerstnerWaves[w];
      const k = (2 * Math.PI) / wave.wavelength;
      const theta = k * (wave.dirX * x + wave.dirZ * z) - (wave.speed + (flowBoost || 0)) * t;
      dy += wave.ampBase * ampScale * Math.sin(theta);
    }
    return dy;
  }

  _spawnSmoke(dt) {
    if (!this.smokeAnchor) return; // Ship 모델(및 Funnel) 로드 전에는 스폰 안 함
    this.smokeSpawnTimer -= dt;
    if (this.smokeSpawnTimer <= 0) {
      this.smokeSpawnTimer = 0.35;
      const free = this.smokePool.find((s) => !s.active);
      if (free) {
        free.active = true; free.age = 0;
        free.mesh.visible = true;
        free.mesh.material.opacity = 0.55;
        free.mesh.scale.setScalar(0.6);
        const wp = new THREE.Vector3();
        this.smokeAnchor.getWorldPosition(wp);
        free.mesh.position.copy(wp);
      }
    }
  }

  _updateSmoke(dt) {
    this.smokePool.forEach((s) => {
      if (!s.active) return;
      s.age += dt;
      s.mesh.position.y += dt * 0.25;
      s.mesh.position.x += dt * 0.03;
      s.mesh.scale.setScalar(0.6 + s.age * 0.6);
      s.mesh.material.opacity = Math.max(0, 0.55 - s.age * 0.5);
      if (s.age > 1.1) { s.active = false; s.mesh.visible = false; }
    });
  }

  _animate() {
    requestAnimationFrame(() => this._animate());
    // 주의: getElapsedTime()과 getDelta()를 같은 프레임에서 함께 호출하면
    // 서로 델타를 소비해버려 dt가 항상 0에 가까워지는 문제가 있었음(연기가 멈춰있던 원인).
    // getDelta()만 호출하고 elapsed는 직접 누적한다.
    const dt = Math.min(0.05, this.clock.getDelta());
    this.elapsed += dt;
    const t = this.elapsed;

    // 성능 워치독: 시작 후 첫 2초 동안 프레임타임 샘플을 모아서 평균 fps가 낮으면
    // (약 33fps 미만) 스펙큘러 반짝임을 끄고 픽셀비를 1로 낮춰 한 번만 자동 절전.
    if (!this._perfDecided) {
      this._perfSamples.push(dt);
      if (this.elapsed > 2.0) {
        this._perfDecided = true;
        const avgDt = this._perfSamples.reduce((a, b) => a + b, 0) / this._perfSamples.length;
        if (avgDt > 0.03) { // 평균 fps < ~33
          this.waterMesh.material.uniforms.uSpecOn.value = 0.0;
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1));
        }
        this._perfSamples = null;
      }
    }

    // 바람(파도 세기) 보간
    this.windT += (this.windTarget - this.windT) * Math.min(1, dt * 1.5);

    // 물결: dli/waves(Tessendorf 오션 데모)를 참고한 Gerstner 방식이지만, 이제 실제 계산은
    // GPU 버텍스 셰이더 안에서 일어남 — JS는 uniform 값 몇 개만 매 프레임 갱신하면 됨.
    // 무한한 바다처럼 보이게 타일을 배 위치로 재중심시키는 것도 그대로 유지.
    this.waterMesh.position.x = this.boat.position.x;

    // flowBoost/flowSpeed를 즉시 스냅하지 않고 windT처럼 부드럽게 보간 — 모드 전환 순간
    // 파도 흐름 속도가 갑자기 뚝 끊기거나 튀지 않고 자연스레 가속/감속되도록
    const flowBoostTarget = this.mode === "between" ? 2.0 : (this.mode === "leaving" || this.mode === "returned" ? 0.5 : 0);
    this._currentFlowBoost = (this._currentFlowBoost ?? flowBoostTarget) + (flowBoostTarget - (this._currentFlowBoost ?? flowBoostTarget)) * Math.min(1, dt * 1.5);
    const flowBoost = this._currentFlowBoost;
    // 컨베이어 흐름 효과는 '오가는 중'에서만, 속도도 절반으로
    // 컨베이어 흐름: 오가는 중(계속 항해) + 돌아온 사람(해안으로 접근 중)일 때 적용
    const flowSpeedTarget = this.mode === "between" ? 0.8 : (this.mode === "returned" ? 0.5 : 0);
    this._flowSpeed = (this._flowSpeed ?? flowSpeedTarget) + (flowSpeedTarget - (this._flowSpeed ?? flowSpeedTarget)) * Math.min(1, dt * 1.5);
    this.flowOffset += this._flowSpeed * dt;
    // 도메인의 정수배만큼 넘어가면 시각적으로 완전히 동일한 지점이므로(mod 주기성),
    // 화면상 아무 티 안 나게 domain만큼 빼서 값이 무한정 커지는 것만 방지
    if (this.flowOffset > 90) this.flowOffset -= 90;

    const wu = this.waterMesh.material.uniforms;
    wu.uTime.value = t;
    wu.uBoatX.value = this.boat.position.x;
    wu.uChop.value = 0.32 * (0.4 + 0.6 * this.windT);
    wu.uAmpScale.value = 0.5 + 0.9 * this.windT;
    wu.uFlowBoost.value = flowBoost;
    wu.uFlowOffset.value = this.flowOffset;

    if (this.introPlaying) {
      // 인트로: 팝(스케일업) → 낙하(바운스) → 정착
      const et = t - this.introStart;
      const popDur = 0.5, fallDur = 0.85;
      if (et < popDur) {
        const p = et / popDur;
        this.boat.scale.setScalar(Math.min(1, p * 1.5));
        this.boat.position.y = 0.95;
        this.boat.position.x = 0;
      } else if (et < popDur + fallDur) {
        const p = (et - popDur) / fallDur;
        this.boat.scale.setScalar(1);
        this.boat.position.y = THREE.MathUtils.lerp(0.95, 0.0, easeOutBounce(p));
      } else {
        this.boat.scale.setScalar(1);
        this.boat.position.y = 0.0;
        this.introPlaying = false;
        this.introDone = true;
        this._onSettled && this._onSettled();
      }
    } else {
      // 섬 전체(해안+산+선착장) 등장/퇴장: islandGroup 하나의 position/visible만 조작하므로
      // 세 요소가 항상 같은 자리를 유지하며 절대 따로 어긋날 수 없음 (오가는 중 / 아직 모르겠음 → 무한한 바다)
      this.shoreBlend += (this.shoreTarget - this.shoreBlend) * Math.min(1, dt * 2.2);
      this.islandGroup.position.x = THREE.MathUtils.lerp(this.islandGoneX, this.islandRestX, this.shoreBlend);
      this.islandGroup.visible = this.shoreBlend > 0.5;

      let rotZ = 0;
      let targetX = 0;

      // '돌아온 사람' 도착 속도를 한 번 더 늦춤(3.6초→6.5초). '오가는 중'도 같은 속도 기준을 공유
      const TRAVEL_DURATION = 6.5;
      const TRAVEL_SPEED = 2.4 / TRAVEL_DURATION;

      if (this.mode === "returned") {
        // 섬은 화면 오른쪽에 있다고 가정 — 왼쪽 먼 바다에서 시작해 오른쪽(해안)으로 도착 (0.5배속)
        const et = t - this.modeChangedAt;
        const p = Math.min(1, et / TRAVEL_DURATION);
        targetX = THREE.MathUtils.lerp(this.returnStartX ?? -2.4, 0, easeOutCubic(p));
        rotZ += -0.06 * (1 - p);
      } else if (this.mode === "leaving") {
        targetX = 0; // 정박한 채로 연기만 피어오름
      } else if (this.mode === "between") {
        // 해안에서 왼쪽으로 계속 나아가는 중 — 다른 선택지를 고르기 전까지 멈추지 않고 등속 이동.
        // 카메라가 항상 배를 따라가므로(아래 카메라 계산 참고), 배는 화면상 제자리에 있는 것처럼
        // 보이고 대신 파도(월드 고정)가 옆으로 계속 흘러가는 것처럼 보임
        const et = t - this.modeChangedAt;
        targetX = -TRAVEL_SPEED * et;
        rotZ += Math.sin(t * 0.7) * 0.015; // 항해 중 미세한 좌우 롤
      } else if (this.mode === "unsure") {
        targetX = 0; // 무한한 바다에서 표류 — 제자리
      } else {
        targetX = Math.sin(t * 0.4) * 0.03; // 머무르는 중: 제자리 정박
      }

      // 연기: 머무르는 중 / 아직 모르겠음을 제외한 모든 상태에서 뿜어져 나옴
      if (this.mode !== "stay" && this.mode !== "unsure") {
        this._spawnSmoke(dt);
      }

      // 배는 자기 위치(targetX)의 실제 파도 높이만큼 들썩임 — 제자리인 경우 제자리에서 출렁이고,
      // 이동 중이면 지나가는 파도를 그대로 타면서 오르내림
      // 배 위치를 targetX로 순간 이동시키지 않고 부드럽게 미끄러지듯 따라가게 함(boatEaseX).
      // 이렇게 하면 모드를 바꾸는 순간 배(그리고 배 위치로 재중심되는 바다 타일)가
      // 텔레포트하듯 튀지 않고 자연스럽게 이어짐. '돌아온 사람'처럼 targetX 자체가 이미
      // 연속적인 곡선이면 diff가 거의 0이라 기존 움직임과 동일하게 유지됨.
      if (this._boatEaseX === undefined) this._boatEaseX = targetX;
      this._boatEaseX += (targetX - this._boatEaseX) * Math.min(1, dt * 3.0);
      const boatX = this._wrapWave(this._boatEaseX);

      const waveY = this._waveHeightAt(boatX, 0, t, this._currentFlowBoost);
      const waveSlope = this._waveHeightAt(boatX + 0.12, 0, t, this._currentFlowBoost) - this._waveHeightAt(boatX - 0.12, 0, t, this._currentFlowBoost);

      // 뱃머리 방향: 기본은 섬(+X)을 등지고, '돌아온 사람'일 때만 섬을 향해 다가오는 방향으로.
      // 라디안 최단 경로로 부드럽게 회전(급격히 홱 돌지 않도록)
      const headingTarget = this.mode === "returned" ? 0 : Math.PI;
      if (this.headingY === undefined) this.headingY = headingTarget;
      let headingDiff = headingTarget - this.headingY;
      headingDiff = ((headingDiff + Math.PI) % (2 * Math.PI)) - Math.PI;
      this.headingY += headingDiff * Math.min(1, dt * 1.5);

      this.boat.position.x = boatX;
      this.boat.position.y = 0.0 + waveY;
      this.boat.rotation.z = rotZ + waveSlope * 0.9;
      this.boat.rotation.y = this.headingY + Math.sin(t * 0.5) * 0.08;
    }

    this._updateSmoke(dt);

    // 병 리빌 보간 (결과 화면 진입 시 살짝 줌 + 유리병 페이드인)
    this.bottleT += (this.bottleTarget - this.bottleT) * Math.min(1, dt * 2.2);
    this.camZoomT += (this.camZoomTarget - this.camZoomT) * Math.min(1, dt * 2.2);
    this.bottleMat.opacity = 0.28 * this.bottleT;
    this.bottleRimMat.opacity = 0.62 * this.bottleT;
    this.bottleCorkMat.opacity = 0.9 * this.bottleT;
    if (this.bottleT < 0.01) this.bottleGroup.visible = false;

    // 카메라: 항상 배를 중심으로, 드래그하면 (제한된 범위에서) 궤도를 돌며 배를 3D로 둘러볼 수 있음
    const boatPos = this.boat.position;
    const radius = THREE.MathUtils.lerp(3, 5.5, this.camZoomT); // 너무 가깝지 않게
    const camY = THREE.MathUtils.lerp(0.28, 1.1, this.camZoomT);
    const baseYaw = 0.06, basePitch = 0.2; // 좌측 상단에서 내려다보던 느낌을 줄여 좀 더 정면·완만한 각도로
    const yaw = baseYaw + this.orbitYaw;
    const pitch = basePitch + this.orbitPitch;
    this.camera.position.set(
      boatPos.x + radius * Math.sin(yaw) * Math.cos(pitch),
      camY + radius * Math.sin(pitch),
      radius * Math.cos(yaw) * Math.cos(pitch)
    );
    // 시점이 수면 아래로 내려가지 않도록 하드 클램프 (오빗/줌 조합과 무관하게 항상 보장)
    this.camera.position.y = Math.max(this.camera.position.y, 0.16);
    this.camera.lookAt(boatPos.x, 0.08, 0);

    // 디버그 모드: 드래그로 원하는 구도를 잡은 뒤, 여기 찍히는 숫자를 그대로
    // baseYaw/basePitch/radius 상수에 붙여넣으면 그 구도가 기본 시점이 됨
    if (this.debugCam && this.camDebugEl) {
      this.camDebugEl.textContent =
        `yaw: ${yaw.toFixed(3)}\npitch: ${pitch.toFixed(3)}\nradius: ${radius.toFixed(2)}\n(드래그로 각도 잡고 이 값을 baseYaw/basePitch/radius에 붙여넣기)`;
    }

    if (this.visible) this.renderer.render(this.scene, this.camera);
  }
}

try {
  window.BottleScene = new BottleScene();
} catch (err) {
  console.error("BottleScene 초기화 실패:", err);
}
</script>
</body>
</html>
